<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pippy's Word Quest - Grade 4 Spelling Bee Words</title>
<style>
  :root {
    --primary: #00bcd4; --primary-dark: #00838f; --secondary: #ff9800;
    --bg: linear-gradient(135deg, #e0f7fa 0%, #80deea 100%);
    --card: #fff; --text: #263238; --correct: #2e7d32; --wrong: #c62828;
  }
  * { box-sizing: border-box; font-family: 'Fredoka','Comic Sans MS','Chalkboard SE',sans-serif; }
  body { background: var(--bg); margin: 0; padding: 12px; min-height: 100vh; display: flex; justify-content: center; color: var(--text); }
  .card { background: var(--card); border-radius: 24px; box-shadow: 0 12px 32px rgba(0,0,0,.15); width: 100%; max-width: 700px; padding: 22px; align-self: flex-start; margin-top: 8px; }
  h1 { margin: 0 0 4px; color: var(--primary-dark); font-size: 1.6rem; }
  h2 { margin: 0 0 8px; color: var(--primary-dark); }
  h3 { margin: 14px 0 6px; color: var(--primary-dark); font-size: 1rem; }
  .sub { margin: 0 0 10px; opacity: .8; }
  .center { text-align: center; }
  .hidden { display: none !important; }
  .big-emoji { font-size: 4.2rem; line-height: 1.1; }
  .btn { background: var(--primary); color: #fff; border: 0; border-radius: 14px; padding: 12px 22px; font-size: 1.05rem; font-weight: bold; cursor: pointer; box-shadow: 0 4px 0 var(--primary-dark); margin: 6px 4px; }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--primary-dark); }
  .btn.alt { background: var(--secondary); box-shadow: 0 4px 0 #e65100; }
  .btn.ghost { background: #eceff1; color: var(--text); box-shadow: 0 4px 0 #b0bec5; }
  .seg { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
  .seg button { border: 3px solid #b2ebf2; background: #fff; color: var(--primary-dark); border-radius: 999px; padding: 7px 14px; font-weight: bold; font-size: .95rem; cursor: pointer; }
  .seg button.on { background: var(--primary); border-color: var(--primary); color: #fff; }
  .stats { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin: 12px 0; }
  .stat { background: #e0f7fa; border-radius: 14px; padding: 8px 16px; font-weight: bold; color: var(--primary-dark); }
  .topbar { display: flex; justify-content: space-between; align-items: center; font-weight: bold; color: var(--primary-dark); margin-bottom: 8px; gap: 8px; }
  .bar { height: 12px; background: #e0f7fa; border-radius: 8px; overflow: hidden; margin-bottom: 14px; }
  .bar > div { height: 100%; width: 0; background: linear-gradient(90deg, var(--primary), #4dd0e1); transition: width .3s; }
  .tag { display: inline-block; border-radius: 999px; padding: 3px 12px; font-size: .8rem; font-weight: bold; color: #fff; }
  .t-pos { background: #7e57c2; } .t-meaning { background: #00897b; } .t-usage { background: #ef6c00; } .t-spelling { background: #d81b60; }
  .question { font-size: 1.22rem; font-weight: bold; line-height: 1.45; margin: 10px 0 14px; min-height: 3.6em; }
  .options { display: grid; gap: 10px; }
  .opt { background: #f5f5f5; border: 3px solid #cfd8dc; border-radius: 14px; padding: 12px 14px; font-size: 1.05rem; font-weight: bold; text-align: left; cursor: pointer; color: var(--text); display: flex; gap: 10px; align-items: center; }
  .opt .k { background: #cfd8dc; border-radius: 8px; width: 28px; height: 28px; flex: none; display: grid; place-items: center; font-size: .9rem; }
  .opt:hover:not(:disabled) { background: #e0f7fa; border-color: var(--primary); }
  .opt:disabled { cursor: default; }
  .opt.correct { background: #e8f5e9; border-color: var(--correct); color: var(--correct); }
  .opt.wrong { background: #ffebee; border-color: var(--wrong); color: var(--wrong); }
  .feedback { margin-top: 14px; padding: 12px 14px; border-radius: 14px; font-weight: bold; }
  .feedback.good { background: #e8f5e9; color: var(--correct); }
  .feedback.bad { background: #ffebee; color: var(--wrong); }
  .feedback small { display: block; font-weight: normal; color: var(--text); margin-top: 4px; }
  .skills { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; margin: 10px 0; }
  .skill { border-radius: 12px; padding: 8px; background: #f5f5f5; font-weight: bold; }
  .skill .n { font-size: 1.3rem; }
  .missed { text-align: left; margin: 10px 0; max-height: 320px; overflow: auto; }
  .missed .item { background: #fff8e1; border-left: 6px solid var(--secondary); border-radius: 10px; padding: 8px 12px; margin: 8px 0; font-size: .95rem; }
  .missed .item b { color: var(--primary-dark); }
  .wordlist { text-align: left; max-height: 300px; overflow: auto; margin: 6px 0; }
  .wordlist div { padding: 6px 4px; border-bottom: 1px solid #eceff1; font-size: .95rem; }
  .wordlist i { color: #7e57c2; }
  .small { font-size: .85rem; opacity: .75; }
  details summary { cursor: pointer; color: var(--primary-dark); font-weight: bold; margin-top: 8px; }
</style>
</head>
<body>
<div class="card">

  <!-- START -->
  <section id="start" class="center">
    <div class="big-emoji">🐧🐝</div>
    <h1>Pippy's Word Quest</h1>
    <p class="sub">Grade 4 Spelling Bee Words &mdash; parts of speech, meanings, usage &amp; spelling</p>

    <h3>Which words?</h3>
    <div class="seg" id="daySeg"></div>
    <h3>Which skill?</h3>
    <div class="seg" id="skillSeg"></div>

    <p id="roundInfo"></p>
    <div class="stats">
      <div class="stat">Rounds played: <span id="sRounds">0</span></div>
      <div class="stat">Best: <span id="sBest">&ndash;</span></div>
    </div>
    <button class="btn" id="startBtn">Start Round 🚀</button>
    <div class="small">Tip: press 1, 2 or 3 to answer, Enter for next.</div>
    <details><summary>Study the word list</summary><div class="wordlist" id="wordList"></div></details>
    <div><button class="btn ghost" id="resetBtn" style="font-size:.8rem;padding:6px 12px">Reset progress</button></div>
  </section>

  <!-- QUIZ -->
  <section id="quiz" class="hidden">
    <div class="topbar"><span id="roundLbl"></span><span id="qLbl"></span><span id="scoreLbl">⭐ 0</span></div>
    <div class="bar"><div id="barFill"></div></div>
    <span class="tag" id="qTag"></span>
    <div class="question" id="qText"></div>
    <div class="options" id="opts"></div>
    <div class="feedback hidden" id="fb"></div>
    <div class="center"><button class="btn hidden" id="nextBtn">Next ➜</button></div>
  </section>

  <!-- RESULT -->
  <section id="result" class="hidden center">
    <div class="big-emoji" id="rEmoji">🏆</div>
    <h2 id="rTitle">Round complete!</h2>
    <div class="stats"><div class="stat" id="rScore"></div><div class="stat" id="rStars"></div></div>
    <div class="skills" id="rSkills"></div>
    <div class="missed" id="missed"></div>
    <button class="btn alt hidden" id="retryBtn">Practice missed words 🔁</button>
    <button class="btn" id="againBtn">New round 🚀</button>
    <button class="btn ghost" id="homeBtn">Home</button>
  </section>
</div>

eling when pain or worry goes away"},{"day":"Tue","word":"lunar","pos":"adjective","meaning":"having to do with the moon"},{"day":"Tue","word":"boycotting","pos":"verb","meaning":"refusing to buy from or deal with someone to show you disagree"},{"day":"Tue","word":"molten","pos":"adjective","meaning":"melted by great heat"},{"day":"Tue","word":"elite","pos":"adjective","meaning":"the very best; top-level"},{"day":"Tue","word":"woven","pos":"verb","meaning":"made by crossing threads or strips over and under each other"},{"day":"Tue","word":"proclaim","pos":"verb","meaning":"to announce something loudly and publicly"},{"day":"Tue","word":"thimble","pos":"noun","meaning":"a little cap that protects your finger when you sew"},{"day":"Tue","word":"custody","pos":"noun","meaning":"the care and protection of someone or something"},{"day":"Tue","word":"granola","pos":"noun","meaning":"a crunchy food of baked oats, nuts, and dried fruit"},{"day":"Tue","word":"warrior","pos":"noun","meaning":"a fighter or soldier, especially in old times"},{"day":"Tue","word":"rigid","pos":"adjective","meaning":"stiff and hard to bend"},{"day":"Tue","word":"fierce","pos":"adjective","meaning":"wild, angry, and ready to attack"},{"day":"Tue","word":"laughter","pos":"noun","meaning":"the sound of laughing"},{"day":"Wed","word":"salary","pos":"noun","meaning":"money paid regularly to someone for their job"},{"day":"Wed","word":"disappear","pos":"verb","meaning":"to go out of sight"},{"day":"Wed","word":"hurdler","pos":"noun","meaning":"a runner who jumps over barriers in a race"},{"day":"Wed","word":"lounge","pos":"verb","meaning":"to sit or lie in a lazy, relaxed way"},{"day":"Wed","word":"jovial","pos":"adjective","meaning":"cheerful and full of good fun"},{"day":"Wed","word":"inferior","pos":"adjective","meaning":"not as good; lower in quality"},{"day":"Wed","word":"December","pos":"noun","meaning":"the twelfth month of the year"},{"day":"Wed","word":"duration","pos":"noun","meaning":"how long something lasts"},{"day":"Wed","word":"dictionary","pos":"noun","meaning":"a book or app that lists words in ABC order with their meanings"},{"day":"Wed","word":"business","pos":"noun","meaning":"a store, company, or place where people work to sell goods or services"},{"day":"Wed","word":"reinstate","pos":"verb","meaning":"to put someone or something back in its old place or job"},{"day":"Wed","word":"examine","pos":"verb","meaning":"to look at something closely and carefully"},{"day":"Wed","word":"versus","pos":"preposition","meaning":"against"},{"day":"Wed","word":"lullaby","pos":"noun","meaning":"a soft song sung to help a baby fall asleep"},{"day":"Wed","word":"opposite","pos":"adjective","meaning":"completely different"},{"day":"Wed","word":"tissues","pos":"plural noun","meaning":"thin, soft papers"},{"day":"Wed","word":"marlin","pos":"noun","meaning":"a big ocean fish with a long, pointed spear-like nose"}];

 closed\". Without the buttons, the shirt could not stay closed."},{"type":"meaning","q":"Where would you most likely find buttons?","options":["on a tree branch","in a fish tank","on a coat"],"ans":2,"hint":"The answer is \"on a coat\". Coats often have buttons to keep them closed."},{"type":"meaning","q":"Which of these things usually has buttons?","options":["a winter coat","a banana","a soccer ball"],"ans":0,"hint":"The answer is \"a winter coat\". A winter coat is clothing, and buttons close clothes."},{"type":"meaning","q":"Which of these does the same job as buttons on a jacket?","options":["a zipper","a hood","a pocket"],"ans":0,"hint":"The answer is \"a zipper\". A zipper also closes a jacket, just like buttons."},{"type":"meaning","q":"What would you do with buttons?","options":["pour them into a glass to drink","push them through holes to close your shirt","plant them to grow flowers"],"ans":1,"hint":"The answer is \"push them through holes to close your shirt\". Buttons are pushed through holes to close clothes."},{"type":"usage","q":"Fill in the blank: 'I can't close my sweater because the ____ are too big for the holes.'","options":["buttons","wetlands","butterflies"],"ans":0,"hint":"The answer is \"buttons\". Buttons go through holes to close a sweater."},{"type":"usage","q":"Which sentence uses BUTTONS correctly?","options":["We swam in the buttons at the beach.","Mom sewed the loose buttons back onto my coat.","The buttons sang a song in the tree."],"ans":1,"hint":"The answer is \"Mom sewed the loose buttons back onto my coat.\". Buttons are sewn onto clothes like coats."},{"type":"usage","q":"Which word fits: Jada's doll has a tiny coat with little round ____ on the front.","options":["buttons","basements","tractors"],"ans":0,"hint":"The answer is \"buttons\". Little round things on the front of a coat are buttons."},{"type":"usage","q":"Fill in the blank: 'Grandpa keeps extra ____ in a tin so he can fix shirts.'","options":["buttons","basements","wetlands"],"ans":0,"hint":"The answer is \"buttons\". You fix a shirt by sewing on new buttons."},{"type":"usage","q":"Which word fits: A clown's big jacket had giant polka-dot ____ to keep it closed.","options":["burlap","buttons","lullaby"],"ans":1,"hint":"The answer is \"buttons\". Buttons keep a jacket closed."},{"type":"spelling","q":"Which is the correct spelling?","options":["buttons","buttens","butens"],"ans":0,"hint":"The answer is \"buttons\". Buttons has double t and ends with -ons."},{"type":"spelling","q":"Which word is spelled correctly in the sentence? 'My shirt has six ____.'","options":["buttons","buttans","butons"],"ans":0,"hint":"The answer is \"buttons\". Buttons is spelled b-u-t-t-o-n-s."},{"type":"spelling","q":"Fill the missing letters: b_tt_ns","options":["a, e","o, a","u, o"],"ans":2,"hint":"The answer is \"u, o\". Put in u and o to spell b-u-t-t-o-n-s."},{"type":"spelling","q":"Which of these words is spelled correctly?","options":["buttonz","buttins","buttons"],"ans":2,"hint":"The answer is \"buttons\". The plural ending here is -s, and the middle vowel is o."}],"cuddle":[{"type":"pos","q":"What part of speech is CUDDLE in: 'I like to cuddle my puppy at bedtime.'?","options":["adjective","verb","noun"],"ans":1,"hint":"The answer is \"verb\". Cuddle is the action I do with my puppy."},{"type":"pos","q":"Which sentence uses CUDDLE as a verb?","options":["The kids cuddle the baby goats at the farm.","The baby gave me a big cuddle.","We had a long cuddle on the couch."],"ans":0,"hint":"The answer is \"The kids cuddle the baby goats at the farm.\". In that sentence, cuddle is the action the kids do."},{"type":"pos","q":"A verb is an action word. Which kind of word is CUDDLE in: 'Kittens cuddle together to stay warm.'?","options":["preposition","adverb","verb"],"ans":2,"hint":"The answer is \"verb\". Cuddle tells what the kittens do."},{"type":"pos","q":"Which word is a verb: cuddle, kelp, puffy?","options":["cuddle","kelp","puffy"],"ans":0,"hint":"The answer is \"cuddle\". Cuddle is an action; kelp is a thing and puffy describes."},{"type":"pos","q":"In 'Please cuddle your little brother when he is sad,' what does CUDDLE do?","options":["names a place","shows an action","describes a noun"],"ans":1,"hint":"The answer is \"shows an action\". A verb shows an action, like cuddling someone."},{"type":"meaning","q":"What does CUDDLE mean?","options":["to hold someone close and hug them","to shout very loudly","to run away very fast"],"ans":0,"hint":"The answer is \"to hold someone close and hug them\". When you cuddle, you hold someone close in a hug."},{"type":"meaning","q":"Read: 'When the storm was loud, Mia cuddled her teddy bear.' What did Mia do?","options":["held it close","threw it away","washed it"],"ans":0,"hint":"The answer is \"held it close\". Mia hugged her bear close to feel safe."},{"type":"meaning","q":"Which word means almost the same as CUDDLE?","options":["scold","snuggle","kick"],"ans":1,"hint":"The answer is \"snuggle\". To snuggle is to hold someone close, just like cuddle."},{"type":"meaning","q":"Which is the opposite of CUDDLE?","options":["snuggle","hug","push away"],"ans":2,"hint":"The answer is \"push away\". Pushing someone away is the opposite of holding them close."},{"type":"meaning","q":"Which of these shows someone cuddling?","options":["A dad holds his sleepy baby close.","A boy kicks a ball across the field.","A girl writes her name on a test."],"ans":0,"hint":"The answer is \"A dad holds his sleepy baby close.\". Holding a baby close is cuddling."},{"type":"meaning","q":"Which would be the best thing to cuddle?","options":["a prickly cactus","a sleepy kitten","a hot stove"],"ans":1,"hint":"The answer is \"a sleepy kitten\". A soft, sleepy kitten is safe to hold close."},{"type":"usage","q":"Fill in the blank: 'My little sister likes to ____ her stuffed bunny at night.'","options":["disappear","proclaim","cuddle"],"ans":2,"hint":"The answer is \"cuddle\". She hugs her bunny m roar."},{"type":"usage","q":"Which word fits: The sad movie made Dad cry, so Mom handed him some ____.","options":["wetlands","tissues","butterflies"],"ans":1,"hint":"The answer is \"tissues\". Tissues help wipe away tears."},{"type":"usage","q":"Please throw your used ____ in the trash can.","options":["tissues","buttons","property"],"ans":0,"hint":"The answer is \"tissues\". You throw away tissues after you use them."},{"type":"usage","q":"Which word fits: Ben's nose was runny all day, so he kept a pack of ____ in his pocket.","options":["granola","tissues","custody"],"ans":1,"hint":"The answer is \"tissues\". A runny nose needs tissues."},{"type":"spelling","q":"Which is the correct spelling?","options":["tisues","tishues","tissues"],"ans":2,"hint":"The answer is \"tissues\". Tissues has two s's after the i."},{"type":"spelling","q":"Which word is spelled correctly in the sentence: 'Can I have some ____?'","options":["tissues","tisshues","tissuse"],"ans":0,"hint":"The answer is \"tissues\". Tissues is t-i-s-s-u-e-s."},{"type":"spelling","q":"Fill the missing letters: ti_su_s","options":["h and e","s and e","s and a"],"ans":1,"hint":"The answer is \"s and e\". The word is t-i-s-s-u-e-s."},{"type":"spelling","q":"Which spelling is right for soft papers for your nose?","options":["tissues","tissus","tisseus"],"ans":0,"hint":"The answer is \"tissues\". Tissues ends with u-e-s."}],"marlin":[{"type":"pos","q":"What part of speech is MARLIN in: 'The fisherman saw a marlin jump.'?","options":["noun","verb","adjective"],"ans":0,"hint":"The answer is \"noun\". Marlin names an animal, so it is a noun."},{"type":"pos","q":"A word that names an animal or thing is a noun. Which kind of word is MARLIN?","options":["preposition","noun","adverb"],"ans":1,"hint":"The answer is \"noun\". A marlin is a fish, and animals are nouns."},{"type":"pos","q":"Which word is a noun?","options":["proclaim","marlin","beneath"],"ans":1,"hint":"The answer is \"marlin\". Marlin names a fish; beneath is a preposition and proclaim is a verb."},{"type":"pos","q":"In 'A huge marlin swam past our boat,' which word is a noun?","options":["marlin","huge","swam"],"ans":0,"hint":"The answer is \"marlin\". Marlin names the fish; huge describes it and swam is the action."},{"type":"pos","q":"Which word is the same part of speech as MARLIN?","options":["opposite","examine","kelp"],"ans":2,"hint":"The answer is \"kelp\". Marlin and kelp are both nouns."},{"type":"meaning","q":"What is a MARLIN?","options":["a big ocean fish with a long pointed nose","a small farm bird","a type of tree"],"ans":0,"hint":"The answer is \"a big ocean fish with a long pointed nose\". A marlin is a big fish with a spear-like nose."},{"type":"meaning","q":"Where would you find a MARLIN?","options":["in a barn","in a desert","in the ocean"],"ans":2,"hint":"The answer is \"in the ocean\". Marlins are ocean fish."},{"type":"meaning","q":"Which body part makes a MARLIN easy to spot?","options":["its fluffy tail","its four legs","its long, pointed nose"],"ans":2,"hint":"The answer is \"its long, pointed nose\". A marlin has a long, spear-like nose."},{"type":"meaning","q":"Which animal is most like a MARLIN?","options":["a swordfish","a robin","a horse"],"ans":0,"hint":"The answer is \"a swordfish\". A swordfish is also a big ocean fish with a long pointed nose."},{"type":"meaning","q":"'We saw a marlin leap out of the water.' What did we see?","options":["a seagull","a big fish","a boat"],"ans":1,"hint":"The answer is \"a big fish\". A marlin is a big fish that can jump out of the water."},{"type":"meaning","q":"Which of these could be a MARLIN?","options":["a large blue fish with a spear-like nose","a green frog on a log","a tiny goldfish in a bowl"],"ans":0,"hint":"The answer is \"a large blue fish with a spear-like nose\". Marlins are large fish with spear-like noses."},{"type":"usage","q":"The fishing boat chased a giant ____ across the ocean.","options":["marlin","tractor","awning"],"ans":0,"hint":"The answer is \"marlin\". A giant ocean fish is a marlin."},{"type":"usage","q":"Which sentence uses MARLIN correctly?","options":["I wrote a letter with my marlin.","The marlin swam fast through the deep blue sea.","The marlin climbed up the oak tree."],"ans":1,"hint":"The answer is \"The marlin swam fast through the deep blue sea.\". A marlin is a fish that swims in the sea."},{"type":"usage","q":"Which word fits: At the aquarium, we saw a big fish with a nose like a spear. It was a ____.","options":["thimble","marlin","hurdler"],"ans":1,"hint":"The answer is \"marlin\". A big fish with a spear-like nose is a marlin."},{"type":"usage","q":"Out on the ocean, a ____ jumped high out of the waves.","options":["marlin","dictionary","basement"],"ans":0,"hint":"The answer is \"marlin\". A marlin is an ocean fish that jumps out of the waves."},{"type":"usage","q":"Which word fits: Grandpa's favorite ocean fish has a long, pointed nose. It is the ____.","options":["lullaby","business","marlin"],"ans":2,"hint":"The answer is \"marlin\". The ocean fish with a pointed nose is the marlin."},{"type":"spelling","q":"Which is the correct spelling?","options":["marlen","marlin","marlinn"],"ans":1,"hint":"The answer is \"marlin\". Marlin is m-a-r-l-i-n."},{"type":"spelling","q":"Which word is spelled correctly in the sentence: 'We saw a ____ in the sea.'?","options":["marrlin","marlan","marlin"],"ans":2,"hint":"The answer is \"marlin\". Marlin has one r and ends in -lin."},{"type":"spelling","q":"Fill the missing letters: m_rl_n","options":["e and i","a and e","a and i"],"ans":2,"hint":"The answer is \"a and i\". The word is m-a-r-l-i-n."},{"type":"spelling","q":"Which spelling is right for the big ocean fish with a pointed nose?","options":["marlyn","marlin","murlin"],"ans":1,"hint":"The answer is \"marlin\". Marlin starts with mar and ends with lin."}]};
// WORDS = [{day, word, pos, meaning}] in sheet order. BANK[word] = [{type, q, options[3], ans, hint}]
const STORE = 'spellingbee.grade4twobee.v1';
const SKILLS = { pos: 'Part of speech', meaning: 'Meaning', usage: 'Using it', spelling: 'Spelling' };
const DAYS = { All: 'All 50', Mon: 'Monday (1-15)', Tue: 'Tuesday (16-33)', Wed: 'Wednesday (34-50)' };

const $ = id => document.getElementById(id);
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function show(id) { ['start', 'quiz', 'result'].forEach(s => $(s).classList.toggle('hidden', s !== id)); window.scrollTo(0, 0); }

let state = { rounds: 0, best: {}, seen: {}, day: 'All', skill: 'mixed' };
try { const s = JSON.parse(localStorage.getItem(STORE)); if (s && typeof s === 'object') state = Object.assign(state, s); } catch (e) {}
function save() { try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {} }

let actx = null;
function beep(good) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
    o.connect(g); g.connect(actx.destination);
    o.frequency.setValueAtTime(good ? 523 : 220, t);
    o.frequency.exponentialRampToValueAtTime(good ? 880 : 110, t + .25);
    g.gain.setValueAtTime(.15, t); g.gain.exponentialRampToValueAtTime(.01, t + .28);
    o.start(); o.stop(t + .28);
  } catch (e) {}
}

// ---------- round building: ONE question per word ----------
// Mixed: each word gets a question of a skill rotated across the round so all four skills appear evenly.
// Unused questions are preferred until a word's pool (per skill) has all been seen.
function pickFor(word, skill) {
  const pool = BANK[word].map((q, i) => i).filter(i => BANK[word][i].type === skill);
  const key = word + '|' + skill;
  let seen = (state.seen[key] || []).filter(i => pool.includes(i));
  if (seen.length >= pool.length) seen = [];
  const unseen = pool.filter(i => !seen.includes(i));
  const idx = unseen[Math.floor(Math.random() * unseen.length)];
  state.seen[key] = seen.concat(idx);
  return idx;
}
function buildQuestion(word, idx) {
  const src = BANK[word][idx], correct = src.options[src.ans], options = shuffle(src.options);
  return { word, idx, type: src.type, q: src.q, options, ans: options.indexOf(correct), hint: src.hint };
}
function buildRound(words, skill) {
  const types = Object.keys(SKILLS);
  const offset = Math.floor(Math.random() * 4);
  return shuffle(words).map((w, i) => buildQuestion(w, pickFor(w, skill === 'mixed' ? types[(i + offset) % 4] : skill)));
}
function wordsFor(day) { return WORDS.filter(w => day === 'All' || w.day === day).map(w => w.word); }

// ---------- game ----------
let round = [], pos = 0, score = 0, missed = [], answered = false, isPractice = false, curKey = '';

function startRound(words, practice) {
  isPractice = !!practice;
  curKey = state.day + '|' + state.skill;
  round = buildRound(words, state.skill);
  pos = 0; score = 0; missed = [];
  $('roundLbl').textContent = isPractice ? 'Practice' : 'Round ' + (state.rounds + 1);
  save(); show('quiz'); renderQ();
}
function renderQ() {
  const cur = round[pos]; answered = false;
  $('qLbl').textContent = (pos + 1) + ' / ' + round.length;
  $('scoreLbl').textContent = '⭐ ' + score;
  $('barFill').style.width = (pos / round.length * 100) + '%';
  $('qTag').className = 'tag t-' + cur.type; $('qTag').textContent = SKILLS[cur.type];
  $('qText').textContent = cur.q;
  const box = $('opts'); box.innerHTML = '';
  cur.options.forEach((t, i) => {
    const b = document.createElement('button'); b.className = 'opt';
    const k = document.createElement('span'); k.className = 'k'; k.textContent = i + 1;
    const s = document.createElement('span'); s.textContent = t;
    b.append(k, s); b.onclick = () => answer(i); box.appendChild(b);
  });
  $('fb').classList.add('hidden'); $('nextBtn').classList.add('hidden');
}
function answer(i) {
  if (answered) return; answered = true;
  const cur = round[pos], ok = i === cur.ans, btns = $('opts').children;
  for (const b of btns) b.disabled = true;
  btns[cur.ans].classList.add('correct');
  if (!ok) btns[i].classList.add('wrong');
  cur.ok = ok;
  if (ok) score++; else missed.push(cur);
  beep(ok);
  const fb = $('fb'); fb.className = 'feedback ' + (ok ? 'good' : 'bad'); fb.innerHTML = '';
  fb.append(ok ? '🎉 Correct!' : '💡 Not quite.');
  const sm = document.createElement('small'); sm.textContent = cur.hint; fb.appendChild(sm);
  $('scoreLbl').textContent = '⭐ ' + score;
  $('nextBtn').textContent = pos === round.length - 1 ? 'See results ➜' : 'Next ➜';
  $('nextBtn').classList.remove('hidden'); $('nextBtn').focus();
}
function next() { if (!answered) return; if (++pos < round.length) renderQ(); else finish(); }
function finish() {
  $('barFill').style.width = '100%';
  const total = round.length, pct = score / total;
  if (!isPractice) {
    state.rounds++;
    const b = state.best[curKey];
    if (!b || pct > b.score / b.total) state.best[curKey] = { score, total };
    save();
  }
  $('rEmoji').textContent = pct === 1 ? '🏆' : pct >= .8 ? '🌟' : pct >= .6 ? '👍' : '💪';
  $('rTitle').textContent = pct === 1 ? 'Perfect round!' : pct >= .8 ? 'Great job!' : pct >= .6 ? 'Nice work!' : 'Keep practicing!';
  $('rScore').textContent = 'Score: ' + score + ' / ' + total;
  $('rStars').textContent = '⭐'.repeat(pct === 1 ? 3 : pct >= .8 ? 2 : pct >= .6 ? 1 : 0) || '—';
  const sk = $('rSkills'); sk.innerHTML = '';
  Object.keys(SKILLS).forEach(t => {
    const qs = round.filter(c => c.type === t); if (!qs.length) return;
    const d = document.createElement('div'); d.className = 'skill';
    const tg = document.createElement('span'); tg.className = 'tag t-' + t; tg.textContent = SKILLS[t];
    const n = document.createElement('div'); n.className = 'n'; n.textContent = qs.filter(c => c.ok).length + ' / ' + qs.length;
    d.append(tg, n); sk.appendChild(d);
  });
  const m = $('missed'); m.innerHTML = ''; m.style.textAlign = 'left';
  if (missed.length) {
    const h = document.createElement('b'); h.textContent = 'Words to review (' + missed.length + '):'; m.appendChild(h);
    missed.forEach(c => {
      const info = WORDS.find(w => w.word === c.word);
      const d = document.createElement('div'); d.className = 'item';
      const w = document.createElement('b'); w.textContent = c.word + ' (' + info.pos + ')';
      d.append(w, ' — ' + info.meaning + '. ', document.createElement('br'), c.q + ' ➜ ' + c.options[c.ans]);
      m.appendChild(d);
    });
  } else { m.textContent = 'You got every word! 🎊'; m.style.textAlign = 'center'; }
  $('retryBtn').classList.toggle('hidden', !missed.length);
  show('result');
}

// ---------- start screen ----------
function seg(id, items, getVal, setVal) {
  const box = $(id); box.innerHTML = '';
  Object.entries(items).forEach(([k, label]) => {
    const b = document.createElement('button'); b.textContent = label;
    b.className = getVal() === k ? 'on' : '';
    b.onclick = () => { setVal(k); save(); home(); };
    box.appendChild(b);
  });
}
function home() {
  seg('daySeg', DAYS, () => state.day, v => state.day = v);
  seg('skillSeg', Object.assign({ mixed: 'Mixed' }, SKILLS), () => state.skill, v => state.skill = v);
  const n = wordsFor(state.day).length;
  $('roundInfo').innerHTML = '';
  $('roundInfo').append('Each round: ' + n + ' questions, one per word, picked from each word\'s pool of ' + BANK[WORDS[0].word].length + '.');
  $('sRounds').textContent = state.rounds;
  const b = state.best[state.day + '|' + state.skill];
  $('sBest').textContent = b ? b.score + ' / ' + b.total : '–';
  const wl = $('wordList'); wl.innerHTML = '';
  WORDS.filter(w => state.day === 'All' || w.day === state.day).forEach((w, i) => {
    const d = document.createElement('div'); const b2 = document.createElement('b'); b2.textContent = w.word;
    const it = document.createElement('i'); it.textContent = ' ' + w.pos + ' ';
    d.append(b2, it, '— ' + w.meaning); wl.appendChild(d);
  });
  show('start');
}
$('startBtn').onclick = () => startRound(wordsFor(state.day), false);
$('againBtn').onclick = () => startRound(wordsFor(state.day), false);
$('retryBtn').onclick = () => startRound([...new Set(missed.map(c => c.word))], true);
$('homeBtn').onclick = home;
$('nextBtn').onclick = next;
$('resetBtn').onclick = () => { if (confirm('Clear rounds played, best scores and question history?')) { state = { rounds: 0, best: {}, seen: {}, day: state.day, skill: state.skill }; save(); home(); } };
document.addEventListener('keydown', e => {
  if ($('quiz').classList.contains('hidden')) return;
  if (['1', '2', '3'].includes(e.key)) answer(+e.key - 1);
  else if (e.key === 'Enter' && answered) { e.preventDefault(); next(); }
});
home();
</script>
