<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pippy's Energy Quest - Grade 4 Science</title>
<style>
  :root {
    --primary: #00bcd4; --primary-dark: #00838f; --secondary: #ff9800;
    --bg: linear-gradient(135deg, #e0f7fa 0%, #80deea 100%);
    --card: #fff; --text: #263238; --correct: #2e7d32; --wrong: #c62828;
  }
  * { box-sizing: border-box; font-family: 'Fredoka','Comic Sans MS','Chalkboard SE',sans-serif; }
  body { background: var(--bg); margin: 0; padding: 12px; min-height: 100vh; display: flex; justify-content: center; color: var(--text); }
  .card { background: var(--card); border-radius: 24px; box-shadow: 0 12px 32px rgba(0,0,0,.15); width: 100%; max-width: 700px; padding: 22px; align-self: flex-start; margin-top: 8px; }
  h1 { margin: 0 0 4px; color: var(--primary-dark); font-size: 1.6rem; }
  h2 { margin: 0 0 8px; color: var(--primary-dark); }
  h3 { margin: 14px 0 6px; color: var(--primary-dark); font-size: 1rem; }
  .sub { margin: 0 0 10px; opacity: .8; }
  .center { text-align: center; }
  .hidden { display: none !important; }
  .big-emoji { font-size: 4.2rem; line-height: 1.1; }
  .btn { background: var(--primary); color: #fff; border: 0; border-radius: 14px; padding: 12px 22px; font-size: 1.05rem; font-weight: bold; cursor: pointer; box-shadow: 0 4px 0 var(--primary-dark); margin: 6px 4px; }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--primary-dark); }
  .btn.alt { background: var(--secondary); box-shadow: 0 4px 0 #e65100; }
  .btn.ghost { background: #eceff1; color: var(--text); box-shadow: 0 4px 0 #b0bec5; }
  .seg { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
  .seg button { border: 3px solid #b2ebf2; background: #fff; color: var(--primary-dark); border-radius: 999px; padding: 7px 14px; font-weight: bold; font-size: .92rem; cursor: pointer; }
  .seg button.on { background: var(--primary); border-color: var(--primary); color: #fff; }
  .stats { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin: 12px 0; }
  .stat { background: #e0f7fa; border-radius: 14px; padding: 8px 16px; font-weight: bold; color: var(--primary-dark); }
  .topbar { display: flex; justify-content: space-between; align-items: center; font-weight: bold; color: var(--primary-dark); margin-bottom: 8px; gap: 8px; }
  .bar { height: 12px; background: #e0f7fa; border-radius: 8px; overflow: hidden; margin-bottom: 14px; }
  .bar > div { height: 100%; width: 0; background: linear-gradient(90deg, var(--primary), #4dd0e1); transition: width .3s; }
  .tag { display: inline-block; border-radius: 999px; padding: 3px 12px; font-size: .8rem; font-weight: bold; color: #fff; margin-right: 4px; }
  .t-know { background: #7e57c2; } .t-example { background: #00897b; } .t-apply { background: #ef6c00; } .t-topic { background: #90a4ae; }
  .question { font-size: 1.2rem; font-weight: bold; line-height: 1.45; margin: 10px 0 14px; min-height: 3.6em; }
  .options { display: grid; gap: 10px; }
  .opt { background: #f5f5f5; border: 3px solid #cfd8dc; border-radius: 14px; padding: 12px 14px; font-size: 1.05rem; font-weight: bold; text-align: left; cursor: pointer; color: var(--text); display: flex; gap: 10px; align-items: center; }
  .opt .k { background: #cfd8dc; border-radius: 8px; width: 28px; height: 28px; flex: none; display: grid; place-items: center; font-size: .9rem; }
  .opt:hover:not(:disabled) { background: #e0f7fa; border-color: var(--primary); }
  .opt:disabled { cursor: default; }
  .opt.correct { background: #e8f5e9; border-color: var(--correct); color: var(--correct); }
  .opt.wrong { background: #ffebee; border-color: var(--wrong); color: var(--wrong); }
  .feedback { margin-top: 14px; padding: 12px 14px; border-radius: 14px; font-weight: bold; }
  .feedback.good { background: #e8f5e9; color: var(--correct); }
  .feedback.bad { background: #ffebee; color: var(--wrong); }
  .feedback small { display: block; font-weight: normal; color: var(--text); margin-top: 4px; }
  .skills { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; margin: 10px 0; }
  .skill { border-radius: 12px; padding: 8px; background: #f5f5f5; font-weight: bold; }
  .skill .n { font-size: 1.3rem; }
  .missed { text-align: left; margin: 10px 0; max-height: 340px; overflow: auto; }
  .missed .item { background: #fff8e1; border-left: 6px solid var(--secondary); border-radius: 10px; padding: 8px 12px; margin: 8px 0; font-size: .95rem; }
  .missed .item b { color: var(--primary-dark); }
  .study { text-align: left; max-height: 360px; overflow: auto; margin: 6px 0; }
  .study h4 { margin: 12px 0 4px; color: #7e57c2; }
  .study div { padding: 6px 4px; border-bottom: 1px solid #eceff1; font-size: .95rem; }
  .small { font-size: .85rem; opacity: .75; }
  details summary { cursor: pointer; color: var(--primary-dark); font-weight: bold; margin-top: 8px; }
  textarea { width: 100%; min-height: 90px; font-size: 1.1rem; border: 3px solid #b2ebf2; border-radius: 14px; padding: 10px; }
  textarea:focus { outline: none; border-color: var(--primary); }
  .diff span { padding: 1px 3px; border-radius: 4px; margin: 1px; display: inline-block; }
  .diff .ok { background: #e8f5e9; color: var(--correct); }
  .diff .miss { background: #ffebee; color: var(--wrong); text-decoration: underline; }
  .must { background: #f3e5f5; border-radius: 14px; padding: 10px 14px; margin: 10px 0; text-align: left; }
</style>
</head>
<body>
<div class="card">

  <!-- START -->
  <section id="start" class="center">
    <div class="big-emoji">🐧⚡</div>
    <h1>Pippy's Energy Quest</h1>
    <p class="sub">Grade 4 Science &mdash; Energy Conversions</p>

    <h3>Which topics?</h3>
    <div class="seg" id="secSeg"></div>
    <h3>Which kind of question?</h3>
    <div class="seg" id="skillSeg"></div>
    <h3>How long?</h3>
    <div class="seg" id="lenSeg"></div>

    <p id="roundInfo"></p>
    <div class="stats">
      <div class="stat">Rounds played: <span id="sRounds">0</span></div>
      <div class="stat">Best: <span id="sBest">&ndash;</span></div>
    </div>
    <button class="btn" id="startBtn">Start Round 🚀</button>
    <button class="btn alt" id="writeBtn">✏️ Practice the "must write" sentences</button>
    <div class="small">Tip: press 1, 2 or 3 to answer, Enter for next.</div>
    <details><summary>Study guide</summary><div class="study" id="study"></div></details>
    <div><button class="btn ghost" id="resetBtn" style="font-size:.8rem;padding:6px 12px">Reset progress</button></div>
  </section>

  <!-- QUIZ -->
  <section id="quiz" class="hidden">
    <div class="topbar"><span id="roundLbl"></span><span id="qLbl"></span><span id="scoreLbl">⭐ 0</span></div>
    <div class="bar"><div id="barFill"></div></div>
    <span class="tag" id="qTag"></span><span class="tag t-topic" id="qTopic"></span>
    <div class="question" id="qText"></div>
    <div class="options" id="opts"></div>
    <div class="feedback hidden" id="fb"></div>
    <div class="center"><button class="btn hidden" id="nextBtn">Next ➜</button></div>
  </section>

  <!-- RESULT -->
  <section id="result" class="hidden center">
    <div class="big-emoji" id="rEmoji">🏆</div>
    <h2 id="rTitle">Round complete!</h2>
    <div class="stats"><div class="stat" id="rScore"></div><div class="stat" id="rStars"></div></div>
    <div class="skills" id="rSkills"></div>
    <div class="missed" id="missed"></div>
    <button class="btn alt hidden" id="retryBtn">Practice missed topics 🔁</button>
    <button class="btn" id="againBtn">New round 🚀</button>
    <button class="btn ghost" id="homeBtn">Home</button>
  </section>

  <!-- WRITE -->
  <section id="write" class="hidden">
    <div class="topbar"><span>✏️ Must-write sentences</span><span id="wLbl"></span></div>
    <div class="question" id="wPrompt"></div>
    <div id="wShow" class="must hidden"></div>
    <textarea id="wInput" placeholder="Type the sentence here..." autocomplete="off" spellcheck="false"></textarea>
    <div class="feedback hidden" id="wFb"></div>
    <div class="center">
      <button class="btn ghost" id="wPeek">👀 Peek</button>
      <button class="btn" id="wCheck">Check ✔</button>
      <button class="btn hidden" id="wNext">Next ➜</button>
      <button class="btn ghost" id="wHome">Home</button>
    </div>
  </section>
</div>

<script>
/*__DATA__*/
// UNITS = {sections:{id:label}, units:[{section,id,title,fact}]}. BANK[unitId] = [{type,q,options[3],ans,hint}]
const STORE = 'science.grade4energy.v1';
const SKILLS = { know: 'Know it', example: 'Examples', apply: 'Apply it' };
const SECTIONS = Object.assign({ all: 'All topics' }, UNITS.sections);
const LENS = { quick: 'Quick 20', full: 'Every topic' };
const MUST = [
  { prompt: 'Write the definition: What is energy?', text: 'Energy is the ability to do work or to cause a change.' },
  { prompt: 'Write the sentence: What can energy do with its form?', text: 'Energy can change from one form to another.' },
  { prompt: 'Write the sentence: Does energy change completely from one form to another?', text: 'Energy does not change completely from one form to another.' },
];
const unitById = Object.fromEntries(UNITS.units.map(u => [u.id, u]));

const $ = id => document.getElementById(id);
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function show(id) { ['start', 'quiz', 'result', 'write'].forEach(s => $(s).classList.toggle('hidden', s !== id)); window.scrollTo(0, 0); }

let state = { rounds: 0, best: {}, seen: {}, sec: 'all', skill: 'mixed', len: 'quick' };
try { const s = JSON.parse(localStorage.getItem(STORE)); if (s && typeof s === 'object') state = Object.assign(state, s); } catch (e) {}
function save() { try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {} }

let actx = null;
function beep(good) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
    o.connect(g); g.connect(actx.destination);
    o.frequency.setValueAtTime(good ? 523 : 220, t);
    o.frequency.exponentialRampToValueAtTime(good ? 880 : 110, t + .25);
    g.gain.setValueAtTime(.15, t); g.gain.exponentialRampToValueAtTime(.01, t + .28);
    o.start(); o.stop(t + .28);
  } catch (e) {}
}

// ---------- round building: ONE question per topic ----------
function pickFor(unit, skill) {
  const pool = BANK[unit].map((q, i) => i).filter(i => BANK[unit][i].type === skill);
  const key = unit + '|' + skill;
  let seen = (state.seen[key] || []).filter(i => pool.includes(i));
  if (seen.length >= pool.length) seen = [];
  const unseen = pool.filter(i => !seen.includes(i));
  const idx = unseen[Math.floor(Math.random() * unseen.length)];
  state.seen[key] = seen.concat(idx);
  return idx;
}
function buildQuestion(unit, idx) {
  const src = BANK[unit][idx], correct = src.options[src.ans], options = shuffle(src.options);
  return { unit, idx, type: src.type, q: src.q, options, ans: options.indexOf(correct), hint: src.hint };
}
function buildRound(units, skill) {
  const types = Object.keys(SKILLS), offset = Math.floor(Math.random() * 3);
  return shuffle(units).map((u, i) => buildQuestion(u, pickFor(u, skill === 'mixed' ? types[(i + offset) % 3] : skill)));
}
function unitsFor(sec) { return UNITS.units.filter(u => sec === 'all' || u.section === sec).map(u => u.id); }
function roundUnits() { const u = unitsFor(state.sec); return state.len === 'quick' ? shuffle(u).slice(0, 20) : u; }

// ---------- quiz ----------
let round = [], pos = 0, score = 0, missed = [], answered = false, isPractice = false, curKey = '';
function startRound(units, practice) {
  isPractice = !!practice;
  curKey = state.sec + '|' + state.skill + '|' + state.len;
  round = buildRound(units, state.skill);
  pos = 0; score = 0; missed = [];
  $('roundLbl').textContent = isPractice ? 'Practice' : 'Round ' + (state.rounds + 1);
  save(); show('quiz'); renderQ();
}
function renderQ() {
  const cur = round[pos]; answered = false;
  $('qLbl').textContent = (pos + 1) + ' / ' + round.length;
  $('scoreLbl').textContent = '⭐ ' + score;
  $('barFill').style.width = (pos / round.length * 100) + '%';
  $('qTag').className = 'tag t-' + cur.type; $('qTag').textContent = SKILLS[cur.type];
  $('qTopic').textContent = unitById[cur.unit].title;
  $('qText').textContent = cur.q;
  const box = $('opts'); box.innerHTML = '';
  cur.options.forEach((t, i) => {
    const b = document.createElement('button'); b.className = 'opt';
    const k = document.createElement('span'); k.className = 'k'; k.textContent = i + 1;
    const s = document.createElement('span'); s.textContent = t;
    b.append(k, s); b.onclick = () => answer(i); box.appendChild(b);
  });
  $('fb').classList.add('hidden'); $('nextBtn').classList.add('hidden');
}
function answer(i) {
  if (answered) return; answered = true;
  const cur = round[pos], ok = i === cur.ans, btns = $('opts').children;
  for (const b of btns) b.disabled = true;
  btns[cur.ans].classList.add('correct');
  if (!ok) btns[i].classList.add('wrong');
  cur.ok = ok;
  if (ok) score++; else missed.push(cur);
  beep(ok);
  const fb = $('fb'); fb.className = 'feedback ' + (ok ? 'good' : 'bad'); fb.innerHTML = '';
  fb.append(ok ? '🎉 Correct!' : '💡 Not quite.');
  const sm = document.createElement('small'); sm.textContent = cur.hint; fb.appendChild(sm);
  $('scoreLbl').textContent = '⭐ ' + score;
  $('nextBtn').textContent = pos === round.length - 1 ? 'See results ➜' : 'Next ➜';
  $('nextBtn').classList.remove('hidden'); $('nextBtn').focus();
}
function next() { if (!answered) return; if (++pos < round.length) renderQ(); else finish(); }
function finish() {
  $('barFill').style.width = '100%';
  const total = round.length, pct = score / total;
  if (!isPractice) {
    state.rounds++;
    const b = state.best[curKey];
    if (!b || pct > b.score / b.total) state.best[curKey] = { score, total };
    save();
  }
  $('rEmoji').textContent = pct === 1 ? '🏆' : pct >= .8 ? '🌟' : pct >= .6 ? '👍' : '💪';
  $('rTitle').textContent = pct === 1 ? 'Perfect round!' : pct >= .8 ? 'Great job!' : pct >= .6 ? 'Nice work!' : 'Keep practicing!';
  $('rScore').textContent = 'Score: ' + score + ' / ' + total;
  $('rStars').textContent = '⭐'.repeat(pct === 1 ? 3 : pct >= .8 ? 2 : pct >= .6 ? 1 : 0) || '—';
  const sk = $('rSkills'); sk.innerHTML = '';
  Object.keys(SKILLS).forEach(t => {
    const qs = round.filter(c => c.type === t); if (!qs.length) return;
    const d = document.createElement('div'); d.className = 'skill';
    const tg = document.createElement('span'); tg.className = 'tag t-' + t; tg.textContent = SKILLS[t];
    const n = document.createElement('div'); n.className = 'n'; n.textContent = qs.filter(c => c.ok).length + ' / ' + qs.length;
    d.append(tg, n); sk.appendChild(d);
  });
  const m = $('missed'); m.innerHTML = ''; m.style.textAlign = 'left';
  if (missed.length) {
    const h = document.createElement('b'); h.textContent = 'Topics to review (' + missed.length + '):'; m.appendChild(h);
    missed.forEach(c => {
      const u = unitById[c.unit];
      const d = document.createElement('div'); d.className = 'item';
      const w = document.createElement('b'); w.textContent = u.title;
      d.append(w, ' — ' + u.fact, document.createElement('br'), document.createElement('br'), c.q + ' ➜ ' + c.options[c.ans]);
      m.appendChild(d);
    });
  } else { m.textContent = 'You got every topic! 🎊'; m.style.textAlign = 'center'; }
  $('retryBtn').classList.toggle('hidden', !missed.length);
  show('result');
}

// ---------- must-write practice ----------
let wi = 0, wOrder = [];
const norm = s => s.toLowerCase().replace(/[^a-z' ]+/g, ' ').split(/\s+/).filter(Boolean);
function startWrite() { wOrder = shuffle(MUST.map((_, i) => i)); wi = 0; show('write'); renderW(); }
function renderW() {
  const m = MUST[wOrder[wi]];
  $('wLbl').textContent = (wi + 1) + ' / ' + MUST.length;
  $('wPrompt').textContent = m.prompt;
  $('wInput').value = ''; $('wInput').disabled = false; $('wInput').focus();
  $('wShow').classList.add('hidden'); $('wFb').classList.add('hidden');
  $('wCheck').classList.remove('hidden'); $('wPeek').classList.remove('hidden'); $('wNext').classList.add('hidden');
}
function checkW() {
  const target = MUST[wOrder[wi]].text, want = norm(target), got = norm($('wInput').value);
  // mark which target words were written, in order (longest common subsequence)
  const L = Array.from({ length: want.length + 1 }, () => Array(got.length + 1).fill(0));
  for (let i = want.length - 1; i >= 0; i--) for (let j = got.length - 1; j >= 0; j--)
    L[i][j] = want[i] === got[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  const hit = []; let i = 0, j = 0;
  while (i < want.length && j < got.length) { if (want[i] === got[j]) { hit[i] = true; i++; j++; } else if (L[i + 1][j] >= L[i][j + 1]) i++; else j++; }
  const extra = got.length - L[0][0], ok = L[0][0] === want.length && extra === 0;
  beep(ok);
  const fb = $('wFb'); fb.className = 'feedback ' + (ok ? 'good' : 'bad'); fb.innerHTML = '';
  fb.append(ok ? '🎉 Perfect — word for word!' : '💡 Almost! Red words are missing or wrong' + (extra && L[0][0] === want.length ? ' (you also have ' + extra + ' extra word' + (extra > 1 ? 's' : '') + ')' : '') + ':');
  const d = document.createElement('div'); d.className = 'diff';
  target.split(' ').forEach((w, k) => { const s = document.createElement('span'); s.className = hit[k] ? 'ok' : 'miss'; s.textContent = w; d.appendChild(s); });
  fb.appendChild(d);
  if (ok) { $('wInput').disabled = true; $('wCheck').classList.add('hidden'); $('wPeek').classList.add('hidden'); $('wNext').classList.remove('hidden'); $('wNext').textContent = wi === MUST.length - 1 ? 'Done 🎊' : 'Next ➜'; }
}
$('wCheck').onclick = checkW;
$('wPeek').onclick = () => { const s = $('wShow'); s.textContent = MUST[wOrder[wi]].text; s.classList.toggle('hidden'); };
$('wNext').onclick = () => { if (++wi < MUST.length) renderW(); else home(); };
$('wHome').onclick = () => home();
$('writeBtn').onclick = startWrite;

// ---------- start screen ----------
function seg(id, items, getVal, setVal) {
  const box = $(id); box.innerHTML = '';
  Object.entries(items).forEach(([k, label]) => {
    const b = document.createElement('button'); b.textContent = label;
    b.className = getVal() === k ? 'on' : '';
    b.onclick = () => { setVal(k); save(); home(); };
    box.appendChild(b);
  });
}
function home() {
  seg('secSeg', SECTIONS, () => state.sec, v => state.sec = v);
  seg('skillSeg', Object.assign({ mixed: 'Mixed' }, SKILLS), () => state.skill, v => state.skill = v);
  seg('lenSeg', LENS, () => state.len, v => state.len = v);
  const n = unitsFor(state.sec).length, q = state.len === 'quick' ? Math.min(20, n) : n;
  $('roundInfo').textContent = 'Each round: ' + q + ' questions, each on a different topic, picked from a pool of ' + BANK[UNITS.units[0].id].length + ' per topic (' + n + ' topics here).';
  $('sRounds').textContent = state.rounds;
  const b = state.best[state.sec + '|' + state.skill + '|' + state.len];
  $('sBest').textContent = b ? b.score + ' / ' + b.total : '–';
  const st = $('study'); st.innerHTML = '';
  Object.entries(UNITS.sections).forEach(([sid, label]) => {
    if (state.sec !== 'all' && state.sec !== sid) return;
    const h = document.createElement('h4'); h.textContent = label; st.appendChild(h);
    UNITS.units.filter(u => u.section === sid).forEach(u => {
      const d = document.createElement('div'); const t = document.createElement('b'); t.textContent = u.title + ': ';
      d.append(t, u.fact); st.appendChild(d);
    });
  });
  show('start');
}
$('startBtn').onclick = () => startRound(roundUnits(), false);
$('againBtn').onclick = () => startRound(roundUnits(), false);
$('retryBtn').onclick = () => startRound([...new Set(missed.map(c => c.unit))], true);
$('homeBtn').onclick = home;
$('nextBtn').onclick = next;
$('resetBtn').onclick = () => { if (confirm('Clear rounds played, best scores and question history?')) { state = { rounds: 0, best: {}, seen: {}, sec: state.sec, skill: state.skill, len: state.len }; save(); home(); } };
document.addEventListener('keydown', e => {
  if (!$('write').classList.contains('hidden')) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); if (!$('wNext').classList.contains('hidden')) $('wNext').click(); else checkW(); }
    return;
  }
  if ($('quiz').classList.contains('hidden')) return;
  if (['1', '2', '3'].includes(e.key)) answer(+e.key - 1);
  else if (e.key === 'Enter' && answered) { e.preventDefault(); next(); }
});
home();
</script>
<script src="../../home-link.js" defer></script>
</body>
</html>
