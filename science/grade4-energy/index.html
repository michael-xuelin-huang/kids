  .skills { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; margin: 10px 0; }

  .small { font-size: .85rem; opacity: .75; }
  details summary { cursor: pointer; color: var(--primary-dark); font-weight: bold; margin-top: 8px; }
  textarea { width: 100%; min-height: 90px; font-size: 1.1rem; border: 3px solid #b2ebf2; border-radius: 14px; padding: 10px; }

const UNITS = {"sections":{"forms":"What energy is & its forms","light":"Light","heatsound":"Heat & sound","electric":"Electricity & circuits","sources":"Energy sources & devices","science":"Science & engineering words"},"units":[{"section":"forms","id":"energy","title":"Energy","fact":"Energy is the ability to do work or to cause a change (make things move or change). MUST WRITE: \"Energy is the ability to do work or to cause a change.\""},{"section":"forms","id":"sun","title":"The Sun, main energy source","fact":"The sun is the main source of energy at Earth's surface. Sun energy makes Earth livable, makes plants grow (light), makes wind blow and moves water through the water cycle."},{"section":"forms","id":"change","title":"Energy changes form","fact":"Energy can change from one form to another. It does not change completely from one form to another, and it does not go away. Some energy always turns into heat. MUST WRITE: \"Energy can change from one form to another. Energy does not change completely from one form to another.\""},{"section":"forms","id":"form","title":"Form of energy","fact":"A form of energy is a type or kind of energy (electrical, light, heat/thermal, sound, mechanical, potential, chemical, kinetic/motion)."},{"section":"forms","id":"electrical","title":"Electrical energy","fact":"The movement of electric charges; energy that travels through wires and powers devices, like a lamp."},{"section":"forms","id":"lightform","title":"Light energy (form)","fact":"The energy we can see; it lets us see. Light comes through windows and brightens a room."},{"section":"forms","id":"heatform","title":"Heat / thermal energy","fact":"Thermal energy is energy related to heat. Heat is the transfer of energy from a warmer object to a colder one. Heat energy cooks food in the kitchen."},{"section":"forms","id":"soundform","title":"Sound energy (form)","fact":"The form of energy we can hear; made by vibrations. Musical instruments produce sound energy."},{"section":"forms","id":"mechanical","title":"Mechanical energy","fact":"The energy of an object's motion (kinetic) or position (potential)."},{"section":"forms","id":"potential","title":"Potential energy","fact":"Stored energy. A raised object has stored energy because of gravity. Stretching or squeezing (compressing) an object, like a rubber band or spring, also stores potential energy. Potential energy can change into kinetic energy."},{"section":"forms","id":"chemical","title":"Chemical energy","fact":"Stored energy in food, fuels (like gasoline) and batteries. It can change into a form that does work."},{"section":"forms","id":"kinetic","title":"Kinetic / motion energy","fact":"The energy of motion: energy an object has because it is moving. A car moves when the stored (chemical) energy in gasoline changes to kinetic energy."},{"section":"light","id":"lighttravel","title":"How light travels","fact":"Light travels outward from its source in all directions, in a straight line until it hits an object or moves from one medium (material) to another. Light can pass through some objects. Light can be reflected, refracted, or absorbed."},{"section":"light","id":"reflect","title":"Reflect","fact":"To bounce off. We see objects because light reflects off them. Flat, smooth surfaces like a mirror reflect light evenly; rough water does not reflect evenly."},{"section":"light","id":"refract","title":"Refract","fact":"Light refracts (bends) when it passes between different materials, because it travels at different speeds in them. Light slows down when it goes from air into water, and bends (like a straw looking bent in a glass of water)."},{"section":"light","id":"absorb","title":"Absorb","fact":"To take in. Light is made of different colors. Objects absorb some colors and reflect others; the color we see is the color reflected. A red flower reflects red and absorbs the other colors."},{"section":"light","id":"transparent","title":"Transparent","fact":"Lets light pass through; you can see clearly through it. Examples: clear glass, air, plastic wrap."},{"section":"light","id":"translucent","title":"Translucent","fact":"Lets some light pass through; things on the other side look blurry. Examples: wax paper, frosted paper."},{"section":"light","id":"opaque","title":"Opaque","fact":"Blocks light completely; no light passes through and you cannot see what is on the other side. Examples: wood, metal, brick."},{"section":"heatsound","id":"heatconduct","title":"Heat conductors","fact":"Heat (thermal energy) travels from warmer objects to cooler objects. Good conductors of heat let heat pass through easily (metals). Bad conductors of heat do not (wood, plastic)."},{"section":"heatsound","id":"vibration","title":"Sound and vibration","fact":"Sound happens when matter vibrates (moves quickly back and forth). Sound travels in waves. The air particles vibrate in place and bump into each other, passing the energy along particle to particle until it reaches your ear; the particles themselves do not travel with the wave."},{"section":"heatsound","id":"volume","title":"Volume","fact":"How loud or soft a sound is. Volume is a property of sound and is related to how much energy the sound has (more energy = louder)."},{"section":"heatsound","id":"medium","title":"How sound travels through matter","fact":"A medium is a material sound waves travel through. With no medium (like empty space) there is no sound. Sound travels slowest through gases, faster through liquids, and fastest through solids, because the particles are packed more closely."},{"section":"electric","id":"conductor","title":"Electrical conductors","fact":"Materials that let electrical energy pass through easily. Metals are good conductors; graphite (pencil \"lead\") is a good conductor; water is also a strong conductor."},{"section":"electric","id":"insulator","title":"Insulators","fact":"Materials that do not let electric charge move through them. Examples: rubber, plastic, wood, glass."},{"section":"electric","id":"circuit","title":"Electrical circuit","fact":"A complete path through which electrical energy can flow."},{"section":"electric","id":"closed","title":"Closed circuit","fact":"A complete path that allows electrical energy to flow (the light turns on)."},{"section":"electric","id":"open","title":"Open circuit","fact":"A broken or incomplete path that stops electrical energy from flowing."},{"section":"electric","id":"switch","title":"Switch","fact":"A device that opens or closes an electrical circuit."},{"section":"electric","id":"wire","title":"Wire","fact":"A material that carries electrical energy in a circuit (usually metal covered in plastic)."},{"section":"electric","id":"battery","title":"Battery","fact":"A device that stores chemical energy and provides electrical energy."},{"section":"electric","id":"device","title":"Electrical device","fact":"A machine that changes electrical energy into another form of energy (lamp -> light, speaker -> sound, fan -> motion, toaster -> heat)."},{"section":"electric","id":"grid","title":"Electrical grid","fact":"A network of wires that moves (transfers) electricity from energy sources/power plants to many different places."},{"section":"electric","id":"elsystem","title":"Electrical system","fact":"A group of connected parts that work together to provide electricity to devices."},{"section":"electric","id":"blackout","title":"Blackout","fact":"A time when electricity stops working in an area."},{"section":"electric","id":"failure","title":"System failure","fact":"When a system cannot perform its function (job) properly."},{"section":"sources","id":"source","title":"Source","fact":"The place where something comes from."},{"section":"sources","id":"esource","title":"Energy source","fact":"Something that provides energy (sun, wind, water, food, fuel, batteries)."},{"section":"sources","id":"conversion","title":"Energy conversion","fact":"The process of changing energy from one form into another (e.g. a lamp: electrical -> light and heat)."},{"section":"sources","id":"convert","title":"Convert","fact":"To change energy from one form into another."},{"section":"sources","id":"converter","title":"Converter","fact":"Something that changes one form of energy into another (e.g. a solar panel, a motor, a toaster)."},{"section":"sources","id":"renewable","title":"Renewable energy","fact":"Energy from sources that are naturally replenished (refilled), like sun, wind and flowing water."},{"section":"sources","id":"nonrenewable","title":"Nonrenewable energy","fact":"Energy from sources that are limited and cannot be replaced quickly, like coal, oil, gasoline and natural gas."},{"section":"sources","id":"solar","title":"Solar energy","fact":"Energy that comes from the Sun."},{"section":"sources","id":"solarpanel","title":"Solar panel","fact":"A device that converts sunlight (light energy) into electrical energy."},{"section":"sources","id":"turbine","title":"Wind turbine","fact":"A machine that uses wind to produce electrical energy."},{"section":"sources","id":"generator","title":"Generator","fact":"A device that converts motion energy into electrical energy."},{"section":"sources","id":"motor","title":"Motor","fact":"A device that converts electrical energy into motion energy."},{"section":"sources","id":"powerplant","title":"Power plant","fact":"A facility (big building) where electricity is generated (made)."},{"section":"sources","id":"efficiency","title":"Efficiency","fact":"How well something uses energy to do a task; an efficient device wastes less energy (for example less wasted heat)."},{"section":"sources","id":"transfer","title":"Transfer","fact":"To move something from one place to another (heat transfers from warm to cool; the grid transfers electricity)."},{"section":"sources","id":"input","title":"Input","fact":"What goes into a system or device (a lamp's input is electrical energy)."},{"section":"sources","id":"output","title":"Output","fact":"What comes out of a system or device (a lamp's output is light and heat)."},{"section":"science","id":"argument","title":"Argument","fact":"Using evidence to explain why an idea (claim) is best."},{"section":"science","id":"claim","title":"Claim","fact":"An answer or statement that you believe is correct."},{"section":"science","id":"evidence","title":"Evidence","fact":"Information or facts that support an answer or claim."},{"section":"science","id":"engineer","title":"Engineer","fact":"A person who uses science and designs to solve problems."},{"section":"science","id":"function","title":"Function","fact":"What something does; its purpose or job."},{"section":"science","id":"synthesize","title":"Synthesize","fact":"To put information together to understand something."},{"section":"science","id":"system","title":"System","fact":"A group of parts that work together."},{"section":"science","id":"criteria","title":"Criteria","fact":"Requirements used to judge how well a design solves a problem."},{"section":"science","id":"design","title":"Design","fact":"To plan or create something to solve a problem."}]};
const BANK = {"energy":[{"type":"know","q":"What is energy?","options":["A kind of rock found underground","A type of matter you can hold","The ability to do work or to cause a change"],"ans":2,"hint":"The answer is \"The ability to do work or to cause a change\". Energy is the ability to do work or to cause a change."},{"type":"know","q":"Fill in the blank: \"Energy is the ability to do work or to cause a ____.\"","options":["color","change","shadow"],"ans":1,"hint":"The answer is \"change\". Energy is the ability to do work or to cause a change."},{"type":"know","q":"Which statement is true?","options":["Energy is something you weigh on a scale","Only living things have energy","Energy can make things move or change"],"ans":2,"hint":"The answer is \"Energy can make things move or change\". Energy makes things move or change, in living and nonliving things."},{"type":"know","q":"Which word means \"the ability to do work or to cause a change\"?","options":["Energy","Mass","Volume"],"ans":0,"hint":"The answer is \"Energy\". That is the meaning of the word energy."},{"type":"know","q":"When something moves or changes, what was needed to make it happen?","options":["A shadow","Energy","Silence"],"ans":1,"hint":"The answer is \"Energy\". Energy is what makes things move or change."},{"type":"example","q":"Which is an example of energy causing a change?","options":["Ice melting in the sun","A book lying closed on a shelf","A pencil resting on a desk"],"ans":0,"hint":"The answer is \"Ice melting in the sun\". The sun's energy changes the ice into water."},{"type":"example","q":"Which shows energy doing work?","options":["A kid pushing a wagon","A painting hanging on a wall","A spoon lying in a drawer"],"ans":0,"hint":"The answer is \"A kid pushing a wagon\". Pushing makes the wagon move, and that takes energy."},{"type":"example","q":"Which is NOT an example of energy causing a change?","options":["A stone lying still on the ground","Popcorn popping in a pan","Wind spinning a pinwheel"],"ans":0,"hint":"The answer is \"A stone lying still on the ground\". Nothing is moving or changing with the still stone."},{"type":"example","q":"A running dog and a ringing bell both use energy. Which one belongs with them?","options":["A chair standing in a corner","A brick in a wall","A bouncing ball"],"ans":2,"hint":"The answer is \"A bouncing ball\". A bouncing ball is moving, so it is using energy."},{"type":"example","q":"Which needs energy to happen?","options":["A toy car parked on a shelf","A toy car racing across the floor","A toy car sitting in its box"],"ans":1,"hint":"The answer is \"A toy car racing across the floor\". Making the car move takes energy."},{"type":"apply","q":"Mia kicks a soccer ball and it rolls across the field. What made the ball move?","options":["The color of the ball","Energy from Mia's kick","The smell of the grass"],"ans":1,"hint":"The answer is \"Energy from Mia's kick\". Mia's kick gave the ball energy to move."},{"type":"apply","q":"Why do you eat breakfast before running at recess?","options":["Food makes your shoes faster","Food turns off your muscles","Food gives your body energy to move"],"ans":2,"hint":"The answer is \"Food gives your body energy to move\". Your body gets energy from food so it can move."},{"type":"apply","q":"A toy robot's battery is dead. What happens?","options":["It moves faster than before","It changes color","It stops moving"],"ans":2,"hint":"The answer is \"It stops moving\". Without energy the robot cannot do work, so it stops."},{"type":"apply","q":"At the science fair, Leo uses a candle to melt a piece of chocolate. What does his project show?","options":["Energy is a solid you can hold","Energy can cause a change","Chocolate has no matter"],"ans":1,"hint":"The answer is \"Energy can cause a change\". The candle's energy changed the chocolate from solid to liquid."},{"type":"apply","q":"A playground swing is hanging still. What will make it start swinging?","options":["Someone gives it a push","Everyone stays very quiet","Someone paints it a new color"],"ans":0,"hint":"The answer is \"Someone gives it a push\". A push gives the swing energy, and energy makes things move."}],"sun":[{"type":"know","q":"What is the main source of energy at Earth's surface?","options":["The moon","Batteries","The sun"],"ans":2,"hint":"The answer is \"The sun\". The sun is the main source of energy at Earth's surface."},{"type":"know","q":"Which statement is true?","options":["The sun gives no energy to Earth","Plants grow best with no light","Sun energy makes Earth livable"],"ans":2,"hint":"The answer is \"Sun energy makes Earth livable\". Sun energy makes Earth a place where we can live."},{"type":"know","q":"Fill in the blank: \"The sun is the ____ source of energy at Earth's surface.\"","options":["smallest","main","newest"],"ans":1,"hint":"The answer is \"main\". The sun is the main source of energy at Earth's surface."},{"type":"know","q":"Which energy from the sun do plants use to grow?","options":["Sound","Electrical","Light"],"ans":2,"hint":"The answer is \"Light\". Plants grow using the sun's light."},{"type":"know","q":"Which is a job of the sun's energy?","options":["Moving water through the water cycle","Freezing all the oceans","Stopping the wind"],"ans":0,"hint":"The answer is \"Moving water through the water cycle\". Sun energy moves water through the water cycle."},{"type":"example","q":"Which is an example of the sun's energy at work?","options":["A puddle drying up on a sunny day","A flashlight shining in a closet","A guitar string vibrating"],"ans":0,"hint":"The answer is \"A puddle drying up on a sunny day\". The sun's energy makes the puddle water evaporate."},{"type":"example","q":"Which is NOT caused by the sun's energy?","options":["A magnet sticking to a fridge","Plants growing in a garden","Wind blowing a kite"],"ans":0,"hint":"The answer is \"A magnet sticking to a fridge\". Magnets stick because of magnetism, not sun energy."},{"type":"example","q":"Sun energy makes plants grow and wind blow. Which belongs in this list too?","options":["A magnet picking up pins","An echo in a cave","Warming the sand at the beach"],"ans":2,"hint":"The answer is \"Warming the sand at the beach\". The sun's energy warms the sand."},{"type":"example","q":"Which is an example of the sun moving water in the water cycle?","options":["Water evaporating from a lake","A faucet dripping in the sink","Ice cubes staying in a freezer"],"ans":0,"hint":"The answer is \"Water evaporating from a lake\". The sun's energy turns lake water into water vapor."},{"type":"example","q":"Which shows the sun making wind blow?","options":["A fan spinning in a room","The sun warms air, and the air moves","A kid blowing out candles"],"ans":1,"hint":"The answer is \"The sun warms air, and the air moves\". Sun energy warms the air and makes the wind blow."},{"type":"apply","q":"Ana puts one plant in a sunny window and one in a dark closet. What will happen?","options":["The closet plant grows better","The sunny plant grows better","Both grow the same"],"ans":1,"hint":"The answer is \"The sunny plant grows better\". Plants need the sun's light to grow."},{"type":"apply","q":"You leave a chocolate bar on a car seat on a sunny day. What happens?","options":["It freezes","It melts","It turns into a battery"],"ans":1,"hint":"The answer is \"It melts\". The sun's energy heats the chocolate and melts it."},{"type":"apply","q":"If the sun stopped shining, what would happen to Earth?","options":["It would become too cold to live on","It would get warmer","Plants would grow faster"],"ans":0,"hint":"The answer is \"It would become too cold to live on\". Sun energy is what makes Earth livable."},{"type":"apply","q":"Why do wet clothes on a clothesline dry on a sunny day?","options":["The moon pulls the water out","The clothes soak up shadows","Sun energy evaporates the water"],"ans":2,"hint":"The answer is \"Sun energy evaporates the water\". The sun's energy turns the water into vapor."},{"type":"apply","q":"Sam's class watches wind push a sailboat. Where did the wind's energy first come from?","options":["The ocean floor","The sun","The boat's sail"],"ans":1,"hint":"The answer is \"The sun\". Sun energy makes the wind blow."}],"change":[{"type":"know","q":"Which statement is true?","options":["Energy can change from one form to another","Energy can never change form","Energy disappears when it is used"],"ans":0,"hint":"The answer is \"Energy can change from one form to another\". Energy can change from one form to another."},{"type":"know","q":"Fill in the blank: \"Energy does not change ____ from one form to another.\"","options":["at all","ever","completely"],"ans":2,"hint":"The answer is \"completely\". Energy does not change completely from one form to another."},{"type":"know","q":"When energy is used, what happens to it?","options":["It goes away forever","It changes into other forms","It turns into nothing"],"ans":1,"hint":"The answer is \"It changes into other forms\". Energy does not go away; it changes form."},{"type":"know","q":"When energy changes form, which form does some of it always turn into?","options":["Heat","Sound","Light"],"ans":0,"hint":"The answer is \"Heat\". Some energy always turns into heat."},{"type":"know","q":"Fill in the blank: \"Energy can ____ from one form to another.\"","options":["change","never move","be destroyed"],"ans":0,"hint":"The answer is \"change\". Energy can change from one form to another."},{"type":"example","q":"Which is an example of energy changing form?","options":["A toaster turning electricity into heat","A rock sitting in a field","A closed book on a shelf"],"ans":0,"hint":"The answer is \"A toaster turning electricity into heat\". The toaster changes electrical energy into heat."},{"type":"example","q":"Which shows chemical energy changing into motion?","options":["A lamp plugged into the wall","A drum being hit","A kid eats lunch, then runs"],"ans":2,"hint":"The answer is \"A kid eats lunch, then runs\". Food's chemical energy becomes motion when you run."},{"type":"example","q":"Which is NOT an example of energy changing form?","options":["A fan turning electricity into motion","A pencil lying on a desk","Wood burning in a campfire"],"ans":1,"hint":"The answer is \"A pencil lying on a desk\". Nothing is happening to the pencil, so no energy is changing."},{"type":"example","q":"Which example shows some energy turning into heat?","options":["Ice staying frozen in a freezer","A shadow on the wall","A light bulb gets warm while it shines"],"ans":2,"hint":"The answer is \"A light bulb gets warm while it shines\". The bulb gives light, but some energy becomes heat."},{"type":"example","q":"A toaster, a blender, and a radio all change electrical energy into other forms. Which belongs with them?","options":["A wooden spoon","A hair dryer","A rock"],"ans":1,"hint":"The answer is \"A hair dryer\". A hair dryer changes electrical energy into heat and motion."},{"type":"apply","q":"After a fast ride, Jo squeezes her bike brakes. Then the brakes feel warm. Why?","options":["The brakes made energy from nothing","The energy went away","Some motion energy turned into heat"],"ans":2,"hint":"The answer is \"Some motion energy turned into heat\". Some energy always turns into heat."},{"type":"apply","q":"A friend says a lamp turns ALL of its electrical energy into light. What is wrong with that?","options":["Lamps use no energy","Some energy always turns into heat","Light is not energy"],"ans":1,"hint":"The answer is \"Some energy always turns into heat\". Energy does not change completely into one form; some becomes heat."},{"type":"apply","q":"You rub your hands together fast on a cold day. What happens?","options":["Your hands get colder","Your hands get warm","Your hands start to glow"],"ans":1,"hint":"The answer is \"Your hands get warm\". Motion energy changes into heat."},{"type":"apply","q":"At the science fair, Kai's toy car runs until its battery is used up. Where did the energy go?","options":["It disappeared completely","It turned into new batteries","It changed into other forms, like motion and heat"],"ans":2,"hint":"The answer is \"It changed into other forms, like motion and heat\". Energy does not go away; it changes form."},{"type":"apply","q":"A ball bounces lower and lower until it stops. What happened to its energy?","options":["It changed into heat and sound","It was destroyed","It turned into light"],"ans":0,"hint":"The answer is \"It changed into heat and sound\". Energy never goes away; it changes into other forms."}],"form":[{"type":"know","q":"What is a form of energy?","options":["A paper you fill out","A type or kind of energy","A shape like a circle"],"ans":1,"hint":"The answer is \"A type or kind of energy\". A form of energy is a type or kind of energy."},{"type":"know","q":"Which is a form of energy?","options":["Wood","Sound","Water"],"ans":1,"hint":"The answer is \"Sound\". Sound is a kind of energy; wood and water are matter."},{"type":"know","q":"Which list names only forms of energy?","options":["Light, heat, sound","Rock, light, cloud","Water, sand, heat"],"ans":0,"hint":"The answer is \"Light, heat, sound\". Light, heat, and sound are all forms of energy."},{"type":"know","q":"Another name for motion energy is ____.","options":["thermal","sound","kinetic"],"ans":2,"hint":"The answer is \"kinetic\". Kinetic energy is motion energy."},{"type":"know","q":"Which statement is true?","options":["There are many forms of energy","There is only one form of energy","Energy has no forms"],"ans":0,"hint":"The answer is \"There are many forms of energy\". Energy comes in many forms, like light, sound, and heat."},{"type":"example","q":"Which is NOT a form of energy?","options":["Plastic","Light","Electrical"],"ans":0,"hint":"The answer is \"Plastic\". Plastic is a material, not a kind of energy."},{"type":"example","q":"Which belongs in this list: electrical, light, sound, ____?","options":["metal","glass","chemical"],"ans":2,"hint":"The answer is \"chemical\". Chemical energy is a form of energy."},{"type":"example","q":"Food stores which form of energy?","options":["Sound","Chemical","Light"],"ans":1,"hint":"The answer is \"Chemical\". Food has chemical energy stored in it."},{"type":"example","q":"A stretched rubber band has which form of energy?","options":["Sound","Potential","Light"],"ans":1,"hint":"The answer is \"Potential\". A stretched rubber band has stored, or potential, energy."},{"type":"example","q":"Which pair shows two different forms of energy?","options":["Sound and light","Rock and sand","Wood and plastic"],"ans":0,"hint":"The answer is \"Sound and light\". Sound and light are both kinds of energy."},{"type":"apply","q":"At a campfire you see flames, feel warmth, and hear crackling. Which forms of energy are there?","options":["Light, heat, and sound","Electrical only","No energy at all"],"ans":0,"hint":"The answer is \"Light, heat, and sound\". You see light, feel heat, and hear sound."},{"type":"apply","q":"Ms. Lee writes \"light, sound, heat\" on the board and asks for one more form of energy. What can you add?","options":["Cardboard","Pencil","Kinetic"],"ans":2,"hint":"The answer is \"Kinetic\". Kinetic (motion) energy is a form of energy."},{"type":"apply","q":"A roller coaster car sits at the top of a hill, ready to drop. What form of energy does it have stored?","options":["Sound","Light","Potential"],"ans":2,"hint":"The answer is \"Potential\". Its height gives it stored, or potential, energy."},{"type":"apply","q":"You wind up a toy and let go, and it zips across the floor. What form of energy does the moving toy have?","options":["Light","Kinetic","Chemical"],"ans":1,"hint":"The answer is \"Kinetic\". Moving things have kinetic (motion) energy."},{"type":"apply","q":"You plug in a phone to charge it. What form of energy flows through the cord?","options":["Sound","Light","Electrical"],"ans":2,"hint":"The answer is \"Electrical\". Electrical energy travels through wires and cords."}],"electrical":[{"type":"know","q":"Fill in the blank: \"Electrical energy is the movement of electric ____.\"","options":["sounds","smells","charges"],"ans":2,"hint":"The answer is \"charges\". Electrical energy is the movement of electric charges."},{"type":"know","q":"Electrical energy travels through ____.","options":["wires","shadows","echoes"],"ans":0,"hint":"The answer is \"wires\". Electrical energy travels through wires to power devices."},{"type":"know","q":"Which form of energy powers a lamp through its cord?","options":["Electrical","Sound","Chemical"],"ans":0,"hint":"The answer is \"Electrical\". Electrical energy travels through the cord to the lamp."},{"type":"know","q":"Which statement is true?","options":["Electrical energy can never change form","Electrical energy can change into light and heat","Electrical energy is a kind of rock"],"ans":1,"hint":"The answer is \"Electrical energy can change into light and heat\". A lamp changes electrical energy into light and heat."},{"type":"know","q":"The inside of an electric wire is usually made of ____.","options":["glass","metal","wood"],"ans":1,"hint":"The answer is \"metal\". Metal lets electric charges move through it; glass and wood do not."},{"type":"example","q":"Which uses electrical energy?","options":["A lamp plugged into the wall","A wooden spoon","A paper kite"],"ans":0,"hint":"The answer is \"A lamp plugged into the wall\". The lamp gets electrical energy through its cord."},{"type":"example","q":"Which does NOT need electrical energy to work?","options":["A TV","A pair of scissors","A computer"],"ans":1,"hint":"The answer is \"A pair of scissors\". Scissors work with your hand muscles, not electricity."},{"type":"example","q":"A TV, a fridge, and a microwave all use electrical energy. Which belongs with them?","options":["A pencil","A rubber band","A vacuum cleaner"],"ans":2,"hint":"The answer is \"A vacuum cleaner\". A vacuum cleaner is powered by electrical energy."},{"type":"example","q":"Which is an example of electric charges moving?","options":["A ball rolling","Lightning in a storm","A dog barking"],"ans":1,"hint":"The answer is \"Lightning in a storm\". Lightning is electric charges moving through the air."},{"type":"example","q":"Which pair are both powered by electrical energy?","options":["A bike and a slide","A lamp and a fan","A drum and a kite"],"ans":1,"hint":"The answer is \"A lamp and a fan\". Lamps and fans get electrical energy from the outlet."},{"type":"apply","q":"The power goes out at home. Which toy still works?","options":["A plug-in video game","A plug-in train set","A wind-up toy"],"ans":2,"hint":"The answer is \"A wind-up toy\". A wind-up toy does not need electrical energy from the outlet."},{"type":"apply","q":"You plug in a lamp and switch it on. What energy goes in and what comes out?","options":["Sound in; electrical out","Light in; sound out","Electrical in; light and heat out"],"ans":2,"hint":"The answer is \"Electrical in; light and heat out\". A lamp changes electrical energy into light and heat."},{"type":"apply","q":"Dad makes a smoothie in a blender. What energy goes in and what comes out?","options":["Electrical in; motion and sound out","Light in; chemical out","Sound in; light out"],"ans":0,"hint":"The answer is \"Electrical in; motion and sound out\". The blender changes electrical energy into spinning motion and sound."},{"type":"apply","q":"You make toast in a toaster. What energy goes in and what comes out?","options":["Sound in; chemical out","Chemical in; sound out","Electrical in; heat out"],"ans":2,"hint":"The answer is \"Electrical in; heat out\". A toaster changes electrical energy into heat."},{"type":"apply","q":"Mr. Diaz's class lamp is unplugged, so it will not turn on. Why?","options":["Electrical energy cannot reach it","The lamp is too heavy","The room is too quiet"],"ans":0,"hint":"The answer is \"Electrical energy cannot reach it\". Electrical energy must travel through the cord to power the lamp."}],"lightform":[{"type":"know","q":"Light energy is the energy we can ____.","options":["see","hear","smell"],"ans":0,"hint":"The answer is \"see\". Light is the energy we can see, and it lets us see."},{"type":"know","q":"How does light travel?","options":["Only in circles","In straight lines in all directions","Only straight down"],"ans":1,"hint":"The answer is \"In straight lines in all directions\". Light travels in straight lines in all directions."},{"type":"know","q":"Which statement is true?","options":["Light cannot pass through clear glass","Light is a sound we hear","Light comes through windows and brightens a room"],"ans":2,"hint":"The answer is \"Light comes through windows and brightens a room\". Light comes through windows and brightens a room."},{"type":"know","q":"What happens when light goes from air into water?","options":["It stops completely","It slows down and bends","It turns into sound"],"ans":1,"hint":"The answer is \"It slows down and bends\". Light slows down entering water and bends (refracts)."},{"type":"know","q":"Which form of energy matches \"the energy that lets us see\"?","options":["Sound energy","Light energy","Chemical energy"],"ans":1,"hint":"The answer is \"Light energy\". Light energy is what lets us see."},{"type":"example","q":"Which gives off light energy?","options":["A wooden block","A rubber ball","A flashlight that is on"],"ans":2,"hint":"The answer is \"A flashlight that is on\". A flashlight that is on gives off light."},{"type":"example","q":"Which does NOT give off its own light?","options":["A book","A candle flame","A lamp that is on"],"ans":0,"hint":"The answer is \"A book\". A book makes no light of its own."},{"type":"example","q":"The sun, a candle, and lightning all give off light. Which belongs with them?","options":["A pillow","A spoon","A glowing light bulb"],"ans":2,"hint":"The answer is \"A glowing light bulb\". A glowing bulb gives off light energy."},{"type":"example","q":"Which is an example of light energy brightening a room?","options":["Sunshine coming through a window","A radio playing music","A fan blowing air"],"ans":0,"hint":"The answer is \"Sunshine coming through a window\". Light comes through windows and brightens a room."},{"type":"example","q":"Which pair are both sources of light?","options":["The sun and a lit flashlight","A rock and a shoe","A spoon and a cup"],"ans":0,"hint":"The answer is \"The sun and a lit flashlight\". The sun and a lit flashlight both give off light."},{"type":"apply","q":"You are in a room with no lights on at night. Why can't you see your toys?","options":["No light reaches your eyes from them","The toys turned invisible","Your ears are covered"],"ans":0,"hint":"The answer is \"No light reaches your eyes from them\". We need light to see things."},{"type":"apply","q":"Why does a red apple look red?","options":["It makes its own red light","It absorbs red light and reflects the others","It reflects red light and absorbs the other colors"],"ans":2,"hint":"The answer is \"It reflects red light and absorbs the other colors\". We see a color because the object reflects that color."},{"type":"apply","q":"Lily puts a pencil in a glass of water. The pencil looks bent. Why?","options":["The pencil really broke","Light slows down and bends in the water","The water turned into a mirror"],"ans":1,"hint":"The answer is \"Light slows down and bends in the water\". Light slows down entering water and bends."},{"type":"apply","q":"Your flashlight beam cannot light up the hallway around the corner. Why?","options":["Light is too heavy","Light travels in straight lines","Light only travels upward"],"ans":1,"hint":"The answer is \"Light travels in straight lines\". Light travels in straight lines, so it cannot turn a corner."},{"type":"apply","q":"You turn on a flashlight. What energy goes in and what comes out?","options":["Sound in; chemical out","Light in; sound out","Chemical from the battery in; light out"],"ans":2,"hint":"The answer is \"Chemical from the battery in; light out\". The battery's chemical energy becomes light (and some heat)."}],"heatform":[{"type":"know","q":"Thermal energy is energy related to ____.","options":["sound","heat","light"],"ans":1,"hint":"The answer is \"heat\". Thermal energy is energy related to heat."},{"type":"know","q":"Fill in the blank: \"Heat is the transfer of energy from a ____ object to a colder one.\"","options":["warmer","colder","quieter"],"ans":0,"hint":"The answer is \"warmer\". Heat moves from a warmer object to a colder one."},{"type":"know","q":"Which statement is true?","options":["Heat moves from cold things to warm things","Heat energy can cook food","Thermal energy is a kind of sound"],"ans":1,"hint":"The answer is \"Heat energy can cook food\". Heat energy cooks food in the kitchen."},{"type":"know","q":"What is another name for heat energy?","options":["Thermal energy","Electrical energy","Sound energy"],"ans":0,"hint":"The answer is \"Thermal energy\". Thermal energy is energy related to heat."},{"type":"know","q":"Which material is a good heat conductor?","options":["Metal","Wood","Plastic"],"ans":0,"hint":"The answer is \"Metal\". Metals are good heat conductors; wood and plastic are not."},{"type":"example","q":"Which is an example of heat energy cooking food?","options":["A fan blowing air","A radio playing a song","A stove frying an egg"],"ans":2,"hint":"The answer is \"A stove frying an egg\". The stove's heat energy cooks the egg."},{"type":"example","q":"Which pair are both good heat conductors?","options":["A wooden spoon and a plastic cup","An iron pan and a copper pot","A plastic plate and a wooden board"],"ans":1,"hint":"The answer is \"An iron pan and a copper pot\". Iron and copper are metals, and metals conduct heat well."},{"type":"example","q":"Which is NOT a source of heat?","options":["An ice cube","A campfire","The sun"],"ans":0,"hint":"The answer is \"An ice cube\". An ice cube is cold and does not give off heat."},{"type":"example","q":"An oven, a toaster, and a campfire all give off heat. Which belongs with them?","options":["An ice pack","A glass of cold milk","A space heater"],"ans":2,"hint":"The answer is \"A space heater\". A space heater gives off heat."},{"type":"example","q":"Which shows heat moving from warmer to cooler?","options":["A cold spoon making soup hotter","An ice cube making a drink warmer","Hot cocoa warming your cold hands"],"ans":2,"hint":"The answer is \"Hot cocoa warming your cold hands\". Heat flows from the warm cocoa to your cooler hands."},{"type":"apply","q":"You leave a metal spoon in hot soup. Soon the handle is hot too. Why?","options":["Metal is a bad heat conductor","The spoon makes its own heat","Metal is a good heat conductor"],"ans":2,"hint":"The answer is \"Metal is a good heat conductor\". Metals are good heat conductors."},{"type":"apply","q":"You hold an ice cube in your hand and it melts. Which way is heat moving?","options":["From the ice to your hand","From your hand to the ice","Heat is not moving"],"ans":1,"hint":"The answer is \"From your hand to the ice\". Heat flows from warmer to cooler."},{"type":"apply","q":"Which frying pan handle keeps your hand from getting burned?","options":["A wooden handle","An iron handle","A copper handle"],"ans":0,"hint":"The answer is \"A wooden handle\". Wood is a bad heat conductor, so it stays cooler."},{"type":"apply","q":"A glass of cold lemonade sits outside on a hot day and gets warmer. Why?","options":["Cold moves from the drink into the air","Heat moves from the warm air into the drink","The drink makes its own heat"],"ans":1,"hint":"The answer is \"Heat moves from the warm air into the drink\". Heat flows from the warmer air to the cooler drink."},{"type":"apply","q":"You turn on a hair dryer. Electrical energy goes in. What comes out to dry your hair?","options":["Chemical energy","Light only","Heat and moving air"],"ans":2,"hint":"The answer is \"Heat and moving air\". A hair dryer changes electrical energy into heat and motion."}],"soundform":[{"type":"know","q":"Sound energy is the form of energy we can ____.","options":["see","hear","taste"],"ans":1,"hint":"The answer is \"hear\". Sound is the form of energy we can hear."},{"type":"know","q":"Sound is made by ____.","options":["vibrations","shadows","colors"],"ans":0,"hint":"The answer is \"vibrations\". Sound is made by vibrations."},{"type":"know","q":"Which statement is true?","options":["Sound travels fastest through gases","Sound can travel through empty space","Sound travels fastest through solids"],"ans":2,"hint":"The answer is \"Sound travels fastest through solids\". Sound is fastest in solids, slower in liquids, slowest in gases."},{"type":"know","q":"Where can sound NOT travel?","options":["In outer space, where there is no air","Through water","Through a wooden door"],"ans":0,"hint":"The answer is \"In outer space, where there is no air\". Sound needs matter to travel through."},{"type":"know","q":"Which form of energy matches \"made by vibrations and heard with our ears\"?","options":["Light energy","Sound energy","Electrical energy"],"ans":1,"hint":"The answer is \"Sound energy\". Sound energy is made by vibrations and we hear it."},{"type":"example","q":"Which makes sound energy?","options":["A rock sitting quietly","A turned-off TV","A guitar string being plucked"],"ans":2,"hint":"The answer is \"A guitar string being plucked\". A plucked string vibrates and makes sound."},{"type":"example","q":"Which is NOT a source of sound?","options":["A closed book on a shelf","A barking dog","A ringing bell"],"ans":0,"hint":"The answer is \"A closed book on a shelf\". A closed book is not vibrating, so it makes no sound."},{"type":"example","q":"A drum, a trumpet, and a piano all make sound energy. Which belongs with them?","options":["A violin","A pillow","A sponge"],"ans":0,"hint":"The answer is \"A violin\". A violin is a musical instrument, and instruments make sound."},{"type":"example","q":"Which is an example of vibrations making sound?","options":["A shadow on the wall","A twanged rubber band humming","Sunlight on the floor"],"ans":1,"hint":"The answer is \"A twanged rubber band humming\". The rubber band vibrates and makes sound."},{"type":"example","q":"Sound travels fastest through which of these?","options":["Air","A metal rail","Water"],"ans":1,"hint":"The answer is \"A metal rail\". Sound travels fastest through solids like metal."},{"type":"apply","q":"You press your ear to your desk while a friend taps the other end. The taps sound clear. Why?","options":["Sound cannot travel through solids","The desk makes light","Sound travels well through solids"],"ans":2,"hint":"The answer is \"Sound travels well through solids\". Sound travels fastest through solids."},{"type":"apply","q":"Astronauts in space use radios to talk. Why can't they just shout?","options":["Space is too bright","Their helmets make light","There is no air for sound to travel through"],"ans":2,"hint":"The answer is \"There is no air for sound to travel through\". Sound cannot travel without matter to move through."},{"type":"apply","q":"You strum an acoustic guitar. What energy goes in and what comes out?","options":["Electrical in; light out","Light in; chemical out","Motion energy in; sound energy out"],"ans":2,"hint":"The answer is \"Motion energy in; sound energy out\". Your moving fingers make the strings vibrate and make sound."},{"type":"apply","q":"At the swimming pool, a friend clicks two rocks together underwater. You can hear it. Why?","options":["Sound only travels through air","Sound can travel through water","Water makes sound vanish"],"ans":1,"hint":"The answer is \"Sound can travel through water\". Sound travels through liquids like water."},{"type":"apply","q":"In class, you touch your throat while you hum and feel a buzz. What is the buzz?","options":["Vibrations that make sound","Light energy","Electrical energy"],"ans":0,"hint":"The answer is \"Vibrations that make sound\". Sound is made by vibrations."}],"mechanical":[{"type":"know","q":"What is mechanical energy?","options":["Energy that flows through wires","Energy of an object's motion or position","Energy stored inside food"],"ans":1,"hint":"The answer is \"Energy of an object's motion or position\". Mechanical energy is the energy of an object's motion or position."},{"type":"know","q":"Mechanical energy is the energy of an object's motion or its ____.","options":["smell","color","position"],"ans":2,"hint":"The answer is \"position\". Mechanical energy comes from motion or position."},{"type":"know","q":"Which statement is true?","options":["Mechanical energy is the same as light energy","Mechanical energy can be kinetic or potential","Mechanical energy is only found in machines"],"ans":1,"hint":"The answer is \"Mechanical energy can be kinetic or potential\". Motion energy (kinetic) and position energy (potential) are both mechanical."},{"type":"know","q":"Which term means 'the energy of an object's motion or position'?","options":["Electrical energy","Mechanical energy","Chemical energy"],"ans":1,"hint":"The answer is \"Mechanical energy\". That is the meaning of mechanical energy."},{"type":"know","q":"Mechanical energy is made of which two kinds of energy?","options":["Chemical and electrical","Light and sound","Kinetic and potential"],"ans":2,"hint":"The answer is \"Kinetic and potential\". Kinetic is motion and potential is position."},{"type":"example","q":"Which is an example of mechanical energy?","options":["The warmth of a cup of cocoa","The glow of a lamp","A swinging playground swing"],"ans":2,"hint":"The answer is \"A swinging playground swing\". A moving swing has energy of motion."},{"type":"example","q":"Which is NOT an example of mechanical energy?","options":["A ball flying through the air","Sunlight shining through a window","A kid pedaling a bike"],"ans":1,"hint":"The answer is \"Sunlight shining through a window\". Sunlight is light energy, not motion or position of an object."},{"type":"example","q":"Which shows mechanical energy because of where it is (its position)?","options":["A rock sitting at the top of a hill","The heat from a campfire","The light from a flashlight"],"ans":0,"hint":"The answer is \"A rock sitting at the top of a hill\". A raised rock has stored energy from its position."},{"type":"example","q":"Which group shows only examples of mechanical energy?","options":["Battery, gasoline, banana","Spinning top, falling leaf, rolling cart","Lamp light, toaster heat, sunlight"],"ans":1,"hint":"The answer is \"Spinning top, falling leaf, rolling cart\". All of those things are moving."},{"type":"example","q":"Pick the one that belongs with 'mechanical energy'.","options":["A kite flying in the wind","A glowing light bulb","A charged battery in a drawer"],"ans":0,"hint":"The answer is \"A kite flying in the wind\". A flying kite is moving, so it has energy of motion."},{"type":"apply","q":"Mia puts her backpack on a high shelf, where it stays. What energy does it have because it is up high?","options":["Potential energy","Sound energy","Light energy"],"ans":0,"hint":"The answer is \"Potential energy\". A raised object has stored (potential) energy because of gravity."},{"type":"apply","q":"Leo kicks a soccer ball and it rolls across the field. Which part of mechanical energy does the rolling ball show?","options":["Chemical, because it is stored in food","Potential, because it is stretched","Kinetic, because it is moving"],"ans":2,"hint":"The answer is \"Kinetic, because it is moving\". Moving objects have kinetic energy."},{"type":"apply","q":"At a science fair, Ava lets a toy car roll down a ramp. Which energy is she showing?","options":["Mechanical energy","Electrical energy","Light energy"],"ans":0,"hint":"The answer is \"Mechanical energy\". The car's height and motion are mechanical energy."},{"type":"apply","q":"A roller coaster car sits at the top of a big hill, then zooms down. What happens to its energy?","options":["Position energy changes to motion energy","Motion energy changes to light energy","All of its energy disappears"],"ans":0,"hint":"The answer is \"Position energy changes to motion energy\". Potential energy from height changes into kinetic energy."},{"type":"apply","q":"Your class wants a quick demo of mechanical energy. What would you use?","options":["A flashlight shining on a wall","A cup of hot cocoa","A ball bouncing on the floor"],"ans":2,"hint":"The answer is \"A ball bouncing on the floor\". A bouncing ball has motion and position energy."}],"potential":[{"type":"know","q":"What is potential energy?","options":["Energy of light","Energy of sound","Stored energy"],"ans":2,"hint":"The answer is \"Stored energy\". Potential energy is stored energy."},{"type":"know","q":"A raised object has stored energy because of ____.","options":["color","gravity","sound"],"ans":1,"hint":"The answer is \"gravity\". Gravity gives a raised object stored energy."},{"type":"know","q":"Which statement is true?","options":["Potential energy can change into kinetic energy","Potential energy only comes from sunlight","Potential energy can never change form"],"ans":0,"hint":"The answer is \"Potential energy can change into kinetic energy\". Stored energy can change into motion energy."},{"type":"know","q":"Which word means 'stored energy' like a raised ball or a stretched spring has?","options":["Kinetic","Sound","Potential"],"ans":2,"hint":"The answer is \"Potential\". Potential energy is stored energy."},{"type":"know","q":"What can you do to a spring to store potential energy in it?","options":["Paint it","Shine a light on it","Squeeze it"],"ans":2,"hint":"The answer is \"Squeeze it\". Squeezing (compressing) a spring stores potential energy."},{"type":"example","q":"Which has potential energy because it is raised up?","options":["A shadow on the floor","A book on a high shelf","A song playing on the radio"],"ans":1,"hint":"The answer is \"A book on a high shelf\". A raised object stores energy because of gravity."},{"type":"example","q":"Which is an example of potential energy from stretching?","options":["A glowing lamp","A ringing bell","A stretched rubber band"],"ans":2,"hint":"The answer is \"A stretched rubber band\". Stretching a rubber band stores potential energy."},{"type":"example","q":"Which one is NOT storing potential energy?","options":["A kid sitting at the top of a slide","Sunlight shining on the grass","A squeezed spring"],"ans":1,"hint":"The answer is \"Sunlight shining on the grass\". Sunlight is light energy, not stored energy from height or stretching."},{"type":"example","q":"Which group shows only stored potential energy?","options":["Rolling ball, spinning top, running dog","Pulled-back bow, raised hammer, squished spring","Pulled-back bow, ringing bell, lamp light"],"ans":1,"hint":"The answer is \"Pulled-back bow, raised hammer, squished spring\". Raised, stretched or squeezed things store potential energy."},{"type":"example","q":"Pick the one that belongs with 'potential energy'.","options":["A drum making a loud boom","A light shining in the dark","A diver standing on a high board"],"ans":2,"hint":"The answer is \"A diver standing on a high board\". The diver is up high, so the diver has stored energy."},{"type":"apply","q":"Sam pulls back the rubber band on a slingshot and holds it still. What does the stretched band have?","options":["Stored potential energy","Sound energy","Light energy"],"ans":0,"hint":"The answer is \"Stored potential energy\". Stretching a rubber band stores potential energy."},{"type":"apply","q":"Sam lets go and the rubber band snaps forward. What energy change happens?","options":["Sound energy changes to potential energy","Potential energy changes to kinetic energy","Kinetic energy changes to light energy"],"ans":1,"hint":"The answer is \"Potential energy changes to kinetic energy\". The stored energy changes into motion energy."},{"type":"apply","q":"Two balls that are the same sit on two shelves. Which has more stored energy from gravity?","options":["The ball on the higher shelf","Neither ball has any","The ball on the lower shelf"],"ans":0,"hint":"The answer is \"The ball on the higher shelf\". The higher an object is raised, the more energy it stores."},{"type":"apply","q":"Ben has a toy that jumps when its spring is pushed down and let go. What should he do first to store energy in it?","options":["Push the spring down","Shine a flashlight on it","Leave the spring loose"],"ans":0,"hint":"The answer is \"Push the spring down\". Squeezing (compressing) a spring stores potential energy."},{"type":"apply","q":"Why does a ball you hold up high start to fall when you let go?","options":["Gravity pulls it and stored energy becomes motion","The ball runs out of energy","Light pushes the ball down"],"ans":0,"hint":"The answer is \"Gravity pulls it and stored energy becomes motion\". Stored energy from height changes into kinetic energy as it falls."}],"chemical":[{"type":"know","q":"What is chemical energy?","options":["Energy carried by a sound","Energy stored in food, fuels and batteries","Energy of a moving object"],"ans":1,"hint":"The answer is \"Energy stored in food, fuels and batteries\". Chemical energy is stored in food, fuels and batteries."},{"type":"know","q":"Chemical energy is stored in food, fuels like ____, and batteries.","options":["sunlight","echoes","gasoline"],"ans":2,"hint":"The answer is \"gasoline\". Gasoline is a fuel that stores chemical energy."},{"type":"know","q":"Which statement is true?","options":["Chemical energy can never change form","Chemical energy is only found in the sun","Chemical energy can change into a form that does work"],"ans":2,"hint":"The answer is \"Chemical energy can change into a form that does work\". Stored chemical energy can change into a form that does work."},{"type":"know","q":"Which term means 'energy stored in food, fuels and batteries'?","options":["Chemical energy","Sound energy","Light energy"],"ans":0,"hint":"The answer is \"Chemical energy\". That is the meaning of chemical energy."},{"type":"know","q":"What kind of energy does a battery store?","options":["Chemical energy","Kinetic energy","Sound energy"],"ans":0,"hint":"The answer is \"Chemical energy\". A battery stores chemical energy."},{"type":"example","q":"Which one has stored chemical energy?","options":["A shadow","A banana","An echo"],"ans":1,"hint":"The answer is \"A banana\". Food like a banana stores chemical energy."},{"type":"example","q":"Which is NOT an example of chemical energy?","options":["A tank of gasoline","A rainbow","A sandwich"],"ans":1,"hint":"The answer is \"A rainbow\". A rainbow is light, not stored energy in food, fuel or a battery."},{"type":"example","q":"Which group all store chemical energy?","options":["Apple, gasoline, battery","Shadow, rainbow, sound","Apple, sunlight, echo"],"ans":0,"hint":"The answer is \"Apple, gasoline, battery\". Food, fuel and batteries all store chemical energy."},{"type":"example","q":"Pick the one that belongs with 'chemical energy'.","options":["Firewood","A shadow","A mirror"],"ans":0,"hint":"The answer is \"Firewood\". Wood is a fuel, so it stores chemical energy."},{"type":"example","q":"Which thing in your kitchen stores chemical energy?","options":["The light from the ceiling lamp","The beep of the oven timer","A box of cereal"],"ans":2,"hint":"The answer is \"A box of cereal\". Cereal is food, and food stores chemical energy."},{"type":"apply","q":"You eat breakfast, then run at recess. What energy from the food helps your body move?","options":["Light energy","Sound energy","Chemical energy"],"ans":2,"hint":"The answer is \"Chemical energy\". Food stores chemical energy that your body changes into motion."},{"type":"apply","q":"A flashlight runs on batteries. What kind of energy is stored in the batteries?","options":["Chemical energy","Sound energy","Kinetic energy"],"ans":0,"hint":"The answer is \"Chemical energy\". Batteries store chemical energy."},{"type":"apply","q":"A car burns gasoline to drive. What does the gasoline's stored energy change into to make the car move?","options":["Nothing; it just disappears","Kinetic (motion) energy","More gasoline"],"ans":1,"hint":"The answer is \"Kinetic (motion) energy\". Chemical energy in gasoline changes to kinetic energy."},{"type":"apply","q":"Campers burn wood in a campfire. What does the wood's stored energy change into?","options":["Nothing at all","Electrical energy only","Heat and light"],"ans":2,"hint":"The answer is \"Heat and light\". Burning wood changes chemical energy into heat and light."},{"type":"apply","q":"Your toy robot won't move anymore. What could you replace to give it a new supply of stored energy?","options":["Its buttons","Its batteries","Its plastic case"],"ans":1,"hint":"The answer is \"Its batteries\". Batteries store chemical energy the robot can use."}],"kinetic":[{"type":"know","q":"What is kinetic energy?","options":["The energy of motion","Energy stored in food","Energy that comes from light"],"ans":0,"hint":"The answer is \"The energy of motion\". Kinetic energy is the energy of motion."},{"type":"know","q":"Kinetic energy is the energy an object has because it is ____.","options":["colorful","moving","quiet"],"ans":1,"hint":"The answer is \"moving\". Kinetic energy is the energy of a moving object."},{"type":"know","q":"Which statement is true?","options":["A still rock has kinetic energy","Only cars can have kinetic energy","Anything that is moving has kinetic energy"],"ans":2,"hint":"The answer is \"Anything that is moving has kinetic energy\". Every moving object has kinetic energy."},{"type":"know","q":"What is another name for kinetic energy?","options":["Light energy","Motion energy","Stored energy"],"ans":1,"hint":"The answer is \"Motion energy\". Kinetic energy is also called motion energy."},{"type":"know","q":"A ball stops rolling and sits still. How much kinetic energy does it have now?","options":["More than before","None","The same as when it was rolling"],"ans":1,"hint":"The answer is \"None\". Kinetic energy is the energy of motion, so a still object has none."},{"type":"example","q":"Which one has kinetic energy?","options":["A parked bike","A rock sitting on the ground","A running dog"],"ans":2,"hint":"The answer is \"A running dog\". The dog is moving, so it has kinetic energy."},{"type":"example","q":"Which is NOT an example of kinetic energy?","options":["A book resting on a desk","A falling raindrop","A spinning fan"],"ans":0,"hint":"The answer is \"A book resting on a desk\". The book is not moving, so it has no kinetic energy."},{"type":"example","q":"Which group shows only things with kinetic energy?","options":["Flying bird, rolling ball, moving swing","Parked car, still rock, closed book","Flying bird, parked car, still rock"],"ans":0,"hint":"The answer is \"Flying bird, rolling ball, moving swing\". All of those things are moving."},{"type":"example","q":"Pick the one that belongs with 'kinetic energy'.","options":["A kid racing down the slide","A pencil lying on the floor","A battery in a drawer"],"ans":0,"hint":"The answer is \"A kid racing down the slide\". A kid sliding down is moving, so the kid has kinetic energy."},{"type":"example","q":"Which playground thing shows motion energy?","options":["A still sandbox","An empty bench","A spinning merry-go-round"],"ans":2,"hint":"The answer is \"A spinning merry-go-round\". The spinning merry-go-round is moving."},{"type":"apply","q":"Zoe pedals her bike faster and faster. What happens to her kinetic energy?","options":["It goes down","It stays at zero","It goes up"],"ans":2,"hint":"The answer is \"It goes up\". The faster something moves, the more kinetic energy it has."},{"type":"apply","q":"A bowling ball rolls into the pins and they fall over. Why do the pins move?","options":["The pins were pulled by sound","The ball's motion energy was passed to them","The pins made their own light energy"],"ans":1,"hint":"The answer is \"The ball's motion energy was passed to them\". The moving ball's kinetic energy is passed to the pins."},{"type":"apply","q":"At a science fair, Omar shows a pinwheel spinning in the wind. What energy does the spinning pinwheel have?","options":["Chemical energy","Kinetic energy","Electrical energy"],"ans":1,"hint":"The answer is \"Kinetic energy\". A spinning pinwheel is moving, so it has kinetic energy."},{"type":"apply","q":"Ella's toy car uses a battery to zoom across the floor. What energy goes in, and what comes out to make it move?","options":["Kinetic in, chemical out","Sound in, light out","Chemical in, kinetic out"],"ans":2,"hint":"The answer is \"Chemical in, kinetic out\". The battery's chemical energy changes into motion energy."},{"type":"apply","q":"Dad fills the car with gasoline and drives you to school. What energy change makes the car move?","options":["Chemical energy to kinetic energy","Light energy to chemical energy","Sound energy to chemical energy"],"ans":0,"hint":"The answer is \"Chemical energy to kinetic energy\". Gasoline's stored chemical energy changes to kinetic energy."}],"lighttravel":[{"type":"know","q":"How does light travel from its source?","options":["Outward in all directions","Only toward the ground","Only straight up"],"ans":0,"hint":"The answer is \"Outward in all directions\". Light travels outward from its source in all directions."},{"type":"know","q":"Light travels in a ____ line until it hits an object or moves into a new material.","options":["curvy","straight","zigzag"],"ans":1,"hint":"The answer is \"straight\". Light travels in a straight line."},{"type":"know","q":"Which statement is true?","options":["Light always travels in curved paths","Light can pass through some objects","Light can never pass through anything"],"ans":1,"hint":"The answer is \"Light can pass through some objects\". Some objects, like clear glass, let light pass through."},{"type":"know","q":"What three things can happen to light when it hits something?","options":["It can be melted, frozen, or boiled","It can be stretched, squeezed, or rolled","It can be reflected, refracted, or absorbed"],"ans":2,"hint":"The answer is \"It can be reflected, refracted, or absorbed\". Light can be reflected, refracted, or absorbed."},{"type":"know","q":"In science, what is a medium?","options":["A material that light travels through","A color of light","A kind of light bulb"],"ans":0,"hint":"The answer is \"A material that light travels through\". A medium is a material, like air, water or glass."},{"type":"example","q":"Which one can light pass through?","options":["A wooden door","A clear glass window","A brick wall"],"ans":1,"hint":"The answer is \"A clear glass window\". Clear glass lets light pass through."},{"type":"example","q":"Which shows that light travels in straight lines?","options":["Light curving around a corner wall","A flashlight beam going straight across a dark room","Light wiggling like a snake"],"ans":1,"hint":"The answer is \"A flashlight beam going straight across a dark room\". Light travels in straight lines, so the beam is straight."},{"type":"example","q":"Which is a light source that sends light out in all directions?","options":["A rock","A mirror","A lit candle"],"ans":2,"hint":"The answer is \"A lit candle\". A lit candle makes light that spreads out in all directions."},{"type":"example","q":"Which object will NOT let light pass through?","options":["A clear glass of water","Clear plastic wrap","A cardboard box"],"ans":2,"hint":"The answer is \"A cardboard box\". Light cannot pass through thick cardboard."},{"type":"example","q":"Which group of things all let light pass through?","options":["Window glass, clear water, plastic wrap","Brick, metal pan, book","Window glass, brick, book"],"ans":0,"hint":"The answer is \"Window glass, clear water, plastic wrap\". Clear materials let light pass through."},{"type":"apply","q":"You hide behind a big tree while your friend shines a flashlight at it. Why can't the light reach you?","options":["Light can only travel upward","Light always bends around trees","Light goes straight and the tree blocks it"],"ans":2,"hint":"The answer is \"Light goes straight and the tree blocks it\". Light travels in a straight line until it hits an object."},{"type":"apply","q":"A lamp sits in the middle of the room. Who can its light reach?","options":["People on every side of it","Only people above it","Only the person in front of it"],"ans":0,"hint":"The answer is \"People on every side of it\". Light travels outward in all directions."},{"type":"apply","q":"Ms. Lee shines a flashlight through three cards with holes. The light reaches the wall only when the holes line up. What does this show?","options":["Light travels in curves","Light needs holes to exist","Light travels in straight lines"],"ans":2,"hint":"The answer is \"Light travels in straight lines\". Light only gets through when the holes make a straight path."},{"type":"apply","q":"Sunlight shines on a pond. Which of these could NOT happen to the light?","options":["It turns into water","It reflects off the surface","It refracts into the water"],"ans":0,"hint":"The answer is \"It turns into water\". Light can be reflected, refracted, or absorbed, but it does not become water."},{"type":"apply","q":"You want sunlight to reach a plant inside a box. What should you cover the opening with?","options":["Thick cardboard","Clear plastic","Aluminum foil"],"ans":1,"hint":"The answer is \"Clear plastic\". Light can pass through clear plastic."}],"reflect":[{"type":"know","q":"What does reflect mean?","options":["To bend","To bounce off","To take in"],"ans":1,"hint":"The answer is \"To bounce off\". Reflect means to bounce off."},{"type":"know","q":"We see objects because light ____ off them.","options":["melts","freezes","reflects"],"ans":2,"hint":"The answer is \"reflects\". Light reflects off objects and into our eyes."},{"type":"know","q":"Which statement is true?","options":["Flat, smooth surfaces reflect light evenly","Nothing can reflect light","Rough water reflects light evenly"],"ans":0,"hint":"The answer is \"Flat, smooth surfaces reflect light evenly\". Smooth, flat surfaces like mirrors reflect light evenly."},{"type":"know","q":"Which word means 'to bounce off'?","options":["Absorb","Reflect","Refract"],"ans":1,"hint":"The answer is \"Reflect\". Reflect means to bounce off."},{"type":"know","q":"Why can you see a book in a lit room?","options":["The book makes its own light","Light bounces off the book into your eyes","Your eyes shine light onto it"],"ans":1,"hint":"The answer is \"Light bounces off the book into your eyes\". We see objects because light reflects off them."},{"type":"example","q":"Which reflects light evenly so you see a clear picture of yourself?","options":["A crumpled paper bag","A wavy, rough pond","A flat mirror"],"ans":2,"hint":"The answer is \"A flat mirror\". A flat, smooth mirror reflects light evenly."},{"type":"example","q":"Which surface would NOT give a clear reflection?","options":["A smooth, calm lake","Rough, choppy water","A bathroom mirror"],"ans":1,"hint":"The answer is \"Rough, choppy water\". Rough water does not reflect light evenly."},{"type":"example","q":"Which group all give clear, even reflections?","options":["Mirror, rough water, crumpled foil","Sandpaper, rough rock, wavy water","Mirror, still pond, smooth shiny metal"],"ans":2,"hint":"The answer is \"Mirror, still pond, smooth shiny metal\". Flat, smooth surfaces reflect light evenly."},{"type":"example","q":"Which is an example of reflection?","options":["A straw looking bent in water","A strawberry taking in blue light","Seeing your face in a mirror"],"ans":2,"hint":"The answer is \"Seeing your face in a mirror\". Light bounces off the mirror back to your eyes."},{"type":"example","q":"Which object do we see only because light bounces off it, not because it makes its own light?","options":["A chair","The sun","A lit lamp"],"ans":0,"hint":"The answer is \"A chair\". A chair makes no light; we see it because light reflects off it."},{"type":"apply","q":"Jake looks into a lake on a windy day and can't see a clear picture of himself. Why?","options":["Rough water does not reflect evenly","Water takes in all light","Light cannot reach water"],"ans":0,"hint":"The answer is \"Rough water does not reflect evenly\". Rough water does not reflect light evenly."},{"type":"apply","q":"At night, car headlights hit a bike reflector and it shines back. What is happening?","options":["Light bounces off the reflector","The reflector makes its own light","The reflector bends light down into the road"],"ans":0,"hint":"The answer is \"Light bounces off the reflector\". The reflector bounces the car's light back."},{"type":"apply","q":"In class, Mia wants to bounce a flashlight beam onto a poster across the room. What should she use?","options":["A piece of black felt","A dark sponge","A flat mirror"],"ans":2,"hint":"The answer is \"A flat mirror\". A flat, smooth mirror reflects light evenly."},{"type":"apply","q":"The lights go off in a room with no windows, and you can't see your toys. Why?","options":["The toys shrink in the dark","No light is reflecting off them to your eyes","The toys disappear in the dark"],"ans":1,"hint":"The answer is \"No light is reflecting off them to your eyes\". We see objects only when light reflects off them."},{"type":"apply","q":"You shine a flashlight at a mirror. Where does most of the light go?","options":["It bounces back off the mirror","It turns into sound","It goes into the mirror and stops"],"ans":0,"hint":"The answer is \"It bounces back off the mirror\". A mirror reflects light, which means it bounces off."}],"refract":[{"type":"know","q":"What does refract mean?","options":["To bounce off","To take in","To bend"],"ans":2,"hint":"The answer is \"To bend\". Refract means light bends."},{"type":"know","q":"Light ____ when it goes from air into water.","options":["slows down","stops","speeds up"],"ans":0,"hint":"The answer is \"slows down\". Light slows down when it goes from air into water."},{"type":"know","q":"Which statement is true?","options":["Light travels at different speeds in different materials","Light cannot travel through water","Light travels at the same speed in every material"],"ans":0,"hint":"The answer is \"Light travels at different speeds in different materials\". Changing speed between materials is why light bends."},{"type":"know","q":"Which word means light bending as it passes between materials?","options":["Reflect","Absorb","Refract"],"ans":2,"hint":"The answer is \"Refract\". Refract means to bend."},{"type":"know","q":"When does light refract?","options":["Only when it hits a flat mirror","When it passes from one material into another","Only when it is dark"],"ans":1,"hint":"The answer is \"When it passes from one material into another\". Light refracts when it passes between different materials."},{"type":"example","q":"Which is an example of refraction?","options":["A red apple looks red","Seeing yourself in a mirror","A straw looks bent in a glass of water"],"ans":2,"hint":"The answer is \"A straw looks bent in a glass of water\". Light bends between water and air, so the straw looks bent."},{"type":"example","q":"Which is NOT an example of refraction?","options":["A magnifying glass making print look bigger","Light bouncing off a mirror","A pencil looking broken in water"],"ans":1,"hint":"The answer is \"Light bouncing off a mirror\". Bouncing off is reflection, not bending."},{"type":"example","q":"Which object is made to bend light?","options":["A flat mirror","A sheet of black cardboard","A magnifying glass lens"],"ans":2,"hint":"The answer is \"A magnifying glass lens\". A lens bends (refracts) light."},{"type":"example","q":"Which group all show light bending?","options":["Black shirt, dark rug, red flower","Mirror, bike reflector, shiny spoon","Bent-looking straw, magnifying lens, pencil in water"],"ans":2,"hint":"The answer is \"Bent-looking straw, magnifying lens, pencil in water\". Each of these bends light as it passes between materials."},{"type":"example","q":"Pick the one that belongs with 'refract'.","options":["A swimming pool looking less deep than it really is","A shadow on the sidewalk","A glow-in-the-dark sticker"],"ans":0,"hint":"The answer is \"A swimming pool looking less deep than it really is\". Light bends as it leaves the water, so the pool looks shallower."},{"type":"apply","q":"Ava puts a pencil in a glass of water. It looks broken at the water line. Why?","options":["The water really broke the pencil","Light bends as it passes between water and air","The pencil melted in the water"],"ans":1,"hint":"The answer is \"Light bends as it passes between water and air\". Light refracts between water and air."},{"type":"apply","q":"Max shines a flashlight at a slant into a tank of water. What will the beam do as it enters the water?","options":["Turn into sound","Bend","Stop"],"ans":1,"hint":"The answer is \"Bend\". Light slows down in water and bends."},{"type":"apply","q":"At a science fair, Kim shows a magnifying glass making words look bigger. What is the lens doing to the light?","options":["Bending it","Turning it into sound","Taking in all of it"],"ans":0,"hint":"The answer is \"Bending it\". A lens refracts (bends) light."},{"type":"apply","q":"Your friend reaches for a toy on the bottom of a pool but misses. Why?","options":["Light travels in curves through air","Light bends, so the toy is not exactly where it looks","The toy moves away by itself"],"ans":1,"hint":"The answer is \"Light bends, so the toy is not exactly where it looks\". Light bends as it leaves the water, which fools your eyes."},{"type":"apply","q":"Which would you use to show refraction to your class?","options":["A clear glass of water and a straw","A flat mirror and a flashlight","A black cloth"],"ans":0,"hint":"The answer is \"A clear glass of water and a straw\". A straw looks bent in water because light bends."}],"absorb":[{"type":"know","q":"What does absorb mean?","options":["To take in","To bounce off","To bend"],"ans":0,"hint":"The answer is \"To take in\". Absorb means to take in."},{"type":"know","q":"The color we see is the color that is ____.","options":["melted","absorbed","reflected"],"ans":2,"hint":"The answer is \"reflected\". We see the color an object reflects."},{"type":"know","q":"Which statement is true?","options":["Light is made of different colors","Light is only one color","Light has no colors in it"],"ans":0,"hint":"The answer is \"Light is made of different colors\". Light is made of different colors."},{"type":"know","q":"Which word means 'to take in'?","options":["Refract","Absorb","Reflect"],"ans":1,"hint":"The answer is \"Absorb\". Absorb means to take in."},{"type":"know","q":"A red flower reflects red light. What does it do with the other colors?","options":["Reflects them too","Absorbs them","Turns them red"],"ans":1,"hint":"The answer is \"Absorbs them\". A red flower absorbs the other colors."},{"type":"example","q":"Which object reflects green light and absorbs the other colors?","options":["A green leaf","A red apple","A yellow banana"],"ans":0,"hint":"The answer is \"A green leaf\". We see a leaf as green because it reflects green."},{"type":"example","q":"Which is an example of light being absorbed?","options":["A straw looking bent in water","A mirror bouncing light back","A dark rug taking in sunlight"],"ans":2,"hint":"The answer is \"A dark rug taking in sunlight\". Taking in light is absorbing."},{"type":"example","q":"A blue shirt looks blue. Which color of light does it reflect?","options":["Yellow","Red","Blue"],"ans":2,"hint":"The answer is \"Blue\". We see the color an object reflects, and it absorbs the other colors."},{"type":"example","q":"Which list matches each thing with the color it reflects?","options":["Banana: blue, grass: red, strawberry: green","Banana: green, grass: yellow, strawberry: blue","Banana: yellow, grass: green, strawberry: red"],"ans":2,"hint":"The answer is \"Banana: yellow, grass: green, strawberry: red\". We see the color each object reflects."},{"type":"example","q":"Red light shines on these things. Which one absorbs the red light?","options":["Blue jeans","A red strawberry","A red fire truck"],"ans":0,"hint":"The answer is \"Blue jeans\". Blue jeans reflect blue and absorb other colors, like red."},{"type":"apply","q":"Lily sees a red flower in the garden. Why does it look red?","options":["It reflects red and absorbs the other colors","It makes its own red light","It absorbs red and reflects the other colors"],"ans":0,"hint":"The answer is \"It reflects red and absorbs the other colors\". We see the color that is reflected."},{"type":"apply","q":"In class, Mr. Park shines light through a prism and a rainbow appears on the wall. What does this show?","options":["The prism is full of paint","Light is made of different colors","Light is only white"],"ans":1,"hint":"The answer is \"Light is made of different colors\". Light is made of different colors."},{"type":"apply","q":"On a sunny day, Sam wears a black shirt and Ava wears a white shirt. Whose shirt absorbs more light?","options":["Neither shirt absorbs any light","Ava's white shirt","Sam's black shirt"],"ans":2,"hint":"The answer is \"Sam's black shirt\". Black takes in almost all colors of light; white reflects them."},{"type":"apply","q":"A strawberry absorbs the blue and green light that hits it. Which color does it reflect to your eyes?","options":["Green","Red","Blue"],"ans":1,"hint":"The answer is \"Red\". The color we see is the color reflected."},{"type":"apply","q":"A paper towel soaks up spilled milk. Which science word means this kind of 'taking in'?","options":["Refract","Absorb","Reflect"],"ans":1,"hint":"The answer is \"Absorb\". Absorb means to take in."}],"transparent":[{"type":"know","q":"What does \"transparent\" mean?","options":["Blocks all light","Lets some light through, looks blurry","Lets light through so you see clearly"],"ans":2,"hint":"The answer is \"Lets light through so you see clearly\". Transparent things let light pass through and you can see clearly through them."},{"type":"know","q":"Which statement is true?","options":["Transparent means the same as opaque","Transparent things block all light","A clear glass window lets sunlight in"],"ans":2,"hint":"The answer is \"A clear glass window lets sunlight in\". Clear glass is transparent, so light passes through it."},{"type":"know","q":"Fill in the blank: A transparent material lets light ____, and you can see clearly through it.","options":["stop inside it","pass through","stay out"],"ans":1,"hint":"The answer is \"pass through\". Light passes through transparent materials."},{"type":"know","q":"What is the word for a material you can see clearly through?","options":["Translucent","Opaque","Transparent"],"ans":2,"hint":"The answer is \"Transparent\". Transparent materials let light through so things look clear."},{"type":"know","q":"Which kind of material lets the MOST light pass through?","options":["Opaque","Translucent","Transparent"],"ans":2,"hint":"The answer is \"Transparent\". Transparent lets light through, translucent lets only some, and opaque lets none."},{"type":"example","q":"Which is an example of a transparent material?","options":["Air","Brick","Wax paper"],"ans":0,"hint":"The answer is \"Air\". You can see clearly through air, so it is transparent."},{"type":"example","q":"Which is NOT transparent?","options":["A wood board","Plastic wrap","Air"],"ans":0,"hint":"The answer is \"A wood board\". Wood blocks light, so it is opaque, not transparent."},{"type":"example","q":"Which group is ALL transparent?","options":["Clear glass, air, plastic wrap","Wax
