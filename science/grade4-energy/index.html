 paper, frosted paper, air","Metal, brick, clear glass"],"ans":0,"hint":"The answer is \"Clear glass, air, plastic wrap\". Clear glass, air, and plastic wrap all let light through clearly."},{"type":"example","q":"Which item belongs with clear glass and air?","options":["A metal spoon","Plastic wrap","Frosted paper"],"ans":1,"hint":"The answer is \"Plastic wrap\". Plastic wrap is transparent, just like clear glass and air."},{"type":"example","q":"Which kitchen item is transparent?","options":["A wooden spoon","A metal pot","A clear drinking glass"],"ans":2,"hint":"The answer is \"A clear drinking glass\". You can see clearly through a clear glass."},{"type":"apply","q":"Mia wants to cover leftovers and still see the food clearly. What should she use?","options":["Wax paper","Plastic wrap","Aluminum foil"],"ans":1,"hint":"The answer is \"Plastic wrap\". Plastic wrap is transparent, so you can see clearly through it."},{"type":"apply","q":"Sam shines a flashlight at a clear glass window. What happens to the light?","options":["It passes through the glass","It turns into sound","It is all blocked"],"ans":0,"hint":"The answer is \"It passes through the glass\". Clear glass is transparent, so light passes through."},{"type":"apply","q":"A pet store wants a fish tank so people can see the fish clearly. What is the best material?","options":["Metal","Clear glass","Frosted paper"],"ans":1,"hint":"The answer is \"Clear glass\". Clear glass is transparent, so you can see the fish clearly."},{"type":"apply","q":"At a science fair, Leo holds plastic wrap, wax paper, and a wood block in front of a lamp. Through which can he see the lamp clearly?","options":["The wood block","Plastic wrap","Wax paper"],"ans":1,"hint":"The answer is \"Plastic wrap\". Plastic wrap is transparent; wax paper is blurry and wood blocks light."},{"type":"apply","q":"Why can you see the playground through the classroom window?","options":["Clear glass lets light pass through","Glass blocks all light","Glass makes its own light"],"ans":0,"hint":"The answer is \"Clear glass lets light pass through\". Clear glass is transparent, so light passes through it."}],"translucent":[{"type":"know","q":"What does \"translucent\" mean?","options":["Lets light through; things look clear","Blocks all light","Lets some light through; things look blurry"],"ans":2,"hint":"The answer is \"Lets some light through; things look blurry\". Translucent things let some light through, so things behind look blurry."},{"type":"know","q":"What is the word for a material that lets some light through but makes things look blurry?","options":["Translucent","Transparent","Opaque"],"ans":0,"hint":"The answer is \"Translucent\". Translucent means some light passes through and things look blurry."},{"type":"know","q":"Fill in the blank: A translucent material lets ____ light pass through.","options":["some","no","all"],"ans":0,"hint":"The answer is \"some\". Translucent materials let only some light through."},{"type":"know","q":"Which statement is true?","options":["Translucent lets less light through than transparent","Translucent blocks more light than opaque","Translucent means the same as opaque"],"ans":0,"hint":"The answer is \"Translucent lets less light through than transparent\". Transparent lets light through, translucent only some, opaque none."},{"type":"know","q":"You look at a friend through a translucent sheet. What do you see?","options":["A sharp, clear face","A blurry shape","Total darkness"],"ans":1,"hint":"The answer is \"A blurry shape\". Translucent materials make things on the other side look blurry."},{"type":"example","q":"Which is an example of a translucent material?","options":["Wax paper","Clear glass","Brick"],"ans":0,"hint":"The answer is \"Wax paper\". Wax paper lets some light through and makes things look blurry."},{"type":"example","q":"Which is NOT translucent?","options":["Wax paper","A metal pan","Frosted paper"],"ans":1,"hint":"The answer is \"A metal pan\". Metal blocks all light, so it is opaque."},{"type":"example","q":"Which group is ALL translucent?","options":["Wax paper, frosted paper","Wood, brick","Air, plastic wrap"],"ans":0,"hint":"The answer is \"Wax paper, frosted paper\". Wax paper and frosted paper let some light through and look blurry."},{"type":"example","q":"Which item belongs with wax paper?","options":["Clear glass","A metal plate","Frosted paper"],"ans":2,"hint":"The answer is \"Frosted paper\". Frosted paper is translucent, like wax paper."},{"type":"example","q":"Which bathroom window is translucent?","options":["A wooden shutter","A clear glass window","A frosted glass window"],"ans":2,"hint":"The answer is \"A frosted glass window\". Frosted glass lets some light in but things look blurry."},{"type":"apply","q":"Ava wants a lamp shade that lets some light out but hides the shape of the bulb. Which is best?","options":["Clear plastic wrap","A metal sheet","Frosted paper"],"ans":2,"hint":"The answer is \"Frosted paper\". Frosted paper is translucent, so some light gets through but the bulb looks blurry."},{"type":"apply","q":"Ben tapes wax paper over a flashlight and shines it at the wall. What does he see?","options":["Light just as bright as before","A dimmer glow on the wall","No light at all"],"ans":1,"hint":"The answer is \"A dimmer glow on the wall\". Wax paper is translucent, so only some light gets through."},{"type":"apply","q":"At a science fair, Zoe looks at a toy through clear glass, wax paper, and a wood block. Which makes the toy look blurry?","options":["Clear glass","The wood block","Wax paper"],"ans":2,"hint":"The answer is \"Wax paper\". Wax paper is translucent, so things behind it look blurry."},{"type":"apply","q":"Kai covers a window with frosted paper. What happens in the room?","options":["The room gets brighter","Some light still comes in","The room goes totally dark"],"ans":1,"hint":"The answer is \"Some light still comes in\". Frosted paper is translucent, so it lets some light through."},{"type":"apply","q":"Why does a toy look fuzzy behind wax paper?","options":["Wax paper makes its own light","Only some light gets through","No light gets through"],"ans":1,"hint":"The answer is \"Only some light gets through\". Translucent wax paper lets some light through, so things look blurry."}],"opaque":[{"type":"know","q":"What does \"opaque\" mean?","options":["Blocks all light","Lets light through clearly","Lets some light through"],"ans":0,"hint":"The answer is \"Blocks all light\". Opaque materials block light completely."},{"type":"know","q":"What is the word for a material that no light can pass through?","options":["Transparent","Translucent","Opaque"],"ans":2,"hint":"The answer is \"Opaque\". Opaque materials let no light pass through."},{"type":"know","q":"Fill in the blank: An opaque material ____ light completely.","options":["makes","blocks","lets through"],"ans":1,"hint":"The answer is \"blocks\". Opaque materials block light completely."},{"type":"know","q":"Which statement is true about opaque materials?","options":["You cannot see what is behind them","You can see clearly through them","They make things look a little blurry"],"ans":0,"hint":"The answer is \"You cannot see what is behind them\". No light passes through opaque things, so you cannot see behind them."},{"type":"know","q":"Which kind of material lets the LEAST light pass through?","options":["Opaque","Translucent","Transparent"],"ans":0,"hint":"The answer is \"Opaque\". Opaque materials let no light through at all."},{"type":"example","q":"Which is an example of an opaque material?","options":["Air","Brick","Wax paper"],"ans":1,"hint":"The answer is \"Brick\". Brick blocks all light, so it is opaque."},{"type":"example","q":"Which is NOT opaque?","options":["Wood","Plastic wrap","Metal"],"ans":1,"hint":"The answer is \"Plastic wrap\". Plastic wrap is transparent; light passes through it."},{"type":"example","q":"Which group is ALL opaque?","options":["Wax paper, metal, brick","Wood, metal, brick","Air, clear glass, wood"],"ans":1,"hint":"The answer is \"Wood, metal, brick\". Wood, metal, and brick all block light completely."},{"type":"example","q":"Which item belongs with wood and metal?","options":["Clear glass","Frosted paper","Brick"],"ans":2,"hint":"The answer is \"Brick\". Brick is opaque, like wood and metal."},{"type":"example","q":"Which thing on the playground is opaque?","options":["A metal slide","The air around it","A clear plastic window"],"ans":0,"hint":"The answer is \"A metal slide\". Metal blocks all light, so a metal slide is opaque."},{"type":"apply","q":"Lily wants to block ALL the sunlight from her window so she can nap. What should she use?","options":["Plastic wrap","Wax paper","A wooden board"],"ans":2,"hint":"The answer is \"A wooden board\". Wood is opaque, so it blocks all light."},{"type":"apply","q":"Max shines a flashlight at a brick wall. What happens to the light?","options":["No light passes through","It passes through clearly","Some blurry light passes through"],"ans":0,"hint":"The answer is \"No light passes through\". Brick is opaque, so it blocks light completely."},{"type":"apply","q":"At a science fair, which item makes the darkest shadow under a lamp?","options":["A sheet of wax paper","A metal plate","A clear plastic sheet"],"ans":1,"hint":"The answer is \"A metal plate\". A metal plate is opaque and blocks all the light."},{"type":"apply","q":"Why can't you see your friend behind a closed wooden door?","options":["Wood makes its own light","Wood lets all light through","Wood blocks all light"],"ans":2,"hint":"The answer is \"Wood blocks all light\". Wood is opaque, so no light passes through it."},{"type":"apply","q":"You want to hide a surprise gift so nobody can see it. Which container should you use?","options":["A clear glass jar","A wax paper bag","A metal tin"],"ans":2,"hint":"The answer is \"A metal tin\". Metal is opaque, so no one can see what is inside."}],"heatconduct":[{"type":"know","q":"Which way does heat travel?","options":["From cooler objects to warmer objects","It never moves","From warmer objects to cooler objects"],"ans":2,"hint":"The answer is \"From warmer objects to cooler objects\". Heat always flows from warmer to cooler."},{"type":"know","q":"What is a good conductor of heat?","options":["A material that stops heat","A material that makes light","A material that lets heat pass through easily"],"ans":2,"hint":"The answer is \"A material that lets heat pass through easily\". Good conductors of heat let heat pass through easily."},{"type":"know","q":"Heat is another name for which kind of energy?","options":["Sound energy","Thermal energy","Electrical energy"],"ans":1,"hint":"The answer is \"Thermal energy\". Heat is thermal energy."},{"type":"know","q":"Which statement is true?","options":["Plastic is a good conductor of heat","Wood is a good conductor of heat","Metals are good conductors of heat"],"ans":2,"hint":"The answer is \"Metals are good conductors of heat\". Metals let heat pass through easily; wood and plastic do not."},{"type":"know","q":"What do we call a material that does NOT let heat pass through easily?","options":["A good conductor of heat","A bad conductor of heat","A heat source"],"ans":1,"hint":"The answer is \"A bad conductor of heat\". Bad conductors of heat, like wood and plastic, do not let heat pass easily."},{"type":"example","q":"Which is a good conductor of heat?","options":["A metal spoon","A wooden spoon","A plastic spoon"],"ans":0,"hint":"The answer is \"A metal spoon\". Metal is a good conductor of heat."},{"type":"example","q":"Which is a bad conductor of heat?","options":["A wooden spoon","A metal pot","An iron pan"],"ans":0,"hint":"The answer is \"A wooden spoon\". Wood does not let heat pass through easily."},{"type":"example","q":"Which group is ALL good conductors of heat?","options":["Wood, plastic, iron","Iron, copper, steel","Plastic, wood, copper"],"ans":1,"hint":"The answer is \"Iron, copper, steel\". Iron, copper, and steel are all metals, and metals conduct heat well."},{"type":"example","q":"Which item belongs with a wooden spoon as a bad conductor of heat?","options":["A plastic spatula","A steel pot","A metal ladle"],"ans":0,"hint":"The answer is \"A plastic spatula\". Plastic, like wood, is a bad conductor of heat."},{"type":"example","q":"Which part of a cooking pot is made to be a bad conductor of heat?","options":["The metal bottom","The metal sides","The plastic handle"],"ans":2,"hint":"The answer is \"The plastic handle\". Plastic is a bad conductor, so the handle stays cooler to touch."},{"type":"apply","q":"You hold an ice cube in your warm hand. Which way does the heat move?","options":["From the ice to your hand","From your hand to the ice","It does not move"],"ans":1,"hint":"The answer is \"From your hand to the ice\". Heat flows from the warmer hand to the cooler ice."},{"type":"apply","q":"Why does a metal spoon in hot soup get hot quickly?","options":["Metal makes its own heat","Metal is a good conductor of heat","Metal is a bad conductor of heat"],"ans":1,"hint":"The answer is \"Metal is a good conductor of heat\". Metal lets heat pass through easily from the soup."},{"type":"apply","q":"You touch a metal slide on a cold morning. Why does it feel cold?","options":["Cold moves from the metal into your hand","The slide makes cold energy","Heat moves from your hand into the metal"],"ans":2,"hint":"The answer is \"Heat moves from your hand into the metal\". Heat flows from warmer to cooler, and metal carries it away fast."},{"type":"apply","q":"A cup of hot cocoa sits on the table. What happens over time?","options":["It cools as heat moves into the cooler air","It gets hotter from the air","Cold moves into the cocoa"],"ans":0,"hint":"The answer is \"It cools as heat moves into the cooler air\". Heat flows from the warmer cocoa to the cooler air."},{"type":"apply","q":"In class, Kim puts a metal, a wooden, and a plastic spoon in hot water. Which handle gets warm first?","options":["The metal spoon","The wooden spoon","The plastic spoon"],"ans":0,"hint":"The answer is \"The metal spoon\". Metal is a good conductor of heat; wood and plastic are not."}],"vibration":[{"type":"know","q":"What causes sound?","options":["Matter vibrating","Light bending","Heat flowing"],"ans":0,"hint":"The answer is \"Matter vibrating\". Sound happens when matter vibrates."},{"type":"know","q":"What does \"vibrate\" mean?","options":["Stay perfectly still","Move quickly back and forth","Glow brightly"],"ans":1,"hint":"The answer is \"Move quickly back and forth\". To vibrate is to move quickly back and forth."},{"type":"know","q":"Fill in the blank: Sound travels in ____.","options":["puddles","waves","sparks"],"ans":1,"hint":"The answer is \"waves\". Sound travels in waves."},{"type":"know","q":"Which statement is true about air particles when sound travels?","options":["They vibrate in place and bump their neighbors","They fly all the way to your ear","They stay totally still"],"ans":0,"hint":"The answer is \"They vibrate in place and bump their neighbors\". Particles pass the energy along; they do not travel with the wave."},{"type":"know","q":"What is the word for moving quickly back and forth?","options":["Reflecting","Conducting","Vibrating"],"ans":2,"hint":"The answer is \"Vibrating\". Vibrating means moving quickly back and forth."},{"type":"example","q":"Which is an example of something vibrating to make sound?","options":["A shadow on the wall","A rock sitting still","A plucked guitar string"],"ans":2,"hint":"The answer is \"A plucked guitar string\". A plucked guitar string moves back and forth, making sound."},{"type":"example","q":"Which is NOT an example of vibrating to make sound?","options":["A book resting on a desk","A ringing bell","A buzzing bee's wings"],"ans":0,"hint":"The answer is \"A book resting on a desk\". A resting book is not moving back and forth, so it makes no sound."},{"type":"example","q":"Which group ALL vibrate when they make sound?","options":["A sunbeam, a mirror, a guitar string","Drum skin, a shadow, a rainbow","Drum skin, guitar string, vocal cords"],"ans":2,"hint":"The answer is \"Drum skin, guitar string, vocal cords\". Drum skins, strings, and vocal cords all vibrate to make sound."},{"type":"example","q":"Which belongs with a ringing bell and a beating drum?","options":["A quiet pillow","A beam of light","A twanging rubber band"],"ans":2,"hint":"The answer is \"A twanging rubber band\". A twanging rubber band vibrates and makes sound, like a bell and drum."},{"type":"example","q":"What part of your body vibrates when you talk?","options":["Your hair","Your vocal cords","Your fingernails"],"ans":1,"hint":"The answer is \"Your vocal cords\". Your vocal cords in your throat vibrate to make your voice."},{"type":"apply","q":"Jay snaps a stretched rubber band. Why does it make a sound?","options":["It vibrates back and forth","It gets cold","It gives off light"],"ans":0,"hint":"The answer is \"It vibrates back and forth\". The rubber band vibrates, and vibrating matter makes sound."},{"type":"apply","q":"You touch your throat while you hum. What do you feel?","options":["Ice-cold skin","Buzzing vibrations","Nothing moving at all"],"ans":1,"hint":"The answer is \"Buzzing vibrations\". Humming makes your vocal cords vibrate."},{"type":"apply","q":"At a science fair, rice on a drum jumps when the drum is hit. What does this show?","options":["The drum is hot","The rice is magnetic","The drum skin vibrates"],"ans":2,"hint":"The answer is \"The drum skin vibrates\". The drum skin moves quickly back and forth, making the rice bounce."},{"type":"apply","q":"After plucking a guitar string, you press it still with your finger. What happens to the sound?","options":["It stops","It turns into light","It gets louder"],"ans":0,"hint":"The answer is \"It stops\". No vibration means no sound."},{"type":"apply","q":"Ms. Park strikes a tuning fork and dips its tips in water. What happens?","options":["The water freezes","The water splashes","The water glows"],"ans":1,"hint":"The answer is \"The water splashes\". The vibrating fork shakes the water."}],"volume":[{"type":"know","q":"What is the volume of a sound?","options":["How high or low it is","How fast it travels","How loud or soft it is"],"ans":2,"hint":"The answer is \"How loud or soft it is\". Volume tells how loud or soft a sound is."},{"type":"know","q":"Fill in the blank: A louder sound has ____ energy.","options":["no","less","more"],"ans":2,"hint":"The answer is \"more\". More energy means a louder sound."},{"type":"know","q":"What is the word for how loud or soft a sound is?","options":["Volume","Pitch","Medium"],"ans":0,"hint":"The answer is \"Volume\". Volume is how loud or soft a sound is."},{"type":"know","q":"Which statement is true?","options":["Volume is a property of sound","Volume means how hot something is","Volume is a kind of light"],"ans":0,"hint":"The answer is \"Volume is a property of sound\". Volume is a property of sound."},{"type":"know","q":"Compared with a shout, a soft whisper has ____ energy.","options":["more","less","the same"],"ans":1,"hint":"The answer is \"less\". Softer sounds have less energy."},{"type":"example","q":"Which sound has the highest volume?","options":["A ticking watch","A fire truck siren","A whisper"],"ans":1,"hint":"The answer is \"A fire truck siren\". A siren is very loud, so it has high volume."},{"type":"example","q":"Which sound is the softest?","options":["A pencil writing on paper","A cheering crowd","A jet engine"],"ans":0,"hint":"The answer is \"A pencil writing on paper\". A pencil on paper is a very soft sound."},{"type":"example","q":"Which list goes from softest to loudest?","options":["Shouting, whisper, talking","Whisper, talking, shouting","Talking, shouting, whisper"],"ans":1,"hint":"The answer is \"Whisper, talking, shouting\". A whisper is softest and a shout is loudest."},{"type":"example","q":"Which is an example of using a LOW volume?","options":["Yelling on the playground","Banging a drum hard","Whispering in the library"],"ans":2,"hint":"The answer is \"Whispering in the library\". Whispering is a soft sound with low volume."},{"type":"example","q":"Which belongs with a shout and a siren as a LOUD sound?","options":["A thunder clap","A soft hum","A whisper"],"ans":0,"hint":"The answer is \"A thunder clap\". Thunder is very loud, like a shout or a siren."},{"type":"apply","q":"Nora taps a drum gently, then hits it hard. How does the second sound compare?","options":["It is softer","It is louder","It is silent"],"ans":1,"hint":"The answer is \"It is louder\". Hitting harder gives the sound more energy, so it is louder."},{"type":"apply","q":"Why does hitting a drum harder make a louder sound?","options":["The drum gets colder","The sound gets less energy","The sound gets more energy"],"ans":2,"hint":"The answer is \"The sound gets more energy\". More energy means a louder sound."},{"type":"apply","q":"Your baby brother is sleeping. What should you do with the TV?","options":["Make the screen brighter","Turn the volume up","Turn the volume down"],"ans":2,"hint":"The answer is \"Turn the volume down\". Turning the volume down makes the sound softer."},{"type":"apply","q":"Pia plucks a guitar string very gently. How can she make the sound louder?","options":["Pluck it more gently","Pluck it harder","Hold the string still"],"ans":1,"hint":"The answer is \"Pluck it harder\". Plucking harder gives the sound more energy, so it is louder."},{"type":"apply","q":"At a science fair, Eli drops the same ball onto a table from low and from high. Which drop is louder?","options":["The high drop","They are always silent","The low drop"],"ans":0,"hint":"The answer is \"The high drop\". The high drop hits with more energy, so the sound is louder."}],"medium":[{"type":"know","q":"What is a medium?","options":["A kind of loud sound","A type of light","A material sound travels through"],"ans":2,"hint":"The answer is \"A material sound travels through\". A medium is a material that sound waves travel through."},{"type":"know","q":"Sound travels FASTEST through which?","options":["Gases","Solids","Liquids"],"ans":1,"hint":"The answer is \"Solids\". Particles in solids are packed most closely, so sound is fastest."},{"type":"know","q":"Sound travels SLOWEST through which?","options":["Liquids","Gases","Solids"],"ans":1,"hint":"The answer is \"Gases\". Gas particles are spread out, so sound is slowest in gases."},{"type":"know","q":"Can sound travel through empty space?","options":["Yes, faster than in air","No, there is no medium","Yes, but only at night"],"ans":1,"hint":"The answer is \"No, there is no medium\". With no medium, there is no sound."},{"type":"know","q":"Fill in the blank: Sound travels fastest in solids because the particles are ____.","options":["spread far apart","not there at all","packed more closely"],"ans":2,"hint":"The answer is \"packed more closely\". Closely packed particles pass the sound along faster."},{"type":"example","q":"Which is a LIQUID medium for sound?","options":["Air","Wood","Water"],"ans":2,"hint":"The answer is \"Water\". Water is a liquid, and sound can travel through it."},{"type":"example","q":"Which is a SOLID medium for sound?","options":["A wooden table","Pool water","Air"],"ans":0,"hint":"The answer is \"A wooden table\". A wooden table is a solid that sound can travel through."},{"type":"example","q":"Which is NOT a medium that sound can travel through?","options":["Water","Steel","Empty space"],"ans":2,"hint":"The answer is \"Empty space\". Empty space has no matter, so sound cannot travel through it."},{"type":"example","q":"Which list goes from SLOWEST to FASTEST for sound?","options":["Air, water, steel","Steel, water, air","Water, air, steel"],"ans":0,"hint":"The answer is \"Air, water, steel\". Sound is slowest in gas, faster in liquid, fastest in solid."},{"type":"example","q":"Which group has a gas, a liquid, AND a solid medium?","options":["Air, water, wood","Water, milk, juice","Wood, metal, brick"],"ans":0,"hint":"The answer is \"Air, water, wood\". Air is a gas, water is a liquid, and wood is a solid."},{"type":"apply","q":"Astronauts on the Moon need radios to talk. Why can't they hear each other's voices?","options":["There is no air to carry sound","Their voices are too loud","Sound only works on weekends"],"ans":0,"hint":"The answer is \"There is no air to carry sound\". Without a medium like air, there is no sound."},{"type":"apply","q":"You put your ear on a desk while a friend taps the far end. Compared with through the air, the sound travels...","options":["faster through the desk","not at all through the desk","slower through the desk"],"ans":0,"hint":"The answer is \"faster through the desk\". Sound travels faster through solids than through gases."},{"type":"apply","q":"At the swimming pool, does sound travel faster through the pool water or the air?","options":["The air","The pool water","Same speed in both"],"ans":1,"hint":"The answer is \"The pool water\". Sound travels faster through liquids than through gases."},{"type":"apply","q":"Two cups are joined by a tight string to make a toy phone. What carries the sound between the cups?","options":["Heat from your hand","The tight string","Light in the cups"],"ans":1,"hint":"The answer is \"The tight string\". The string is a solid medium that carries the sound."},{"type":"apply","q":"A bell rings inside a jar. Then all the air is pumped out. What happens to the sound?","options":["It gets faster","It gets louder","It fades away"],"ans":2,"hint":"The answer is \"It fades away\". With no air as a medium, the sound cannot travel."}],"conductor":[{"type":"know","q":"What is an electrical conductor?","options":["A material that makes sound","A material that blocks electrical energy","A material that lets electrical energy pass easily"],"ans":2,"hint":"The answer is \"A material that lets electrical energy pass easily\". Conductors let electrical energy pass through easily."},{"type":"know","q":"Which statement is true?","options":["Water is a strong conductor of electricity","Graphite blocks electricity","Water blocks electricity"],"ans":0,"hint":"The answer is \"Water is a strong conductor of electricity\". Water is a strong electrical conductor."},{"type":"know","q":"Fill in the blank: Metals are ____ conductors of electricity.","options":["bad","never","good"],"ans":2,"hint":"The answer is \"good\". Metals let electricity pass through easily."},{"type":"know","q":"What is the word for a material that lets electrical energy pass through easily?","options":["Conductor","Medium","Insulator"],"ans":0,"hint":"The answer is \"Conductor\". A conductor lets electrical energy pass through easily."},{"type":"know","q":"Pencil \"lead\" conducts electricity. What is it really made of?","options":["Graphite","Glass","Rubber"],"ans":0,"hint":"The answer is \"Graphite\". Pencil lead is graphite, a good conductor."},{"type":"example","q":"Which is a good electrical conductor?","options":["A plastic ruler","A rubber band","A metal paper clip"],"ans":2,"hint":"The answer is \"A metal paper clip\". Metal is a good conductor of electricity."},{"type":"example","q":"Which is NOT a good electrical conductor?","options":["Pencil graphite","A glass marble","A metal key"],"ans":1,"hint":"The answer is \"A glass marble\". Glass is an insulator, not a conductor."},{"type":"example","q":"Which group is ALL electrical conductors?","options":["Plastic, wood, water","Rubber, glass, metal","Metal, graphite, water"],"ans":2,"hint":"The answer is \"Metal, graphite, water\". Metal, graphite, and water all let electricity pass through."},{"type":"example","q":"Which item belongs with a steel nail and aluminum foil?","options":["A metal coin","A wooden stick","A rubber eraser"],"ans":0,"hint":"The answer is \"A metal coin\". A metal coin is a conductor, like the nail and the foil."},{"type":"example","q":"Which part of an electric cord is the conductor?","options":["The rubber plug cover","The plastic coating","The metal wire inside"],"ans":2,"hint":"The answer is \"The metal wire inside\". The metal wire carries the electricity; plastic and rubber are insulators."},{"type":"apply","q":"Ana puts a metal spoon across the gap in a bulb circuit. What happens?","options":["The spoon turns to rubber","The bulb lights up","The bulb stays dark"],"ans":1,"hint":"The answer is \"The bulb lights up\". Metal is a conductor, so electricity flows to the bulb."},{"type":"apply","q":"Why should you never use a hair dryer near a filled bathtub?","options":["Water is an insulator","Water is a strong conductor","Water blocks electricity"],"ans":1,"hint":"The answer is \"Water is a strong conductor\". Water conducts electricity well, which is dangerous."},{"type":"apply","q":"At a science fair, Leo draws a thick pencil line, adds it to a circuit, and the bulb lights up. Why?","options":["Paper makes electricity","Graphite is a conductor","Graphite is an insulator"],"ans":1,"hint":"The answer is \"Graphite is a conductor\". Graphite (pencil lead) is a good conductor, so electricity flows through the line."},{"type":"apply","q":"Which item could close a broken circuit so a buzzer sounds?","options":["A wooden craft stick","A strip of aluminum foil","A rubber band"],"ans":1,"hint":"The answer is \"A strip of aluminum foil\". Aluminum foil is metal, so it conducts electricity."},{"type":"apply","q":"In a flashlight, metal strips touch the battery and the bulb. What do the strips do?","options":["Carry electricity to the bulb","Block the electricity","Turn light into sound"],"ans":0,"hint":"The answer is \"Carry electricity to the bulb\". Metal strips are conductors that let electricity flow."}],"insulator":[{"type":"know","q":"What is an electrical insulator?","options":["A material that lets charge flow easily","A device that stores chemical energy","A material that blocks electric charge"],"ans":2,"hint":"The answer is \"A material that blocks electric charge\". Insulators do not let electric charge move through them."},{"type":"know","q":"Which statement about insulators is true?","options":["They are always made of metal.","They do not let electric charge move through them.","They make electric charge move faster."],"ans":1,"hint":"The answer is \"They do not let electric charge move through them.\". Insulators stop electric charge from moving through them."},{"type":"know","q":"Fill in the blank: An insulator does not let electric ___ move through it.","options":["sound","light","charge"],"ans":2,"hint":"The answer is \"charge\". Insulators block the flow of electric charge."},{"type":"know","q":"Which word means 'a material that does not let electric charge move through it'?","options":["Insulator","Conductor","Battery"],"ans":0,"hint":"The answer is \"Insulator\". That is the meaning of insulator."},{"type":"know","q":"Which word is the opposite of an electrical insulator?","options":["Rubber","Conductor","Plastic"],"ans":1,"hint":"The answer is \"Conductor\". Conductors let charge flow; insulators do not."},{"type":"example","q":"Which material is an electrical insulator?","options":["Rubber","Copper","Aluminum foil"],"ans":0,"hint":"The answer is \"Rubber\". Rubber does not let electric charge move through it."},{"type":"example","q":"Which spoon is NOT an electrical insulator?","options":["A metal spoon","A wooden spoon","A plastic spoon"],"ans":0,"hint":"The answer is \"A metal spoon\". Metal lets charge flow, so it is not an insulator."},{"type":"example","q":"Which group has only insulators?","options":["Rubber, wood, glass","Copper, plastic, wood","Iron, glass, rubber"],"ans":0,"hint":"The answer is \"Rubber, wood, glass\". Rubber, wood, and glass all block electric charge."},{"type":"example","q":"Which item belongs in the insulator pile?","options":["A steel nail","A copper penny","A glass marble"],"ans":2,"hint":"The answer is \"A glass marble\". Glass is an insulator; metals are conductors."},{"type":"example","q":"Which one does NOT belong with plastic, wood, and glass?","options":["A rubber band","A steel paper clip","A plastic ruler"],"ans":1,"hint":"The answer is \"A steel paper clip\". Steel is a metal that lets charge flow."},{"type":"apply","q":"Electricians wear gloves to stay safe from electricity. What should the gloves be made of?","options":["Metal mesh","Rubber","Aluminum foil"],"ans":1,"hint":"The answer is \"Rubber\". Rubber is an insulator, so charge cannot reach the hand."},{"type":"apply","q":"Why do lamp cords have a plastic coating on the outside?","options":["To make charge move faster","To store the electricity","To block charge so it is safe to touch"],"ans":2,"hint":"The answer is \"To block charge so it is safe to touch\". Plastic is an insulator that keeps the charge inside."},{"type":"apply","q":"Maya puts a wooden stick into a gap in her circuit. What happens to the bulb?","options":["It glows brightly","It changes color","It stays off"],"ans":2,"hint":"The answer is \"It stays off\". Wood is an insulator, so energy cannot flow across the gap."},{"type":"apply","q":"Sam tests a glass rod, a rubber eraser, and a plastic straw in a circuit. None of them light the bulb. What are they?","options":["Conductors","Insulators","Batteries"],"ans":1,"hint":"The answer is \"Insulators\". They all block electric charge, so they are insulators."},{"type":"apply","q":"Which tool should a worker use to fix a power line?","options":["A tool with rubber handles","A tool with bare metal handles","A tool wrapped in a wet cloth"],"ans":0,"hint":"The answer is \"A tool with rubber handles\". Rubber is an insulator; metal and water let charge flow."}],"circuit":[{"type":"know","q":"What is an electrical circuit?","options":["A type of battery","A kind of insulator","A complete path for electrical energy"],"ans":2,"hint":"The answer is \"A complete path for electrical energy\". A circuit is a complete path through which electrical energy can flow."},{"type":"know","q":"Which statement about circuits is true?","options":["A circuit works best with a gap in it.","A circuit needs no energy source.","Electrical energy flows through a complete path."],"ans":2,"hint":"The answer is \"Electrical energy flows through a complete path.\". Energy can only flow when the path is complete."},{"type":"know","q":"Fill in the blank: A circuit is a complete ___ through which electrical energy can flow.","options":["battery","path","sound"],"ans":1,"hint":"The answer is \"path\". A circuit is a complete path."},{"type":"know","q":"Which word means 'a complete path through which electrical energy can flow'?","options":["Insulator","Switch","Circuit"],"ans":2,"hint":"The answer is \"Circuit\". That is the meaning of circuit."},{"type":"know","q":"What kind of energy flows through the wires of a circuit?","options":["Electrical energy","Sound energy","Wind energy"],"ans":0,"hint":"The answer is \"Electrical energy\". Circuits carry electrical energy."},{"type":"example","q":"Which is an example of a complete circuit?","options":["Battery, wires, and bulb connected in a loop","A bulb sitting alone on a desk","A battery lying in a drawer"],"ans":0,"hint":"The answer is \"Battery, wires, and bulb connected in a loop\". The parts are joined in a full loop, so energy can flow."},{"type":"example","q":"Which set of parts could make a simple circuit that lights a bulb?","options":["Battery, wires, bulb","Rubber band, bulb, paper","Wood stick, glass, string"],"ans":0,"hint":"The answer is \"Battery, wires, bulb\". A battery, wires, and a bulb can make a complete path."},{"type":"example","q":"Which object has a circuit inside it?","options":["A wooden spoon","A rubber ball","A flashlight"],"ans":2,"hint":"The answer is \"A flashlight\". A flashlight has a battery, wires, a switch, and a bulb."},{"type":"example","q":"Which is NOT a part of a simple circuit?","options":["A pencil eraser","A wire","A battery"],"ans":0,"hint":"The answer is \"A pencil eraser\". Wires and batteries are circuit parts; an eraser is not."},{"type":"example","q":"Leo wants to connect a battery to a bulb to make a circuit. What should he use for the path?","options":["Cotton yarn","Copper wire","A plastic straw"],"ans":1,"hint":"The answer is \"Copper wire\". Copper is metal, so it can complete the path."},{"type":"apply","q":"Liam connects a battery to a bulb with only one wire. The bulb stays dark. Why?","options":["The battery has too much energy","The path is not complete","The bulb is too bright"],"ans":1,"hint":"The answer is \"The path is not complete\". Energy needs a complete loop to flow."},{"type":"apply","q":"Mia builds a circuit with a battery, wires, and a bulb. When it works, what does the bulb give off?","options":["Sound","Light","Wind"],"ans":1,"hint":"The answer is \"Light\". A bulb changes electrical energy into light."},{"type":"apply","q":"Why must the parts inside a flashlight be connected in a loop?","options":["So energy has a complete path","So it stays cold","So it makes no light"],"ans":0,"hint":"The answer is \"So energy has a complete path\". Electrical energy flows only through a complete path."},{"type":"apply","q":"At the science fair, Ava's circuit lights a bulb. She removes one wire. What will happen?","options":["The bulb gets brighter","The bulb changes color","The bulb goes out"],"ans":2,"hint":"The answer is \"The bulb goes out\". Removing a wire breaks the path, so energy stops."},{"type":"apply","q":"Ben is building a circuit. What should he use to connect the parts?","options":["Cotton string","Metal wire","A rubber band"],"ans":1,"hint":"The answer is \"Metal wire\". Metal wire carries electrical energy."}],"closed":[{"type":"know","q":"What is a closed circuit?","options":["A complete path that lets energy flow","A broken path that stops energy","A battery with no wires"],"ans":0,"hint":"The answer is \"A complete path that lets energy flow\". A closed circuit is a complete path."},{"type":"know","q":"In a closed circuit with a bulb, what happens to the light?","options":["It turns off","It melts","It turns on"],"ans":2,"hint":"The answer is \"It turns on\". Energy flows in a closed circuit, so the light turns on."},{"type":"know","q":"Fill in the blank: A closed circuit is a ___ path that allows electrical energy to flow.","options":["broken","complete","plastic"],"ans":1,"hint":"The answer is \"complete\". Closed means the path is complete."},{"type":"know","q":"Which term means 'a complete path that allows electrical energy to flow'?","options":["Closed circuit","Open circuit","Insulator"],"ans":0,"hint":"The answer is \"Closed circuit\". A closed circuit has no gaps."},{"type":"know","q":"Which statement about a closed circuit is true?","options":["Energy can flow all the way around.","There is a gap in the path.","Energy cannot flow at all."],"ans":0,"hint":"The answer is \"Energy can flow all the way around.\". With no gaps, energy flows all the way around."},{"type":"example","q":"Which is an example of a closed circuit?","options":["A flashlight that is shining","A flashlight with no battery","A lamp that is unplugged"],"ans":0,"hint":"The answer is \"A flashlight that is shining\". The flashlight is shining, so its path is complete."},{"type":"example","q":"Which is NOT a closed circuit?","options":["A ringing doorbell","A glowing night-light","A lamp with a cut wire"],"ans":2,"hint":"The answer is \"A lamp with a cut wire\". A cut wire breaks the path."},{"type":"example","q":"Which shows a closed circuit?","options":["A toaster unplugged on the counter","A TV that is on and playing","A radio with no batteries"],"ans":1,"hint":"The answer is \"A TV that is on and playing\". The TV is working, so energy is flowing."},{"type":"example","q":"Which group are all closed circuits?","options":["Lit lamp, unplugged fan, playing radio","Flashlight with no battery, lit lamp, spinning fan","Lit lamp, spinning fan, playing radio"],"ans":2,"hint":"The answer is \"Lit lamp, spinning fan, playing radio\". Each one is working, so each path is complete."},{"type":"example","q":"Which one belongs with 'closed circuit'?","options":["The path has a gap","The light turns on","The battery is taken out"],"ans":1,"hint":"The answer is \"The light turns on\". In a closed circuit, the light turns on."},{"type":"apply","q":"Zoe flips her bedroom light switch and the light comes on. What kind of circuit is it now?","options":["Open circuit","Broken circuit","Closed circuit"],"ans":2,"hint":"The answer is \"Closed circuit\". The light is on, so the path is complete."},{"type":"apply","q":"Jake hooks up a battery, wires, and a bulb, and the bulb glows. Why?","options":["The wire is made of rubber","The path is complete","The battery is empty"],"ans":1,"hint":"The answer is \"The path is complete\". A complete path lets electrical energy flow."},{"type":"apply","q":"A fan is spinning in the classroom. What is true about its circuit?","options":["The path is broken","Electrical energy is flowing","There is a gap in the wire"],"ans":1,"hint":"The answer is \"Electrical energy is flowing\". The fan works because the circuit is closed."},{"type":"apply","q":"Ella's circuit has a gap. She fills the gap with a metal paper clip. What will happen?","options":["The bulb stays dark","The battery breaks","The bulb lights up"],"ans":2,"hint":"The answer is \"The bulb lights up\". The metal clip completes the path."},{"type":"apply","q":"Kai wants his toy car's motor to run. What kind of circuit does he need?","options":["A closed circuit","An open circuit","A circuit with a gap"],"ans":0,"hint":"The answer is \"A closed circuit\". Energy flows only in a closed circuit."}],"open":[{"type":"know","q":"What is an open circuit?","options":["A complete path that lets energy flow","A broken path that stops energy flow","A battery full of energy"],"ans":1,"hint":"The answer is \"A broken path that stops energy flow\". An open circuit has a break in the path."},{"type":"know","q":"What does an open circuit do to electrical energy?","options":["Makes it flow faster","Stops it from flowing","Turns it into water"],"ans":1,"hint":"The answer is \"Stops it from flowing\". A broken path stops electrical energy."},{"type":"know","q":"Fill in the blank: An open circuit is a broken or ___ path.","options":["incomplete","complete","shiny"],"ans":0,"hint":"The answer is \"incomplete\". Open circuits are broken or incomplete."},{"type":"know","q":"Which term means 'a broken path that stops electrical energy from flowing'?","options":["Closed circuit","Conductor","Open circuit"],"ans":2,"hint":"The answer is \"Open circuit\". That is the meaning of open circuit."},{"type":"know","q":"Which statement about an open circuit is true?","options":["A bulb in it will not light.","It has no gaps.","It makes a bulb glow brightly."],"ans":0,"hint":"The answer is \"A bulb in it will not light.\". No energy flows, so the bulb stays off."},{"type":"example","q":"Which is an example of an open circuit?","options":["A lamp with a broken wire","A shining flashlight","A spinning fan"],"ans":0,"hint":"The answer is \"A lamp with a broken wire\". The broken wire makes the path incomplete."},{"type":"example","q":"Which is NOT an open circuit?","options":["A lamp that is unplugged","A flashlight with no battery","A glowing light bulb"],"ans":2,"hint":"The answer is \"A glowing light bulb\". A glowing bulb means energy is flowing."},{"type":"example","q":"Which situation makes an open circuit?","options":["All wires are tightly connected","A wire falls off the battery","A paper clip fills the gap"],"ans":1,"hint":"The answer is \"A wire falls off the battery\". A loose wire leaves a gap in the path."},{"type":"example","q":"Which one belongs with 'open circuit'?","options":["The fan is spinning","The light is off","The radio is playing"],"ans":1,"hint":"The answer is \"The light is off\". In an open circuit, energy cannot reach the light."},{"type":"example","q":"Which group shows only open circuits?","options":["Cut wire, loose battery, switch off","Cut wire, lit lamp, switch off","Lit lamp, running fan, switch on"],"ans":0,"hint":"The answer is \"Cut wire, loose battery, switch off\". Each one has a break in the path."},{"type":"apply","q":"Noah's flashlight won't turn on. He finds a wire came loose. What kind of circuit is it?","options":["Open circuit","Closed circuit","Complete circuit"],"ans":0,"hint":"The answer is \"Open circuit\". The loose wire breaks the path."},{"type":"apply","q":"Lily puts a rubber eraser in the gap of her circuit. What will happen?","options":["The bulb lights up","The eraser glows","The bulb stays off"],"ans":2,"hint":"The answer is \"The bulb stays off\". Rubber is an insulator, so the circuit stays open."},{"type":"apply","q":"A string of lights goes dark when one wire breaks. Why?","options":["The lights got too cold","The wires turned into rubber","The path is no longer complete"],"ans":2,"hint":"The answer is \"The path is no longer complete\". A broken wire makes an open circuit."},{"type":"apply","q":"Dad unplugs the toaster. What happens to the flow of electrical energy to it?","options":["It speeds up","It stops","It turns into sound"],"ans":1,"hint":"The answer is \"It stops\". Unplugging breaks the path."},{"type":"apply","q":"Mr. Lee wants a buzzer in a class circuit to stop without breaking anything. What should he do?","options":["Add another battery","Tighten every wire","Disconnect one wire"],"ans":2,"hint":"The answer is \"Disconnect one wire\". Disconnecting a wire opens the circuit."}],"switch":[{"type":"know","q":"What is a switch?","options":["A device that stores chemical energy","A material that blocks charge","A device that opens or closes a circuit"],"ans":2,"hint":"The answer is \"A device that opens or closes a circuit\". A switch opens or closes an electrical circuit."},{"type":"know","q":"What two things can a switch do to a circuit?","options":["Open it or close it","Heat it or cool it","Paint it or clean it"],"ans":0,"hint":"The answer is \"Open it or close it\". A switch opens or closes the path."},{"type":"know","q":"Fill in the blank: A switch is a device that opens or ___ an electrical circuit.","options":["closes","charges","melts"],"ans":0,"hint":"The answer is \"closes\". A switch opens or closes a circuit."},{"type":"know","q":"Which word means 'a device that opens or closes an electrical circuit'?","options":["Wire","Switch","Battery"],"ans":1,"hint":"The answer is \"Switch\". That is the meaning of switch."},{"type":"know","q":"Which statement about switches is true?","options":["A switch stores chemical energy.","Turning a switch off opens the circuit.","A switch is a kind of battery."],"ans":1,"hint":"The answer is \"Turning a switch off opens the circuit.\". Off makes a gap, so the circuit is open."},{"type":"example","q":"Which is an example of a switch?","options":["A light switch on the wall","A light bulb","A battery"],"ans":0,"hint":"The answer is \"A light switch on the wall\". A wall light switch opens and closes the circuit."},{"type":"example","q":"Which is NOT a switch?","options":["A doorbell button","A copper wire","A flashlight on/off slider"],"ans":1,"hint":"The answer is \"A copper wire\". A wire carries energy; it does not open or close the circuit."},{"type":"example","q":"Which part of a flashlight is the switch?","options":["The bulb","The battery","The on/off button"],"ans":2,"hint":"The answer is \"The on/off button\". The button opens and closes the flashlight's circuit."},{"type":"example","q":"Which is an example of a switch closing a circuit?","options":["Unplugging a lamp","Flipping a lamp switch to on","Cutting a lamp wire"],"ans":1,"hint":"The answer is \"Flipping a lamp switch to on\". Turning the switch on completes the path."},{"type":"example","q":"Which is an example of a switch opening a circuit?","options":["Turning a fan switch on","Turning a fan switch off","Plugging in a fan"],"ans":1,"hint":"The answer is \"Turning a fan switch off\". Turning the switch off breaks the path."},{"type":"apply","q":"Emma flips her light switch and the light turns on. What did the switch do?","options":["Opened the circuit","Stored energy","Closed the circuit"],"ans":2,"hint":"The answer is \"Closed the circuit\". The switch completed the path so energy could flow."},{"type":"apply","q":"When you press the off button on a fan, why does it stop?","options":["The fan runs out of air","The switch adds more energy","The switch opens the circuit"],"ans":2,"hint":"The answer is \"The switch opens the circuit\". Opening the circuit stops the energy flow."},{"type":"apply","q":"Leo wants to turn his bulb on and off without unhooking wires. What should he add?","options":["A switch","A rubber band","A second bulb"],"ans":0,"hint":"The answer is \"A switch\". A switch opens and closes the circuit."},{"type":"apply","q":"At the science fair, Ana's circuit switch is in the off position. What will the bulb do?","options":["Glow brightly","Flash on and off","Stay off"],"ans":2,"hint":"The answer is \"Stay off\". Off means the circuit is open, so no energy flows."},{"type":"apply","q":"A doorbell rings only while its button is pushed. What happens when you let go?","options":["The circuit opens and it stops","The circuit closes and it rings louder","The battery recharges"],"ans":0,"hint":"The answer is \"The circuit opens and it stops\". Letting go of the button opens the circuit."}],"wire":[{"type":"know","q":"What does a wire do in a circuit?","options":["Carries electrical energy","Stores chemical energy","Blocks all energy"],"ans":0,"hint":"The answer is \"Carries electrical energy\". A wire carries electrical energy in a circuit."},{"type":"know","q":"What is a wire usually made of?","options":["Wood covered in glass","Metal covered in plastic","Rubber covered in paper"],"ans":1,"hint":"The answer is \"Metal covered in plastic\". Wires are usually metal covered in plastic."},{"type":"know","q":"Fill in the blank: A wire is a material that ___ electrical energy in a circuit.","options":["stores","stops","carries"],"ans":2,"hint":"The answer is \"carries\". Wires carry electrical energy."},{"type":"know","q":"Which word means 'a material that carries electrical energy in a circuit'?","options":["Switch","Wire","Insulator"],"ans":1,"hint":"The answer is \"Wire\". That is the meaning of wire."},{"type":"know","q":"Which statement about wires is true?","options":["The plastic outside carries the energy.","The metal inside carries the energy.","Wires make light by themselves."],"ans":1,"hint":"The answer is \"The metal inside carries the energy.\". Metal lets energy flow; the plastic is an insulator."},{"type":"example","q":"Which is an example of a wire?","options":["A rubber band","A wooden stick","A phone charger cord"],"ans":2,"hint":"The answer is \"A phone charger cord\". A charger cord is metal wire covered in plastic."},{"type":"example","q":"Which could work as a wire in a simple circuit?","options":["A strip of aluminum foil","A piece of yarn","A plastic straw"],"ans":0,"hint":"The answer is \"A strip of aluminum foil\". Foil is metal, so it can carry electrical energy."},{"type":"example","q":"Which is NOT a good material for the inside of a wire?","options":["Copper","Aluminum","Plastic"],"ans":2,"hint":"The answer is \"Plastic\". Plastic is an insulator, so it is used on the outside."},{"type":"example","q":"Which household thing has wires inside it?","options":["A toaster","A wooden chair","A glass vase"],"ans":0,"hint":"The answer is \"A toaster\". A toaster uses wires to carry electrical energy."},{"type":"example","q":"Which is NOT a wire?","options":["A rubber eraser","An extension cord","A copper strand"],"ans":0,"hint":"The answer is \"A rubber eraser\". Rubber cannot carry electrical energy."},{"type":"apply","q":"Why is the copper inside a lamp cord covered in plastic?","options":["So it is safe to touch","So it makes light","So it stores energy"],"ans":0,"hint":"The answer is \"So it is safe to touch\". The plastic is an insulator that keeps people safe."},{"type":"apply","q":"Sam sees a cord with torn plastic and metal showing. What should he do?","options":["Touch it to test it","Pour water on it","Tell an adult and not touch it"],"ans":2,"hint":"The answer is \"Tell an adult and not touch it\". Bare metal wire is unsafe; water conducts electricity too."},{"type":"apply","q":"In a flashlight, what carries energy from the battery to the bulb?","options":["The plastic case","Metal wires or strips","The glass lens"],"ans":1,"hint":"The answer is \"Metal wires or strips\". Metal carries electrical energy; plastic and glass do not."},{"type":"apply","q":"At the science fair, Ravi cuts the only wire in his circuit in half. What will happen?","options":["The bulb gets brighter","The bulb goes out","The wire turns to plastic"],"ans":1,"hint":"The answer is \"The bulb goes out\". A cut wire cannot carry energy to the bulb."},{"type":"apply","q":"Grace connects a bulb to a battery using long wires instead of short ones. Will energy still reach the bulb?","options":["No, wires only work when short","No, long wires block energy","Yes, the wires carry it"],"ans":2,"hint":"The answer is \"Yes, the wires carry it\". Wires carry electrical energy along their length."}],"battery":[{"type":"know","q":"What is a battery?","options":["Stores sound, gives light","Stores chemical energy, gives electrical energy","A material that blocks charge"],"ans":1,"hint":"The answer is \"Stores chemical energy, gives electrical energy\". A battery stores chemical energy and provides electrical energy."},{"type":"know","q":"Which statement about batteries is true?","options":["A battery is an energy source for a circuit.","A battery is an insulator.","A battery blocks energy flow."],"ans":0,"hint":"The answer is \"A battery is an energy source for a circuit.\". A battery provides electrical energy to a circuit."},{"type":"know","q":"Fill in the blank: A battery stores chemical energy and provides ___ energy.","options":["sound","electrical","wind"],"ans":1,"hint":"The answer is \"electrical\". Batteries give electrical energy."},{"type":"know","q":"Which word means 'a device that stores chemical energy and provides electrical energy'?","options":["Battery","Switch","Wire"],"ans":0,"hint":"The answer is \"Battery\". That is the meaning of battery."},{"type":"know","q":"What kind of energy is stored inside a battery?","options":["Chemical energy","Sound energy","Light energy"],"ans":0,"hint":"The answer is \"Chemical energy\". A battery stores chemical energy."},{"type":"example","q":"Which device runs on batteries?","options":["A wooden spoon","A paper book","A TV remote"],"ans":2,"hint":"The answer is \"A TV remote\". A TV remote uses batteries for energy."},{"type":"example","q":"Which is NOT a battery?","options":["An AA cell","A light bulb","A watch battery"],"ans":1,"hint":"The answer is \"A light bulb\". A light bulb uses energy; it does not store it."},{"type":"example","q":"Which group is all powered by batteries?","options":["Flashlight, TV remote, remote-control car","Flashlight, wooden block, remote-control car","Rock, TV remote, remote-control car"],"ans":0,"hint":"The answer is \"Flashlight, TV remote, remote-control car\". All three use batteries."},{"type":"example","q":"Which is an example of a battery giving energy?","options":["A lamp plugged into the wall","A candle burning","A phone working while unplugged"],"ans":2,"hint":"The answer is \"A phone working while unplugged\". The phone's battery provides electrical energy."},{"type":"example","q":"Which part of a watch is the battery?","options":["The strap","The glass cover","The small round cell inside"],"ans":2,"hint":"The answer is \"The small round cell inside\". The small cell stores chemical energy."},{"type":"apply","q":"Kim's flashlight gets dim after many hours of use. Why?","options":["Its bulb got colder","Its switch turned into rubber","Its battery is running low"],"ans":2,"hint":"The answer is \"Its battery is running low\". The battery's stored chemical energy is getting used."},{"type":"apply","q":"Owen's remote-control car stops working. What should he try first?","options":["Wrap it in rubber","Put in new batteries","Paint the wheels"],"ans":1,"hint":"The answer is \"Put in new batteries\". New batteries provide energy again."},{"type":"apply","q":"A battery powers a flashlight. Which energy chain is correct?","options":["Chemical -> electrical -> light","Light -> chemical -> sound","Sound -> electrical -> chemical"],"ans":0,"hint":"The answer is \"Chemical -> electrical -> light\". The battery's chemical energy becomes electrical, then light."},{"type":"apply","q":"At the science fair, Jade builds a circuit with wires and a bulb but no battery. What will happen?","options":["The bulb glows","The bulb stays dark","The bulb flashes"],"ans":1,"hint":"The answer is \"The bulb stays dark\". Without a battery, there is no energy source."},{"type":"apply","q":"Why can a radio with batteries play music at the beach with no outlet?","options":["The sand gives it energy","The waves send it electricity","The batteries store energy it carries along"],"ans":2,"hint":"The answer is \"The batteries store energy it carries along\". Batteries store chemical energy to provide electrical energy."}],"device":[{"type":"know","q":"What is an electrical device?","options":["A material that blocks charge","A machine that changes electrical energy into another form","A path for energy to flow"],"ans":1,"hint":"The answer is \"A machine that changes electrical energy into another form\". Devices change electrical energy into other forms."},{"type":"know","q":"What kind of energy goes into a plugged-in electrical device?","options":["Electrical energy","Sound energy","Light energy"],"ans":0,"hint":"The answer is \"Electrical energy\". Devices take in electrical energy."},{"type":"know","q":"Fill in the blank: An electrical device changes electrical energy into another ___ of energy.","options":["color","battery","form"],"ans":2,"hint":"The answer is \"form\". Devices change energy into another form."},{"type":"know","q":"Which term means 'a machine that changes electrical energy into another form of energy'?","options":["Electrical device","Insulator","Open circuit"],"ans":0,"hint":"The answer is \"Electrical device\". That is the meaning of electrical device."},{"type":"know","q":"Which device-and-energy match is correct?","options":["Fan -> light","Speaker -> sound","Lamp -> sound"],"ans":1,"hint":"The answer is \"Speaker -> sound\". A speaker changes electrical energy into sound."},{"type":"example","q":"Which is an electrical device?","options":["A rubber band","A wooden chair","A toaster"],"ans":2,"hint":"The answer is \"A toaster\". A toaster changes electrical energy into heat."},{"type":"example","q":"Which is NOT an electrical device?","options":["A pencil","A fan","A lamp"],"ans":0,"hint":"The answer is \"A pencil\". A pencil does not use electrical energy."},{"type":"example","q":"Which device is used to make heat?","options":["A toaster","A speaker","A fan"],"ans":0,"hint":"The answer is \"A toaster\". A toaster changes electrical energy into heat."},{"type":"example","q":"Which device is used to make motion?","options":["A lamp","A fan","A toaster"],"ans":1,"hint":"The answer is \"A fan\". A fan changes electrical energy into motion."},{"type":"example","q":"Which group has only devices made to give light?","options":["Lamp, fan, speaker","Lamp, flashlight, night-light","Toaster, speaker, fan"],"ans":1,"hint":"The answer is \"Lamp, flashlight, night-light\". Lamps, flashlights, and night-lights all make light."},{"type":"apply","q":"Ruby plugs in a speaker to play music. What energy goes in and what comes out?","options":["Sound in, electrical out","Light in, chemical out","Electrical in, sound out"],"ans":2,"hint":"The answer is \"Electrical in, sound out\". A speaker changes electrical energy into sound."},{"type":"apply","q":"On a hot day, Max turns on a fan. What energy does the fan mainly give?","options":["Light energy","Chemical energy","Motion energy"],"ans":2,"hint":"The answer is \"Motion energy\". A fan changes electrical energy into motion."},{"type":"apply","q":"Mom makes toast. What energy goes into the toaster and what comes out?","options":["Heat in, electrical out","Sound in, chemical out","Electrical in, heat out"],"ans":2,"hint":"The answer is \"Electrical in, heat out\". A toaster changes electrical energy into heat."},{"type":"apply","q":"Ivy touches a lamp that has been on for an hour. It feels warm. Why?","options":["The lamp stores chemical energy","Some electrical energy always becomes heat","The light turned into sound"],"ans":1,"hint":"The answer is \"Some electrical energy always becomes heat\". Energy never changes completely into one form; some becomes heat."},{"type":"apply","q":"In class, Ms. Kay turns on a hair dryer and it blows warm air. Which energy forms come out?","options":["Heat and motion","Light and chemical","Only chemical"],"ans":0,"hint":"The answer is \"Heat and motion\". The dryer makes heat and moving air."}],"grid":[{"type":"know","q":"What is an electrical grid?","options":["A network of wires that moves electricity to many places","A single battery that stores energy","A machine that makes music"],"ans":0,"hint":"The answer is \"A network of wires that moves electricity to many places\". A grid is a network of wires that carries electricity to many places."},{"type":"know","q":"Which statement about the electrical grid is true?","options":["It carries electricity from power plants to many places","It only works inside one flashlight","It carries water from lakes to homes"],"ans":0,"hint":"The answer is \"It carries electricity from power plants to many places\". The grid moves electricity from power plants to homes, schools, and stores."},{"type":"know","q":"Fill in the blank: An electrical grid is a network of ___ that moves electricity.","options":["pipes","roads","wires"],"ans":2,"hint":"The answer is \"wires\". Wires carry the electricity in a grid."},{"type":"know","q":"Which term means a network of wires that transfers electricity from power plants to many places?","options":["Insulator","Blackout","Electrical grid"],"ans":2,"hint":"The answer is \"Electrical grid\". That is the meaning of electrical grid."},{"type":"know","q":"In an electrical grid, where does the electricity start out?","options":["At the TV screen","At the light switch in your room","At energy sources like power plants"],"ans":2,"hint":"The answer is \"At energy sources like power plants\". The grid carries electricity from energy sources and power plants out to many places."},{"type":"example","q":"Which of these is part of the electrical grid?","options":["Power lines along the street","A bike chain","A garden hose"],"ans":0,"hint":"The answer is \"Power lines along the street\". Power lines are the wires that carry electricity in the grid."},{"type":"example","q":"Which of these is NOT part of the electrical grid?","options":["Power lines","A rubber band","A power plant"],"ans":1,"hint":"The answer is \"A rubber band\". A rubber band does not carry or make electricity for the grid."},{"type":"example","q":"Which place gets electricity from the grid?","options":["A rock on a beach","A school building","A tree in a forest"],"ans":1,"hint":"The answer is \"A school building\". The grid sends electricity to buildings like schools."},{"type":"example","q":"Which group lists things that work together in a grid?","options":["Power plant, wires, homes","Sun, clouds, rain","Ball, bat, glove"],"ans":0,"hint":"The answer is \"Power plant, wires, homes\". A grid uses wires to carry electricity from power plants to homes."},{"type":"example","q":"Which is an example of the grid at work?","options":["A battery running a toy car","Wires carrying electricity from a power plant to a town","A kid pedaling a bike"],"ans":1,"hint":"The answer is \"Wires carrying electricity from a power plant to a town\". The grid moves electricity through wires from power plants to towns."},{"type":"apply","q":"Maya turns on a lamp plugged into the wall. How did the electricity get to her house?","options":["Through the water pipes","From the lamp's light bulb itself","Through the wires of the electrical grid"],"ans":2,"hint":"The answer is \"Through the wires of the electrical grid\". Electricity travels from the power plant to her house through grid wires."},{"type":"apply","q":"A storm knocks down the power lines on your street. What most likely happens?","options":["Nothing changes in the homes","Homes on the street lose electricity","Homes get extra electricity"],"ans":1,"hint":"The answer is \"Homes on the street lose electricity\". If grid wires break, electricity cannot reach those homes."},{"type":"apply","q":"New houses are built far from town. What must workers add so the houses get electricity from the power plant?","options":["Bigger windows","More trees in the yards","Wires that connect to the grid"],"ans":2,"hint":"The answer is \"Wires that connect to the grid\". Houses need grid wires to receive electricity from the power plant."},{"type":"apply","q":"In a class model, Sam uses yarn to connect a toy power plant to many toy houses. What does the yarn stand for?","options":["The wires of the grid","The fuel for the power plant","The roads for cars"],"ans":0,"hint":"The answer is \"The wires of the grid\". In a grid, wires connect power plants to many places."},{"type":"apply","q":"Why does a city need a big grid of wires?","options":["To make electricity disappear","To move electricity to many different places","To turn electricity into water"],"ans":1,"hint":"The answer is \"To move electricity to many different places\". A grid transfers electricity from power plants to many places."}],"elsystem":[{"type":"know","q":"What is an electrical system?","options":["One part that works all alone","Connected parts that work together to give electricity to devices","A storm that stops electricity"],"ans":1,"hint":"The answer is \"Connected parts that work together to give electricity to devices\". An electrical system is a group of connected parts working together to provide electricity."},{"type":"know","q":"Which statement about an electrical system is true?","options":["It has only one part","Its parts are connected and work together","It makes water flow"],"ans":1,"hint":"The answer is \"Its parts are connected and work together\". An electrical system is a group of connected parts that work together."},{"type":"know","q":"Fill in the blank: An electrical system is a group of connected parts that work ___ to provide electricity to devices.","options":["backward","apart","together"],"ans":2,"hint":"The answer is \"together\". The parts of an electrical system work together."},{"type":"know","q":"Which term means a group of connected parts that work together to provide electricity to devices?","options":["Electrical system","Blackout","Source"],"ans":0,"hint":"The answer is \"Electrical system\". That is the meaning of electrical system."},{"type":"know","q":"What is the job of an electrical system?","options":["To provide electricity to devices","To store food","To make sound travel"],"ans":0,"hint":"The answer is \"To provide electricity to devices\". An electrical system provides electricity to devices."},{"type":"example","q":"Which is an example of an electrical system?","options":["A glass of water","A flashlight with batteries, wires, and a bulb","A single pencil"],"ans":1,"hint":"The answer is \"A flashlight with batteries, wires, and a bulb\". A flashlight's connected parts work together to give the bulb electricity."},{"type":"example","q":"Which is a part of a house's electrical system?","options":["A soft rug","Wires inside the walls","A wooden chair"],"ans":1,"hint":"The answer is \"Wires inside the walls\". Wires in the walls connect parts that bring electricity to devices."},{"type":"example","q":"Which group of parts could make a simple electrical system?","options":["Cup, spoon, and plate","Battery, wires, and a bulb","Ball, net, and shoes"],"ans":1,"hint":"The answer is \"Battery, wires, and a bulb\". A battery, wires, and a bulb can connect and work together."},{"type":"example","q":"Which is NOT part of a car's electrical system?","options":["The wires","The battery","The rubber tires"],"ans":2,"hint":"The answer is \"The rubber tires\". Tires help the car roll but do not provide electricity."},{"type":"example","q":"Battery, switch, wire... which item belongs in this group?","options":["Sandwich","Feather","Light bulb"],"ans":2,"hint":"The answer is \"Light bulb\". A light bulb is a part that connects into an electrical system."},{"type":"apply","q":"Leo builds a circuit for the science fair, but one wire is not connected. What happens?","options":["The bulb does not light","The bulb gets brighter","The battery turns into water"],"ans":0,"hint":"The answer is \"The bulb does not light\". All the parts must be connected for the system to work."},{"type":"apply","q":"Why does a doorbell need its button, wires, and bell all connected?","options":["So it stays cold","So it looks nice","The parts work together to get electricity to the bell"],"ans":2,"hint":"The answer is \"The parts work together to get electricity to the bell\". In an electrical system, connected parts work together."},{"type":"apply","q":"Mia's toy car has a battery, wires, and a motor all connected. What is this group of parts called?","options":["An electrical system","A blackout","An energy source"],"ans":0,"hint":"The answer is \"An electrical system\". Connected parts that provide electricity to a device make an electrical system."},{"type":"apply","q":"In class, Ms. Lee takes the battery out of a working circuit. What happens to the bulb?","options":["It plays music","It shines brighter","It goes out"],"ans":2,"hint":"The answer is \"It goes out\". Without one of its parts, the system cannot give the bulb electricity."},{"type":"apply","q":"A video game console's power cord gets cut. Why does it stop working?","options":["A part of its electrical system is broken","It has too much electricity","Its screen got too clean"],"ans":0,"hint":"The answer is \"A part of its electrical system is broken\". The cord is a part of the system, so the system cannot do its job."}],"blackout":[{"type":"know","q":"What is a blackout?","options":["A time when electricity stops working in an area","A time when the sun goes down","A time when there is extra electricity"],"ans":0,"hint":"The answer is \"A time when electricity stops working in an area\". A blackout is when electricity stops working in an area."},{"type":"know","q":"Which statement about blackouts is true?","options":["Blackouts can happen only in the daytime","During a blackout, an area loses electricity","During a blackout, lights get brighter"],"ans":1,"hint":"The answer is \"During a blackout, an area loses electricity\". In a blackout, electricity stops working in an area."},{"type":"know","q":"Fill in the blank: A blackout is a time when ___ stops working in an area.","options":["water","sound","electricity"],"ans":2,"hint":"The answer is \"electricity\". A blackout is about electricity stopping."},{"type":"know","q":"Which term means a time when electricity stops working in an area?","options":["Electrical grid","Blackout","Convert"],"ans":1,"hint":"The answer is \"Blackout\". That is the meaning of blackout."},{"type":"know","q":"A blackout affects how much space?","options":["A whole area, like a street or town","Only one toy with a dead battery","Only the sun"],"ans":0,"hint":"The answer is \"A whole area, like a street or town\". A blackout is electricity stopping in an area."},{"type":"example","q":"Which is an example of a blackout?","options":["All the lights on your street go out after a storm","Your flashlight battery runs out","You turn off your bedroom lamp"],"ans":0,"hint":"The answer is \"All the lights on your street go out after a storm\". A blackout is when electricity stops working in a whole area."},{"type":"example","q":"Which is NOT a blackout?","options":["A whole town loses power","Every house on your block loses power","You switch off the TV to go to bed"],"ans":2,"hint":"The answer is \"You switch off the TV to go to bed\". Turning off one TV is your choice; a blackout is electricity stopping in an area."},{"type":"example","q":"Which would still work during a blackout?","options":["An electric oven","A flashlight with batteries","A plug-in lamp"],"ans":1,"hint":"The answer is \"A flashlight with batteries\". Batteries store their own energy, so they do not need the wall power."},{"type":"example","q":"Which would stop working during a blackout?","options":["A wind-up toy","A battery flashlight","A refrigerator plugged into the wall"],"ans":2,"hint":"The answer is \"A refrigerator plugged into the wall\". Things plugged into the wall need electricity from the grid."},{"type":"example","q":"Which list has only things that still work in a blackout?","options":["Battery flashlight, candle, battery radio","Plug-in lamp, computer, plug-in fan","TV, microwave, toaster"],"ans":0,"hint":"The answer is \"Battery flashlight, candle, battery radio\". These do not need wall electricity to work."},{"type":"apply","q":"During a storm, every light in your neighborhood goes dark at once. What is happening?","options":["A sound wave","An energy conversion","A blackout"],"ans":2,"hint":"The answer is \"A blackout\". Electricity stopped working in the whole area."},{"type":"apply","q":"During a long blackout, why does the ice cream in the freezer start to melt?","options":["The ice cream turns into wind","The freezer has no electricity","The freezer gets too much electricity"],"ans":1,"hint":"The answer is \"The freezer has no electricity\". Without electricity, the freezer cannot keep food cold."},{"type":"apply","q":"During a blackout at school, why can't the class watch a video on the smartboard?","options":["The smartboard needs electricity","The smartboard is made of wood","Videos only play at night"],"ans":0,"hint":"The answer is \"The smartboard needs electricity\". In a blackout there is no electricity for the smartboard."},{"type":"apply","q":"Grandpa keeps a battery radio for blackouts. Why?","options":["It makes electricity for the whole town","It stops storms","Its batteries give energy when the wall power is out"],"ans":2,"hint":"The answer is \"Its batteries give energy when the wall power is out\". Batteries are an energy source that works without the grid."},{"type":"apply","q":"A tree falls on the power lines that bring electricity to your town. What do you predict?","options":["The town gets brighter lights","The town may have a blackout","The town's water turns hot"],"ans":1,"hint":"The answer is \"The town may have a blackout\". If electricity cannot reach the town, it stops working there."}],"failure":[{"type":"know","q":"What is a system failure?","options":["When a system gets new parts","When a system works perfectly","When a system cannot do its job properly"],"ans":2,"hint":"The answer is \"When a system cannot do its job properly\". A system failure is when a system cannot perform its function properly."},{"type":"know","q":"Which statement about a system failure is true?","options":["The system cannot do its job well","The system works faster","It only happens to the sun"],"ans":0,"hint":"The answer is \"The system cannot do its job well\". In a system failure, the system cannot perform its job properly."},{"type":"know","q":"Fill in the blank: A system failure is when a system cannot perform its ___ properly.","options":["color","size","function"],"ans":2,"hint":"The answer is \"function\". Function means the system's job."},{"type":"know","q":"Which term means when a system cannot perform its job properly?","options":["Electrical grid","Energy source","System failure"],"ans":2,"hint":"The answer is \"System failure\". That is the meaning of system failure."},{"type":"know","q":"In the meaning of system failure, the word function means what?","options":["Color","Job","Sound"],"ans":1,"hint":"The answer is \"Job\". A system's function is its job."},{"type":"example","q":"Which is an example of a system failure?","options":["A fridge stops keeping food cold","A fridge keeps the milk cold","A lamp lights up when switched on"],"ans":0,"hint":"The answer is \"A fridge stops keeping food cold\". The fridge cannot do its job, so it is a system failure."},{"type":"example","q":"Which is NOT a system failure?","options":["A doorbell rings when pressed","A traffic light stays dark","A computer will not turn on"],"ans":0,"hint":"The answer is \"A doorbell rings when pressed\". The doorbell is doing its job properly."},{"type":"example","q":"Which is a system failure?","options":["A toaster that toasts bread","A fan that spins when switched on","A heater that blows only cold air"],"ans":2,"hint":"The answer is \"A heater that blows only cold air\". A heater's job is to warm the air, so it is failing."},{"type":"example","q":"Which list shows only system failures?","options":["Loud radio, cold fridge, spinning fan","Dead phone screen, broken fan, dark streetlight","Bright lamp, warm oven, ringing bell"],"ans":1,"hint":"The answer is \"Dead phone screen, broken fan, dark streetlight\". Each of these cannot do its job properly."},{"type":"example","q":"Which is a system failure in the electrical grid?","options":["Homes use lights at night","Power lines break and homes lose electricity","A power plant sends electricity to homes"],"ans":1,"hint":"The answer is \"Power lines break and homes lose electricity\". The grid cannot do its job of moving electricity."},{"type":"apply","q":"The class fish tank pump stops moving water, but everything else in the room still works. What is this?","options":["A system failure","An energy source","A blackout"],"ans":0,"hint":"The answer is \"A system failure\". Only the pump cannot do its job, so it is a system failure, not an area blackout."},{"type":"apply","q":"Zoe's science fair robot is supposed to roll forward, but it just sits still. What happened?","options":["It worked perfectly","Its system had a failure","It became an energy source"],"ans":1,"hint":"The answer is \"Its system had a failure\". The robot cannot do its job properly."},{"type":"apply","q":"Why is a blackout a kind of system failure?","options":["The grid cannot do its job of moving electricity","The grid turns into water","The grid makes too much light"],"ans":0,"hint":"The answer is \"The grid cannot do its job of moving electricity\". A system failure is when a system cannot perform its function."},{"type":"apply","q":"The school heater fails on a freezing day. What do you predict?","options":["The classrooms get brighter","The classrooms get colder","The classrooms get hotter"],"ans":1,"hint":"The answer is \"The classrooms get colder\". The heater cannot do its job of warming the rooms."},{"type":"apply","q":"Your bike chain breaks, and pedaling no longer turns the wheels. Is this a system failure?","options":["No, because bikes have no parts","No, the bike works better now","Yes, the bike cannot do its job"],"ans":2,"hint":"The answer is \"Yes, the bike cannot do its job\". The bike system cannot perform its function properly."}],"source":[{"type":"know","q":"What is a source?","options":["The place where something ends forever","The place where something comes from","A kind of wire"],"ans":1,"hint":"The answer is \"The place where something comes from\". A source is the place where something comes from."},{"ty
