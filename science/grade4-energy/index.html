pe":"know","q":"Which statement is true?","options":["A river's source is where its water comes from","A source is the end of something","A source is always a battery"],"ans":0,"hint":"The answer is \"A river's source is where its water comes from\". A source is where something comes from."},{"type":"know","q":"Fill in the blank: A source is the ___ where something comes from.","options":["sound","color","place"],"ans":2,"hint":"The answer is \"place\". A source is a place."},{"type":"know","q":"Which term means the place where something comes from?","options":["Source","Convert","Blackout"],"ans":0,"hint":"The answer is \"Source\". That is the meaning of source."},{"type":"know","q":"Asking for the source of something answers which question?","options":["How heavy is it?","What color is it?","Where does it come from?"],"ans":2,"hint":"The answer is \"Where does it come from?\". A source is the place where something comes from."},{"type":"example","q":"What is the source of milk?","options":["A glass","A lunch tray","A cow"],"ans":2,"hint":"The answer is \"A cow\". Milk comes from cows."},{"type":"example","q":"What is the source of apples?","options":["A fruit bowl","A lunch box","An apple tree"],"ans":2,"hint":"The answer is \"An apple tree\". Apples come from apple trees."},{"type":"example","q":"What is the source of honey?","options":["Bees","A spoon","A jar"],"ans":0,"hint":"The answer is \"Bees\". Honey comes from bees."},{"type":"example","q":"Which is NOT a source of wood?","options":["A tree","A rock","A forest"],"ans":1,"hint":"The answer is \"A rock\". Wood comes from trees, not rocks."},{"type":"example","q":"Which pair matches a thing with its source?","options":["Eggs - carton","Eggs - frying pan","Eggs - chicken"],"ans":2,"hint":"The answer is \"Eggs - chicken\". Eggs come from chickens."},{"type":"apply","q":"Ava follows a stream uphill to find where its water begins. What is she looking for?","options":["The stream's source","The stream's insulator","The stream's blackout"],"ans":0,"hint":"The answer is \"The stream's source\". The source is the place where the water comes from."},{"type":"apply","q":"Your teacher asks where the paper in your notebook first came from. What is the best answer?","options":["Trees","Erasers","Pencils"],"ans":0,"hint":"The answer is \"Trees\". Paper is made from wood, which comes from trees."},{"type":"apply","q":"For a class report, Jay lists the book where he found his facts. What is that book?","options":["A system failure","A source of information","An electrical grid"],"ans":1,"hint":"The answer is \"A source of information\". The book is the place his facts came from."},{"type":"apply","q":"You hear a crash in the kitchen and see a pot falling to the floor. What is the pot?","options":["A listener of the sound","The source of the sound","The grid for the sound"],"ans":1,"hint":"The answer is \"The source of the sound\". The pot is where the sound came from."},{"type":"apply","q":"Your wool sweater keeps you warm. What is the source of the wool?","options":["A washing machine","Sheep","A closet"],"ans":1,"hint":"The answer is \"Sheep\". Wool comes from sheep."}],"esource":[{"type":"know","q":"What is an energy source?","options":["Something that provides energy","Something that destroys energy","Something that only makes noise"],"ans":0,"hint":"The answer is \"Something that provides energy\". An energy source is something that provides energy."},{"type":"know","q":"Which statement is true?","options":["The sun gives off no energy","Batteries cannot provide energy","Food is an energy source for your body"],"ans":2,"hint":"The answer is \"Food is an energy source for your body\". Food, the sun, and batteries all provide energy."},{"type":"know","q":"Fill in the blank: An energy source is something that ___ energy.","options":["provides","destroys","hides"],"ans":0,"hint":"The answer is \"provides\". Energy sources provide energy."},{"type":"know","q":"Which term means something that provides energy?","options":["Energy source","System failure","Blackout"],"ans":0,"hint":"The answer is \"Energy source\". That is the meaning of energy source."},{"type":"know","q":"Which list names only energy sources?","options":["Sun, wind, water, food","Wind, shadow, cup, pillow","Sun, sock, chair, spoon"],"ans":0,"hint":"The answer is \"Sun, wind, water, food\". Sun, wind, water, and food all provide energy."},{"type":"example","q":"Which is an energy source?","options":["A plastic cup","The sun","A shadow"],"ans":1,"hint":"The answer is \"The sun\". The sun provides light and heat energy."},{"type":"example","q":"Which is NOT an energy source?","options":["Wind","Batteries","An empty glass jar"],"ans":2,"hint":"The answer is \"An empty glass jar\". An empty jar does not provide energy."},{"type":"example","q":"What pushes a sailboat across the lake?","options":["A shadow","Sand","Wind"],"ans":2,"hint":"The answer is \"Wind\". Wind is an energy source that pushes the sail."},{"type":"example","q":"Which energy source gives your body energy to run at recess?","options":["Wind","Food","Batteries"],"ans":1,"hint":"The answer is \"Food\". Food provides energy for your body."},{"type":"example","q":"Which energy source is inside a TV remote?","options":["Wind","Food","Batteries"],"ans":2,"hint":"The answer is \"Batteries\". Batteries provide the energy for a remote."},{"type":"apply","q":"A family puts solar panels on their roof. Which energy source will the panels use?","options":["Food","Batteries","The sun"],"ans":2,"hint":"The answer is \"The sun\". Solar panels use energy from the sun."},{"type":"apply","q":"Before a soccer game, Kai eats a banana. Why does that help him play?","options":["Bananas are tiny batteries","Food is an energy source for his body","Bananas stop energy"],"ans":1,"hint":"The answer is \"Food is an energy source for his body\". Food provides energy for the body."},{"type":"apply","q":"Mom's car stops because it ran out of gas. What does the car need?","options":["More fuel","More shadows","More sand"],"ans":0,"hint":"The answer is \"More fuel\". Fuel like gas is an energy source for cars."},{"type":"apply","q":"A town builds a dam with big wheels that spin in a river. Which energy source is it using?","options":["Food","Moving water","Batteries"],"ans":1,"hint":"The answer is \"Moving water\". Moving water is an energy source."},{"type":"apply","q":"A science fair pinwheel spins only when a fan blows on it. What gives the pinwheel its energy?","options":["The table it sits on","Moving air from the fan","The poster behind it"],"ans":1,"hint":"The answer is \"Moving air from the fan\". Moving air, like wind, provides the energy that spins it."}],"conversion":[{"type":"know","q":"What is energy conversion?","options":["Making energy disappear","Keeping energy in one form forever","Changing energy from one form into another"],"ans":2,"hint":"The answer is \"Changing energy from one form into another\". Energy conversion is changing energy from one form into another."},{"type":"know","q":"Which statement is true?","options":["Energy can change from one form into another","Energy can be destroyed","Energy can never change form"],"ans":0,"hint":"The answer is \"Energy can change from one form into another\". Energy is never destroyed; it can be converted into other forms."},{"type":"know","q":"Fill in the blank: Energy conversion is changing energy from one ___ into another.","options":["color","form","size"],"ans":1,"hint":"The answer is \"form\". Conversion changes energy's form."},{"type":"know","q":"Which term means the process of changing energy from one form into another?","options":["Blackout","Energy conversion","Electrical grid"],"ans":1,"hint":"The answer is \"Energy conversion\". That is the meaning of energy conversion."},{"type":"know","q":"A lamp converts electrical energy into which forms?","options":["Food and water","Light and heat","Wind and chemical"],"ans":1,"hint":"The answer is \"Light and heat\". A lamp changes electrical energy into light and heat."},{"type":"example","q":"Which is an example of energy conversion?","options":["A rock sitting still on the ground","A book resting on a shelf","A toaster changing electrical energy into heat"],"ans":2,"hint":"The answer is \"A toaster changing electrical energy into heat\". The toaster changes energy from one form into another."},{"type":"example","q":"Which is NOT an example of energy conversion?","options":["A pencil lying still on a desk","A fan spinning when plugged in","A flashlight shining"],"ans":0,"hint":"The answer is \"A pencil lying still on a desk\". Nothing is changing energy in a pencil lying still."},{"type":"example","q":"Which device converts electrical energy mainly into sound?","options":["A doorbell","A toaster","A lamp"],"ans":0,"hint":"The answer is \"A doorbell\". A doorbell's main job is to make sound."},{"type":"example","q":"Which device converts electrical energy mainly into motion energy?","options":["An electric fan","A lamp","A toaster"],"ans":0,"hint":"The answer is \"An electric fan\". A fan's blades move, so it makes motion energy."},{"type":"example","q":"Which list shows only energy conversions?","options":["Rock resting, book sitting, cup standing","Fan spinning, bulb shining, radio playing","Shoe on floor, pen in cup, hat on hook"],"ans":1,"hint":"The answer is \"Fan spinning, bulb shining, radio playing\". Each device changes electrical energy into another form."},{"type":"apply","q":"You rub your hands together fast on a cold day. What energy conversion happens?","options":["Light into chemical energy","Sound into electrical energy","Motion energy into heat"],"ans":2,"hint":"The answer is \"Motion energy into heat\". Rubbing changes motion energy into heat, so your hands warm up."},{"type":"apply","q":"Liam plugs in a radio. Electrical energy goes in. What is the main energy that comes out?","options":["Chemical energy","Food energy","Sound"],"ans":2,"hint":"The answer is \"Sound\". A radio converts electrical energy mainly into sound."},{"type":"apply","q":"What form of energy is stored in a flashlight's batteries before you switch it on?","options":["Chemical energy","Motion energy","Sound energy"],"ans":0,"hint":"The answer is \"Chemical energy\". Batteries store chemical energy."},{"type":"apply","q":"Why does a light bulb feel warm after it has been on for a while?","options":["Cold flows out of the bulb","Some electrical energy changes into heat","The bulb makes energy disappear"],"ans":1,"hint":"The answer is \"Some electrical energy changes into heat\". Some energy always becomes heat when energy is converted."},{"type":"apply","q":"At the science fair, Nora's solar toy car moves in the sunlight. What conversion happens?","options":["Motion into food energy","Sound into light energy","Light energy into motion energy"],"ans":2,"hint":"The answer is \"Light energy into motion energy\". The car uses the sun's light energy to move."}],"convert":[{"type":"know","q":"What does convert mean?","options":["To keep energy exactly the same","To make energy go away","To change energy from one form into another"],"ans":2,"hint":"The answer is \"To change energy from one form into another\". To convert is to change energy from one form into another."},{"type":"know","q":"Which statement is true?","options":["Devices can convert energy into different forms","Nothing can convert energy","Converting energy destroys it"],"ans":0,"hint":"The answer is \"Devices can convert energy into different forms\". Devices change energy from one form into another."},{"type":"know","q":"Fill in the blank: To ___ is to change energy from one form into another.","options":["convert","insulate","reflect"],"ans":0,"hint":"The answer is \"convert\". Convert means to change energy's form."},{"type":"know","q":"Which word means almost the same as convert?","options":["Hide","Stop","Change"],"ans":2,"hint":"The answer is \"Change\". To convert energy is to change it into another form."},{"type":"know","q":"When energy is converted, does any of it vanish forever?","options":["Yes, half of it vanishes","Yes, all of it vanishes","No, it just changes form"],"ans":2,"hint":"The answer is \"No, it just changes form\". Energy never goes away; it only changes form."},{"type":"example","q":"Which device converts electrical energy into heat to cook food?","options":["A doorbell","A flashlight","An electric stove"],"ans":2,"hint":"The answer is \"An electric stove\". A stove changes electrical energy into heat for cooking."},{"type":"example","q":"Which converts chemical energy from food into motion?","options":["A wall outlet","Your body when you run","A light bulb"],"ans":1,"hint":"The answer is \"Your body when you run\". Your body changes food energy into motion."},{"type":"example","q":"Which does NOT convert energy?","options":["A car engine","A brick sitting in the yard","A guitar being played"],"ans":1,"hint":"The answer is \"A brick sitting in the yard\". A brick sitting still is not changing energy."},{"type":"example","q":"Which converts motion energy into sound?","options":["Plucking a guitar string","A closed book on a shelf","A rock resting on the ground"],"ans":0,"hint":"The answer is \"Plucking a guitar string\". The moving string makes sound."},{"type":"example","q":"Which converts light energy into electrical energy?","options":["A doorbell","A solar panel","A toaster"],"ans":1,"hint":"The answer is \"A solar panel\". Solar panels change light into electricity."},{"type":"apply","q":"A wind turbine spins in the wind. What form does it convert the motion energy into?","options":["Electrical energy","Sound energy only","Chemical energy in food"],"ans":0,"hint":"The answer is \"Electrical energy\". Wind turbines change motion energy into electrical energy."},{"type":"apply","q":"Ella stretches a rubber band and lets go, and it flies across the room. What did its stored energy convert into?","options":["Motion energy","Chemical energy","Light energy"],"ans":0,"hint":"The answer is \"Motion energy\". The stretched band's stored energy changed into motion."},{"type":"apply","q":"You slide down a metal slide fast, and your legs feel warm. Why?","options":["Light converts into sound","Motion energy converts into heat","Heat flows from cold to hot"],"ans":1,"hint":"The answer is \"Motion energy converts into heat\". Rubbing against the slide changes some motion energy into heat."},{"type":"apply","q":"A battery-powered toy fan is switched on. What energy goes in and what main energy comes out?","options":["Light energy in, chemical energy out","Chemical energy in, motion energy out","Sound energy in, light energy out"],"ans":1,"hint":"The answer is \"Chemical energy in, motion energy out\". The battery's chemical energy is converted into the spinning motion."},{"type":"apply","q":"Josh claps his hands loudly. The motion of his hands converts into which energy you can hear?","options":["Electrical energy","Light energy","Sound energy"],"ans":2,"hint":"The answer is \"Sound energy\". Clapping changes motion energy into sound."}],"converter":[{"type":"know","q":"What is a converter?","options":["Something that blocks all energy","Something that stores water","Something that changes one form of energy into another"],"ans":2,"hint":"The answer is \"Something that changes one form of energy into another\". A converter changes energy from one form into another form."},{"type":"know","q":"Which statement about converters is true?","options":["A converter destroys energy","A toaster is a converter","A converter only works in the dark"],"ans":1,"hint":"The answer is \"A toaster is a converter\". A toaster changes electrical energy into heat, so it is a converter."},{"type":"know","q":"Fill in the blank: A converter changes one ___ of energy into another.","options":["color","form","size"],"ans":1,"hint":"The answer is \"form\". Converters change energy from one form into a different form."},{"type":"know","q":"Which word means 'something that changes one form of energy into another'?","options":["converter","insulator","medium"],"ans":0,"hint":"The answer is \"converter\". That is the meaning of the word converter."},{"type":"know","q":"The study guide gives three examples of converters. Which group is it?","options":["solar panel, motor, toaster","sand, rope, paper","rock, pillow, spoon"],"ans":0,"hint":"The answer is \"solar panel, motor, toaster\". A solar panel, a motor and a toaster each change one energy form into another."},{"type":"example","q":"Which of these is a converter?","options":["a rock","a pillow","a lamp"],"ans":2,"hint":"The answer is \"a lamp\". A lamp changes electrical energy into light."},{"type":"example","q":"Which of these is NOT a converter?","options":["a wooden block","a solar panel","a motor"],"ans":0,"hint":"The answer is \"a wooden block\". A wooden block does not change energy from one form into another."},{"type":"example","q":"A blender, a hair dryer and a flashlight all belong in which group?","options":["insulators","converters","fuels"],"ans":1,"hint":"The answer is \"converters\". Each one changes energy from one form into another."},{"type":"example","q":"Pick the item that belongs with a solar panel, a motor and a toaster.","options":["an electric fan","a paper towel","a pebble"],"ans":0,"hint":"The answer is \"an electric fan\". A fan is a converter: it changes electrical energy into motion."},{"type":"example","q":"Which kitchen item is a converter?","options":["a wooden spoon","a plate","a microwave oven"],"ans":2,"hint":"The answer is \"a microwave oven\". A microwave oven changes electrical energy into heat for food."},{"type":"apply","q":"Mia plugs in a toaster and makes toast. What energy goes in and what comes out?","options":["Sound in, electrical out","Electrical in, heat out","Heat in, sound out"],"ans":1,"hint":"The answer is \"Electrical in, heat out\". A toaster changes electrical energy into heat."},{"type":"apply","q":"Leo's toy car runs on a motor. Why is the motor a converter?","options":["It makes energy from nothing","It changes motion into sunlight","It changes electrical energy into motion"],"ans":2,"hint":"The answer is \"It changes electrical energy into motion\". A motor changes electrical energy into motion energy."},{"type":"apply","q":"At the science fair, Ava shows a sun-powered calculator. Which part changes sunlight into electricity?","options":["the screen cover","the solar panel","the plastic buttons"],"ans":1,"hint":"The answer is \"the solar panel\". The solar panel is the converter that changes light into electrical energy."},{"type":"apply","q":"Sam wants to change electrical energy into heat to warm his bread. Which converter should he use?","options":["a toaster","a solar panel","a fan"],"ans":0,"hint":"The answer is \"a toaster\". A toaster changes electrical energy into heat."},{"type":"apply","q":"When any converter changes energy into another form, what can you predict happens to some of the energy?","options":["It all vanishes","It turns into water","Some becomes heat"],"ans":2,"hint":"The answer is \"Some becomes heat\". Energy never goes away, and some always becomes heat."}],"renewable":[{"type":"know","q":"What is renewable energy?","options":["Energy that comes only from coal","Energy that can only be used once","Energy from sources that are naturally refilled"],"ans":2,"hint":"The answer is \"Energy from sources that are naturally refilled\". Renewable energy comes from sources that nature refills."},{"type":"know","q":"In the study guide, what does the word 'replenished' mean?","options":["broken","frozen","refilled"],"ans":2,"hint":"The answer is \"refilled\". Replenished means refilled."},{"type":"know","q":"Fill in the blank: Sun, wind and flowing water are ___ energy sources.","options":["limited","nonrenewable","renewable"],"ans":2,"hint":"The answer is \"renewable\". Sun, wind and flowing water are naturally refilled, so they are renewable."},{"type":"know","q":"Which statement is true?","options":["Renewable sources run out quickly","Wind is a renewable energy source","Coal is a renewable energy source"],"ans":1,"hint":"The answer is \"Wind is a renewable energy source\". Wind is naturally replenished, so it is renewable."},{"type":"know","q":"Which term means energy from sources that refill naturally?","options":["renewable energy","nonrenewable energy","stored fuel"],"ans":0,"hint":"The answer is \"renewable energy\". Renewable energy comes from sources that are naturally replenished."},{"type":"example","q":"Which of these is a renewable energy source?","options":["sunlight","coal","oil"],"ans":0,"hint":"The answer is \"sunlight\". Sunlight is naturally replenished every day."},{"type":"example","q":"Which of these is NOT a renewable energy source?","options":["flowing water","natural gas","wind"],"ans":1,"hint":"The answer is \"natural gas\". Natural gas is limited and cannot be replaced quickly."},{"type":"example","q":"Pick the one that belongs with sun and wind.","options":["flowing water","gasoline","coal"],"ans":0,"hint":"The answer is \"flowing water\". Flowing water is renewable, just like sun and wind."},{"type":"example","q":"Which group has ONLY renewable sources?","options":["sun, wind, flowing water","coal, oil, wind","gasoline, sun, natural gas"],"ans":0,"hint":"The answer is \"sun, wind, flowing water\". Sun, wind and flowing water are all naturally replenished."},{"type":"example","q":"Which of these is powered by a renewable source?","options":["a coal furnace","a gas-powered lawn mower","a windmill"],"ans":2,"hint":"The answer is \"a windmill\". A windmill uses wind, which is renewable."},{"type":"apply","q":"Nora's town builds wind turbines on a hill. Why will the wind not run out?","options":["Wind is naturally replenished","Wind is made from coal","Wind can be used only once"],"ans":0,"hint":"The answer is \"Wind is naturally replenished\". Wind keeps coming back, so it is renewable."},{"type":"apply","q":"A family puts solar panels on their roof. What kind of energy source are they using?","options":["gasoline","renewable","nonrenewable"],"ans":1,"hint":"The answer is \"renewable\". Sunlight is naturally replenished, so it is renewable."},{"type":"apply","q":"In class, Jay sorts energy cards. Where does the card 'a river spinning a water wheel' go?","options":["the nonrenewable pile","the not-energy pile","the renewable pile"],"ans":2,"hint":"The answer is \"the renewable pile\". Flowing water is a renewable energy source."},{"type":"apply","q":"Kim says, 'If we use sunlight today, there will be none tomorrow.' What should you tell her?","options":["Sunlight is limited like coal","The Sun keeps shining, so it is renewable","She is right, sunlight runs out"],"ans":1,"hint":"The answer is \"The Sun keeps shining, so it is renewable\". Sunlight is naturally replenished, so it does not run out."},{"type":"apply","q":"A camp wants power from a source that keeps refilling by itself. What should they choose?","options":["a gasoline generator","a water wheel in a flowing stream","a coal stove"],"ans":1,"hint":"The answer is \"a water wheel in a flowing stream\". Flowing water is renewable; gasoline and coal are not."}],"nonrenewable":[{"type":"know","q":"What is nonrenewable energy?","options":["Energy from limited sources that cannot be replaced quickly","Energy that comes only from wind","Energy that refills itself every day"],"ans":0,"hint":"The answer is \"Energy from limited sources that cannot be replaced quickly\". Nonrenewable sources are limited and cannot be replaced quickly."},{"type":"know","q":"Which statement is true?","options":["Coal refills every night","Oil cannot be replaced quickly","Natural gas is the same as sunlight"],"ans":1,"hint":"The answer is \"Oil cannot be replaced quickly\". Oil is a nonrenewable source, so it cannot be replaced quickly."},{"type":"know","q":"Fill in the blank: Nonrenewable sources are ___ and cannot be replaced quickly.","options":["limited","endless","invisible"],"ans":0,"hint":"The answer is \"limited\". Nonrenewable sources are limited, so they can run out."},{"type":"know","q":"Which term matches 'limited sources like coal and oil'?","options":["nonrenewable energy","solar energy","renewable energy"],"ans":0,"hint":"The answer is \"nonrenewable energy\". Coal and oil are limited, so they are nonrenewable."},{"type":"know","q":"Which list shows only nonrenewable sources?","options":["coal, oil, gasoline, natural gas","sun, coal, wind","sun, wind, flowing water"],"ans":0,"hint":"The answer is \"coal, oil, gasoline, natural gas\". Coal, oil, gasoline and natural gas are limited and cannot be replaced quickly."},{"type":"example","q":"Which of these is a nonrenewable source?","options":["wind","sunlight","coal"],"ans":2,"hint":"The answer is \"coal\". Coal is limited and cannot be replaced quickly."},{"type":"example","q":"Which of these is NOT a nonrenewable source?","options":["natural gas","flowing water","oil"],"ans":1,"hint":"The answer is \"flowing water\". Flowing water is naturally replenished, so it is renewable."},{"type":"example","q":"Pick the one that belongs with coal and oil.","options":["sunlight","wind","natural gas"],"ans":2,"hint":"The answer is \"natural gas\". Natural gas is nonrenewable, like coal and oil."},{"type":"example","q":"Which of these uses a nonrenewable source?","options":["a sailboat pushed by wind","a calculator run by sunlight","a car that runs on gasoline"],"ans":2,"hint":"The answer is \"a car that runs on gasoline\". Gasoline is a nonrenewable source."},{"type":"example","q":"Which fuel is pumped into cars at a gas station?","options":["gasoline","wind","sunlight"],"ans":0,"hint":"The answer is \"gasoline\". Gasoline is a nonrenewable source of energy."},{"type":"apply","q":"A town's coal mine is almost empty. Why can't they just wait for more coal?","options":["Coal grows back every week","Coal cannot be replaced quickly","Coal falls from the sky in rain"],"ans":1,"hint":"The answer is \"Coal cannot be replaced quickly\". Coal is nonrenewable, so it cannot be replaced quickly."},{"type":"apply","q":"Ella's class asks, 'Why should we save oil?' What is the best answer?","options":["Oil is made by the Sun each day","Oil is limited and can run out","Oil refills every morning"],"ans":1,"hint":"The answer is \"Oil is limited and can run out\". Oil is a limited, nonrenewable source."},{"type":"apply","q":"Ben's house is heated by burning natural gas. What kind of source is that?","options":["solar","nonrenewable","renewable"],"ans":1,"hint":"The answer is \"nonrenewable\". Natural gas is limited and cannot be replaced quickly."},{"type":"apply","q":"A school wants to stop using a source that will run out. Which one should it stop using?","options":["sunlight","wind","coal"],"ans":2,"hint":"The answer is \"coal\". Coal is nonrenewable and can run out."},{"type":"apply","q":"At the science fair, Omar shows a jar of oil and a pinwheel spun by wind. Which is the nonrenewable source?","options":["the wind","both of them","the oil"],"ans":2,"hint":"The answer is \"the oil\". Oil is nonrenewable; wind is renewable."}],"solar":[{"type":"know","q":"Is solar energy renewable or nonrenewable?","options":["renewable, because the Sun keeps shining","nonrenewable, because it runs out","neither one"],"ans":0,"hint":"The answer is \"renewable, because the Sun keeps shining\". The Sun is a source that is naturally replenished."},{"type":"know","q":"The word 'solar' has to do with what?","options":["the ocean","the Sun","the soil"],"ans":1,"hint":"The answer is \"the Sun\". Solar means having to do with the Sun."},{"type":"know","q":"Fill in the blank: Solar energy is energy that comes from the ___.","options":["Sun","ground","wind"],"ans":0,"hint":"The answer is \"Sun\". Solar energy is energy that comes from the Sun."},{"type":"know","q":"Which statement is true?","options":["The Sun gives us only sound","The Sun gives us light and heat","Solar energy comes from oil"],"ans":1,"hint":"The answer is \"The Sun gives us light and heat\". The Sun is a source of both light and heat."},{"type":"know","q":"Which term means energy that comes from the Sun?","options":["sound energy","chemical energy","solar energy"],"ans":2,"hint":"The answer is \"solar energy\". Energy from the Sun is called solar energy."},{"type":"example","q":"Which is an example of using solar energy?","options":["winding up a toy","burning coal in a stove","drying wet clothes in sunshine"],"ans":2,"hint":"The answer is \"drying wet clothes in sunshine\". Sunshine dries the clothes using energy from the Sun."},{"type":"example","q":"Which is NOT using solar energy?","options":["a gasoline lawn mower","a solar panel on a roof","a plant growing in sunlight"],"ans":0,"hint":"The answer is \"a gasoline lawn mower\". A gasoline mower uses gasoline, not energy from the Sun."},{"type":"example","q":"Pick the one that gets its energy from the Sun.","options":["a solar garden light","a wind-up music box","a gas grill"],"ans":0,"hint":"The answer is \"a solar garden light\". A solar garden light gets its energy from sunlight."},{"type":"example","q":"Which of these comes from solar energy?","options":["the heat from a gas stove","the sound of a drum","the warmth of sand on a sunny beach"],"ans":2,"hint":"The answer is \"the warmth of sand on a sunny beach\". The Sun warms the beach sand."},{"type":"example","q":"Which group uses ONLY solar energy?","options":["solar calculator, lizard warming in the sun, sun-dried raisins","wind-up toy, gas grill, candle","gas car, solar calculator, coal stove"],"ans":0,"hint":"The answer is \"solar calculator, lizard warming in the sun, sun-dried raisins\". All three in that group use energy from the Sun."},{"type":"apply","q":"Zoe leaves a chocolate bar on a sunny windowsill and it melts. Why?","options":["A cold wind blew on it","The window made a loud sound","Solar energy heated it"],"ans":2,"hint":"The answer is \"Solar energy heated it\". The Sun gives heat, and that heat melted the chocolate."},{"type":"apply","q":"A dark sidewalk feels hot on a summer afternoon. Where did the heat come from?","options":["a battery in the sidewalk","the Moon","the Sun"],"ans":2,"hint":"The answer is \"the Sun\". The Sun is a source of heat."},{"type":"apply","q":"Max wants to cook a hot dog at camp with no fuel and no electricity. What can he use?","options":["a gas stove","a solar oven box lined with foil","a coal grill"],"ans":1,"hint":"The answer is \"a solar oven box lined with foil\". A solar oven uses energy from the Sun."},{"type":"apply","q":"In class, one plant sits in sunlight and one sits in a dark closet. Which plant gets solar energy?","options":["neither plant","the plant in the sunlight","the plant in the closet"],"ans":1,"hint":"The answer is \"the plant in the sunlight\". Solar energy comes from the Sun, so only the plant in sunlight gets it."},{"type":"apply","q":"On a very cloudy day, what would you predict about the sunlight reaching a solar garden light?","options":["The sunlight turns into wind","Less sunlight reaches it","More sunlight reaches it"],"ans":1,"hint":"The answer is \"Less sunlight reaches it\". Clouds block some of the Sun's light."}],"solarpanel":[{"type":"know","q":"What does a solar panel do?","options":["Converts electrical energy into sunlight","Stores coal for later","Converts sunlight into electrical energy"],"ans":2,"hint":"The answer is \"Converts sunlight into electrical energy\". A solar panel changes light energy into electrical energy."},{"type":"know","q":"Which statement is true?","options":["A solar panel is a converter","A solar panel turns electricity into wind","A solar panel needs gasoline"],"ans":0,"hint":"The answer is \"A solar panel is a converter\". A solar panel changes one form of energy into another."},{"type":"know","q":"What energy comes out of a solar panel?","options":["sound energy","electrical energy","chemical energy"],"ans":1,"hint":"The answer is \"electrical energy\". A solar panel makes electrical energy."},{"type":"know","q":"Fill in the blank: A solar panel converts ___ into electrical energy.","options":["wind","sunlight","sound"],"ans":1,"hint":"The answer is \"sunlight\". A solar panel changes sunlight (light energy) into electrical energy."},{"type":"know","q":"Which device converts sunlight into electrical energy?","options":["a motor","a solar panel","a toaster"],"ans":1,"hint":"The answer is \"a solar panel\". That is exactly the job of a solar panel."},{"type":"example","q":"Which of these uses a solar panel?","options":["a calculator that works in sunlight","a wind-up clock","a candle"],"ans":0,"hint":"The answer is \"a calculator that works in sunlight\". A sun-powered calculator has a small solar panel."},{"type":"example","q":"Which is NOT an example of a solar panel at work?","options":["solar roof tiles powering a house","a sun-charged garden light","a gas-powered car"],"ans":2,"hint":"The answer is \"a gas-powered car\". A gas-powered car runs on gasoline, not sunlight."},{"type":"example","q":"Pick the one that belongs with solar calculators and solar garden lights.","options":["a solar-powered road sign","a wind-up flashlight","a gas lantern"],"ans":0,"hint":"The answer is \"a solar-powered road sign\". A solar road sign also changes sunlight into electricity."},{"type":"example","q":"Which group of devices ALL make electrical energy from sunlight?","options":["motor, toaster, solar calculator","solar roof, solar calculator, solar garden light","candle, gas stove, solar roof"],"ans":1,"hint":"The answer is \"solar roof, solar calculator, solar garden light\". Each of those uses a solar panel to change light into electricity."},{"type":"example","q":"Which item could charge a phone using sunlight?","options":["a solar charger","a glass of water","a wooden box"],"ans":0,"hint":"The answer is \"a solar charger\". A solar charger has a solar panel that makes electricity from sunlight."},{"type":"apply","q":"Lily keeps a solar garden light in a dark shed for a week. What happens?","options":["It turns the dark into light","It makes extra electricity","It cannot make electricity"],"ans":2,"hint":"The answer is \"It cannot make electricity\". With no sunlight, the solar panel cannot make electrical energy."},{"type":"apply","q":"Owen's solar calculator stops when he covers the panel with his thumb. Why?","options":["The calculator ran out of gasoline","His thumb added too much electricity","No light reaches the panel"],"ans":2,"hint":"The answer is \"No light reaches the panel\". A solar panel needs light to make electrical energy."},{"type":"apply","q":"A family wants to add solar panels to their home. Where should they put them?","options":["on a sunny roof","under the porch","in the basement"],"ans":0,"hint":"The answer is \"on a sunny roof\". Solar panels need sunlight to work."},{"type":"apply","q":"At the science fair, Ruby holds a solar panel connected to a small fan in the sunlight. What goes into the panel and what comes out?","options":["Electrical in, light out","Light in, electrical out","Sound in, chemical out"],"ans":1,"hint":"The answer is \"Light in, electrical out\". A solar panel changes light energy into electrical energy."},{"type":"apply","q":"Why is a solar panel a good choice for a renewable energy project?","options":["It uses up oil","It burns coal","It uses sunlight, which is replenished"],"ans":2,"hint":"The answer is \"It uses sunlight, which is replenished\". Sunlight is naturally replenished, so it is renewable."}],"turbine":[{"type":"know","q":"What is a wind turbine?","options":["A machine that makes wind from coal","A machine that stores rain","A machine that uses wind to make electrical energy"],"ans":2,"hint":"The answer is \"A machine that uses wind to make electrical energy\". A wind turbine uses wind to produce electrical energy."},{"type":"know","q":"What does a wind turbine need in order to work?","options":["coal","wind","gasoline"],"ans":1,"hint":"The answer is \"wind\". A wind turbine uses wind to make electricity."},{"type":"know","q":"Fill in the blank: A wind turbine uses wind to produce ___ energy.","options":["chemical","sound","electrical"],"ans":2,"hint":"The answer is \"electrical\". A wind turbine makes electrical energy."},{"type":"know","q":"Which statement is true?","options":["A wind turbine uses a renewable source","A wind turbine burns oil","A wind turbine works best with no wind"],"ans":0,"hint":"The answer is \"A wind turbine uses a renewable source\". Wind is naturally replenished, so it is renewable."},{"type":"know","q":"Which machine uses wind to produce electrical energy?","options":["a wind turbine","a motor","a toaster"],"ans":0,"hint":"The answer is \"a wind turbine\". That is the job of a wind turbine."},{"type":"example","q":"Which of these belongs in the group 'things that make electrical energy'?","options":["a rubber band","a candle","a wind turbine"],"ans":2,"hint":"The answer is \"a wind turbine\". A wind turbine makes electrical energy from wind."},{"type":"example","q":"Which part of a wind turbine does the wind push?","options":["the solar cells","the coal tank","the blades"],"ans":2,"hint":"The answer is \"the blades\". The wind pushes the blades and makes them spin."},{"type":"example","q":"Which machine also uses a renewable source, like a wind turbine?","options":["a coal furnace","a gasoline car engine","a solar panel"],"ans":2,"hint":"The answer is \"a solar panel\". A solar panel uses sunlight, which is renewable."},{"type":"example","q":"A wind farm is a big group of many ___.","options":["wind turbines","solar ovens","coal mines"],"ans":0,"hint":"The answer is \"wind turbines\". A wind farm has many wind turbines making electricity."},{"type":"example","q":"Which kind of weather gives a wind turbine the most to work with?","options":["a strong, steady breeze","thick fog with no wind","a calm, still day"],"ans":0,"hint":"The answer is \"a strong, steady breeze\". A wind turbine uses wind, so a strong breeze helps most."},{"type":"apply","q":"On a calm day with no wind at all, what happens to a wind turbine?","options":["It makes the most electricity","It makes little or no electricity","It makes coal"],"ans":1,"hint":"The answer is \"It makes little or no electricity\". With no wind, the turbine cannot produce electrical energy."},{"type":"apply","q":"Grace's town has windy days most of the year. Why might the town build wind turbines?","options":["Wind is a nonrenewable fuel","Wind can make electricity and will not run out","Wind turbines burn the wind as fuel"],"ans":1,"hint":"The answer is \"Wind can make electricity and will not run out\". Wind turbines use wind, a renewable source, to make electrical energy."},{"type":"apply","q":"In class, Jack blows on a tiny model turbine and a small light turns on. What did his breath act as?","options":["the wind","the battery","the fuel tank"],"ans":0,"hint":"The answer is \"the wind\". His breath was moving air, just like wind."},{"type":"apply","q":"Tara watches a wind turbine spinning near a farm. What goes into it and what comes out?","options":["Sunlight in, sound out","Moving wind in, electrical out","Electrical in, wind out"],"ans":1,"hint":"The answer is \"Moving wind in, electrical out\". A wind turbine uses wind to produce electrical energy."},{"type":"apply","q":"Which spot should a town pick for a new wind turbine?","options":["deep inside a cave","an open, windy hilltop","inside a closed barn"],"ans":1,"hint":"The answer is \"an open, windy hilltop\". A wind turbine needs lots of wind to work."}],"generator":[{"type":"know","q":"What is a generator?","options":["A device that converts motion energy into electrical energy","A device that stores water","A device that converts electrical energy into motion energy"],"ans":0,"hint":"The answer is \"A device that converts motion energy into electrical energy\". A generator changes motion energy into electrical energy."},{"type":"know","q":"What energy goes into a generator?","options":["light energy","sound energy","motion energy"],"ans":2,"hint":"The answer is \"motion energy\". A generator needs motion to make electricity."},{"type":"know","q":"What energy comes out of a generator?","options":["chemical energy","light energy","electrical energy"],"ans":2,"hint":"The answer is \"electrical energy\". A generator makes electrical energy."},{"type":"know","q":"Which statement is true?","options":["A generator works without anything moving","A generator turns electricity into motion","A generator does the opposite of a motor"],"ans":2,"hint":"The answer is \"A generator does the opposite of a motor\". A generator turns motion into electricity; a motor turns electricity into motion."},{"type":"know","q":"Which device converts motion energy into electrical energy?","options":["a generator","a toaster","a motor"],"ans":0,"hint":"The answer is \"a generator\". That is the job of a generator."},{"type":"example","q":"Which is an example of a generator at work?","options":["a bike light powered by the turning wheel","a candle flame","a rock on the ground"],"ans":0,"hint":"The answer is \"a bike light powered by the turning wheel\". The turning wheel's motion is changed into electrical energy."},{"type":"example","q":"Which of these is NOT a generator?","options":["an electric fan","a hand-crank flashlight","a hand-crank radio charger"],"ans":0,"hint":"The answer is \"an electric fan\". A fan uses electricity to make motion, so it is a motor, not a generator."},{"type":"example","q":"Pick the one that belongs with a hand-crank flashlight and a wheel-powered bike light.","options":["a toaster","a candle","a hand-crank radio"],"ans":2,"hint":"The answer is \"a hand-crank radio\". All three use motion to make electrical energy."},{"type":"example","q":"A wind turbine has a generator inside. What makes that generator spin?","options":["a pile of coal","blades turned by the wind","a light bulb"],"ans":1,"hint":"The answer is \"blades turned by the wind\". The wind turns the blades, and that motion spins the generator."},{"type":"example","q":"Which group shows motion being turned into electricity?","options":["plugging in a fan, toasting bread","lighting a candle, ringing a bell","cranking a radio, pedaling a bike light"],"ans":2,"hint":"The answer is \"cranking a radio, pedaling a bike light\". Cranking and pedaling are motion that a generator changes into electrical energy."},{"type":"apply","q":"During a power outage, Eli cranks a hand-crank flashlight. What goes in and what comes out of the generator inside?","options":["Electrical in, motion out","Motion in, electrical out","Light in, sound out"],"ans":1,"hint":"The answer is \"Motion in, electrical out\". A generator changes motion energy into electrical energy."},{"type":"apply","q":"Hana's bike light is powered by her turning wheel. Why does it go dark when she stops?","options":["Pedaling uses up all the light","No motion means no electrical energy","The wheels store sunlight"],"ans":1,"hint":"The answer is \"No motion means no electrical energy\". A generator needs motion to make electricity."},{"type":"apply","q":"At the science fair, Noah spins a magnet inside a coil of wire and a tiny bulb glows. What did he build?","options":["a solar panel","a generator","a motor"],"ans":1,"hint":"The answer is \"a generator\". He used motion to make electrical energy, which is what a generator does."},{"type":"apply","q":"Rushing water at a dam spins a machine that makes electricity for a city. What is that machine?","options":["a motor","a generator","a toaster"],"ans":1,"hint":"The answer is \"a generator\". The motion of the water is changed into electrical energy by a generator."},{"type":"apply","q":"Predict: what happens if you crank a hand-crank radio faster?","options":["It makes more electrical energy","It makes less electrical energy","It stops making electrical energy"],"ans":0,"hint":"The answer is \"It makes more electrical energy\". More motion going in means more electrical energy coming out."}],"motor":[{"type":"know","q":"What is a motor?","options":["A device that converts motion energy into electrical energy","A device that stores sunlight","A device that converts electrical energy into motion energy"],"ans":2,"hint":"The answer is \"A device that converts electrical energy into motion energy\". A motor changes electrical energy into motion energy."},{"type":"know","q":"What energy goes into a motor?","options":["electrical energy","sound energy","light energy"],"ans":0,"hint":"The answer is \"electrical energy\". A motor needs electrical energy to work."},{"type":"know","q":"What useful energy comes out of a motor?","options":["chemical energy","motion energy","light energy"],"ans":1,"hint":"The answer is \"motion energy\". A motor makes things move."},{"type":"know","q":"Which statement is true?","options":["A motor makes energy from nothing","A motor is a converter","A motor turns motion into electricity"],"ans":1,"hint":"The answer is \"A motor is a converter\". A motor changes electrical energy into another form, motion."},{"type":"know","q":"Which device converts electrical energy into motion energy?","options":["a motor","a generator","a solar panel"],"ans":0,"hint":"The answer is \"a motor\". That is the job of a motor."},{"type":"example","q":"Which of these has a motor inside?","options":["a paper book","an electric fan","a wooden chair"],"ans":1,"hint":"The answer is \"an electric fan\". A fan's motor changes electrical energy into spinning motion."},{"type":"example","q":"Which of these does NOT use a motor?","options":["a candle","a blender","a washing machine"],"ans":0,"hint":"The answer is \"a candle\". A candle does not change electrical energy into motion."},{"type":"example","q":"Pick the one that belongs with a blender and an electric fan.","options":["a remote-control car","a glass jar","a pencil"],"ans":0,"hint":"The answer is \"a remote-control car\". A remote-control car uses a motor, like a blender and a fan."},{"type":"example","q":"Which is an example of a motor changing electrical energy into motion?","options":["a candle glowing","a drum being hit","a battery toy train rolling on its track"],"ans":2,"hint":"The answer is \"a battery toy train rolling on its track\". The toy train's motor uses electricity to make the wheels move."},{"type":"example","q":"Which group ALL use motors?","options":["hair dryer, blender, electric fan","candle, crayon, rock","pillow, spoon, mirror"],"ans":0,"hint":"The answer is \"hair dryer, blender, electric fan\". Each of those uses a motor to make something spin."},{"type":"apply","q":"Ivy turns on an electric fan. What goes into its motor and what comes out?","options":["Motion in, electrical out","Light in, chemical out","Electrical in, motion out"],"ans":2,"hint":"The answer is \"Electrical in, motion out\". A motor changes electrical energy into motion energy."},{"type":"apply","q":"Carlos's remote-control car stops when its batteries die. Why?","options":["The wheels ran out of sunlight","The motor gets no electrical energy","The motor got too much motion"],"ans":1,"hint":"The answer is \"The motor gets no electrical energy\". A motor needs electrical energy to make motion."},{"type":"apply","q":"For the science fair, Mila wants a paper propeller to spin using a battery. What should she use?","options":["a solar oven","a candle","a small motor"],"ans":2,"hint":"The answer is \"a small motor\". A motor turns electrical energy into motion."},{"type":"apply","q":"A blender's blades spin to make a smoothie. What part makes them spin?","options":["the cup","the motor","the lid"],"ans":1,"hint":"The answer is \"the motor\". The motor changes electrical energy into the blades' motion."},{"type":"apply","q":"Predict: a toy car's motor gets weak, old batteries. Then you add fresh batteries. What happens?","options":["The wheels stop forever","The car makes gasoline","The wheels spin faster"],"ans":2,"hint":"The answer is \"The wheels spin faster\". More electrical energy into the motor gives more motion."}],"powerplant":[{"type":"know","q":"What is a power plant?","options":["A store that sells batteries","A garden where plants grow","A big building where electricity is made"],"ans":2,"hint":"The answer is \"A big building where electricity is made\". A power plant is a facility where electricity is generated."},{"type":"know","q":"What does a power plant make?","options":["Food","Rain water","Electricity"],"ans":2,"hint":"The answer is \"Electricity\". Power plants are built to generate electricity."},{"type":"know","q":"Which statement is true?","options":["Power plants are tiny devices you hold","Power plants generate electricity","Power plants store sunlight in jars"],"ans":1,"hint":"The answer is \"Power plants generate electricity\". A power plant is a big facility that makes electricity."},{"type":"know","q":"Fill in the blank: A power plant is a facility where electricity is ____.","options":["generated","thrown away","frozen"],"ans":0,"hint":"The answer is \"generated\". Generated means made, and power plants make electricity."},{"type":"know","q":"Which term means \"a big building where electricity is made\"?","options":["Light bulb","Rubber band","Power plant"],"ans":2,"hint":"The answer is \"Power plant\". That is the meaning of power plant."},{"type":"example","q":"Which of these is a power plant?","options":["A lamp in your bedroom","A building where turbines make electricity for a city","A flower pot on a window"],"ans":1,"hint":"The answer is \"A building where turbines make electricity for a city\". Only that building makes electricity for many people."},{"type":"example","q":"Which of these is NOT a power plant?","options":["A flashlight","A coal-burning electricity station","A dam that makes electricity"],"ans":0,"hint":"The answer is \"A flashlight\". A flashlight is a small device, not a big facility that makes electricity."},{"type":"example","q":"Which item would you find inside a power plant?","options":["A huge generator","A swing set","A sandbox"],"ans":0,"hint":"The answer is \"A huge generator\". Power plants use giant generators to make electricity."},{"type":"example","q":"Which group lists only places that make electricity?","options":["Library, bakery, school","Wind farm, solar plant, dam","Park, zoo, beach"],"ans":1,"hint":"The answer is \"Wind farm, solar plant, dam\". Each of those places generates electricity."},{"type":"example","q":"Which is a power plant that uses moving water?","options":["A water slide","A hydroelectric dam","A swimming pool"],"ans":1,"hint":"The answer is \"A hydroelectric dam\". A hydroelectric dam uses moving water to make electricity."},{"type":"apply","q":"The lights in your classroom are on. Where was that electricity most likely made?","options":["Inside the light switch","In the classroom clock","At a power plant"],"ans":2,"hint":"The answer is \"At a power plant\". Electricity is made at a power plant and sent to buildings."},{"type":"apply","q":"A town is growing and needs more electricity. What could it build?","options":["A new playground","A new library","A new power plant"],"ans":2,"hint":"The answer is \"A new power plant\". A power plant is the place that makes electricity."},{"type":"apply","q":"A storm shuts down the town's only power plant. What might happen?","options":["The grass turns blue","Homes may lose electricity","Rain stops falling"],"ans":1,"hint":"The answer is \"Homes may lose electricity\". If the power plant stops, electricity stops being made for homes."},{"type":"apply","q":"On a field trip, Maya sees a big building with spinning turbines and many power lines leaving it. What is she visiting?","options":["A power plant","A bakery","A bike shop"],"ans":0,"hint":"The answer is \"A power plant\". Turbines and power lines are signs of a place that makes electricity."},{"type":"apply","q":"How does electricity get from a power plant to your house?","options":["Through power lines","In a delivery truck","Through the water pipes"],"ans":0,"hint":"The answer is \"Through power lines\". The grid of power lines transfers electricity to homes."}],"efficiency":[{"type":"know","q":"What does efficiency mean?","options":["How well something uses energy to do a task","How heavy something is","How colorful something is"],"ans":0,"hint":"The answer is \"How well something uses energy to do a task\". Efficiency tells how well energy is used to do a job."},{"type":"know","q":"Fill in the blank: An efficient device wastes ____ energy.","options":["more","less","all of its"],"ans":1,"hint":"The answer is \"less\". Efficient devices waste less energy, like less wasted heat."},{"type":"know","q":"Which statement is true?","options":["An efficient device wastes the most heat","Efficiency means how loud a device is","An efficient device wastes less energy"],"ans":2,"hint":"The answer is \"An efficient device wastes less energy\". Being efficient means less energy is wasted."},{"type":"know","q":"Fill in the blank: Efficiency is how ____ something uses energy to do a task.","options":["well","loudly","heavily"],"ans":0,"hint":"The answer is \"well\". Efficiency is about how well energy is used."},{"type":"know","q":"Which word means \"how well something uses energy to do a task\"?","options":["Evidence","Efficiency","Insulator"],"ans":1,"hint":"The answer is \"Efficiency\". That is the meaning of efficiency."},{"type":"example","q":"Which light bulb is an example of an efficient bulb?","options":["An old bulb too hot to touch","A bulb that turns most energy into heat","An LED bulb that stays cool"],"ans":2,"hint":"The answer is \"An LED bulb that stays cool\". An LED wastes less energy as heat, so it is efficient."},{"type":"example","q":"Which is an example of wasting energy?","options":["Closing the fridge door quickly","Using an LED bulb","Leaving the fridge door open"],"ans":2,"hint":"The answer is \"Leaving the fridge door open\". An open fridge door lets cold out, so it wastes energy."},{"type":"example","q":"Which group lists only efficient choices?","options":["Old hot bulbs and drafty windows","LED bulbs and a well-sealed fridge","An open fridge and a hot old bulb"],"ans":1,"hint":"The answer is \"LED bulbs and a well-sealed fridge\". Both of those waste less energy."},{"type":"example","q":"Which item belongs in the \"wastes lots of heat\" group?","options":["A charger that gets very hot","A cool LED night-light","A solar calculator that stays cool"],"ans":0,"hint":"The answer is \"A charger that gets very hot\". A very hot charger is losing lots of energy as wasted heat."},{"type":"example","q":"Which pot uses the stove's heat more efficiently?","options":["A pot with no lid","A pot with a lid","A pot with holes in it"],"ans":1,"hint":"The answer is \"A pot with a lid\". A lid keeps heat in, so less energy is wasted."},{"type":"apply","q":"Two bulbs give the same light. Bulb A gets very hot. Bulb B stays cool. Which is more efficient?","options":["Bulb A","They are exactly the same","Bulb B"],"ans":2,"hint":"The answer is \"Bulb B\". Bulb B wastes less energy as heat."},{"type":"apply","q":"Why can efficient devices help a family pay less for electricity?","options":["They waste less energy","They make more heat","They are painted brighter colors"],"ans":0,"hint":"The answer is \"They waste less energy\". Less wasted energy means less electricity is needed."},{"type":"apply","q":"Leo's phone charger feels warm while charging. Where did that warmth come from?","options":["The charger made brand-new energy","Some energy was wasted as heat","The phone sent cold into it"],"ans":1,"hint":"The answer is \"Some energy was wasted as heat\". Energy is never made from nothing; some of it always becomes heat."},{"type":"apply","q":"At the science fair, Sam puts the same new batteries in two flashlights with the same brightness. X shines 5 hours and Y shines 2 hours. Which is more efficient?","options":["Flashlight X","Flashlight Y","They are equally efficient"],"ans":0,"hint":"The answer is \"Flashlight X\". X did the same job longer with the same energy, so it wastes less."},{"type":"apply","q":"Your family wants to waste less energy lighting the house. What would you use?","options":["Bulbs that get very hot","More lamps left on all night","LED bulbs"],"ans":2,"hint":"The answer is \"LED bulbs\". LED bulbs waste less energy as heat."}],"transfer":[{"type":"know","q":"What does transfer mean?","options":["To make something disappear","To move something from one place to another","To make something heavier"],"ans":1,"hint":"The answer is \"To move something from one place to another\". Transfer means moving something from one place to another."},{"type":"know","q":"Which way does heat transfer?","options":["From cooler things to warmer things","It never moves at all","From warmer things to cooler things"],"ans":2,"hint":"The answer is \"From warmer things to cooler things\". Heat always flows from warm to cool."},{"type":"know","q":"Which statement is true?","options":["Heat moves from cold things to hot things","The grid transfers electricity to homes","Transfer means energy is destroyed"],"ans":1,"hint":"The answer is \"The grid transfers electricity to homes\". Power lines in the grid move electricity to homes."},{"type":"know","q":"Fill in the blank: To transfer is to ____ something from one place to another.","options":["destroy","move","hide"],"ans":1,"hint":"The answer is \"move\". Transfer means to move."},{"type":"know","q":"Which word means \"to move something from one place to another\"?","options":["Claim","Transfer","Efficiency"],"ans":1,"hint":"The answer is \"Transfer\". That is the meaning of transfer."},{"type":"example","q":"Which is an example of heat transfer?","options":["A ball sits still on the floor","A book rests on a shelf","A mug of hot cocoa warms your cold hands"],"ans":2,"hint":"The answer is \"A mug of hot cocoa warms your cold hands\". Heat moves from the warm mug to your cooler hands."},{"type":"example","q":"Which is an example of electricity being transferred?","options":["A pillow sits on a bed","Power lines carry electricity to a school","A crayon lies in a box"],"ans":1,"hint":"The answer is \"Power lines carry electricity to a school\". Power lines move electricity from place to place."},{"type":"example","q":"Which is NOT an example of transfer?","options":["A toy sits still in a box all day","An ice cube melts in your warm hand","A metal spoon warms up in hot soup"],"ans":0,"hint":"The answer is \"A toy sits still in a box all day\". Nothing is moving from one place to another with the still toy."},{"type":"example","q":"Which item belongs in the \"transfers electricity\" group?","options":["A copper wire","A rubber eraser","A wooden spoon"],"ans":0,"hint":"The answer is \"A copper wire\". Metal wires carry electricity; rubber and wood are insulators."},{"type":"example","q":"Which is an example of a moving object transferring energy?","options":["A bowling ball knocks over pins","A pin standing still","A ball resting on a shelf"],"ans":0,"hint":"The answer is \"A bowling ball knocks over pins\". The rolling ball moves its energy to the pins."},{"type":"apply","q":"You put a cold metal spoon in hot soup. What happens?","options":["Heat moves from the soup to the spoon","Cold moves from the spoon to the soup","Nothing changes at all"],"ans":0,"hint":"The answer is \"Heat moves from the soup to the spoon\". Heat flows from the warmer soup to the cooler spoon."},{"type":"apply","q":"Why do power lines connect a power plant to homes?","options":["To transfer electricity to the homes","To store water for the town","To make the sky brighter"],"ans":0,"hint":"The answer is \"To transfer electricity to the homes\". The grid moves electricity from the power plant to homes."},{"type":"apply","q":"A warm can of juice goes into a cooler full of ice. Predict what happens.","options":["The juice gets warmer","The ice gets colder from the juice","The juice cools as heat moves to the ice"],"ans":2,"hint":"The answer is \"The juice cools as heat moves to the ice\". Heat flows from the warmer juice to the cooler ice."},{"type":"apply","q":"Mia wants to send electricity from a battery to a small bulb. What should she use?","options":["A piece of string","A plastic straw","A metal wire"],"ans":2,"hint":"The answer is \"A metal wire\". Metal wires transfer electricity; plastic and string do not."},{"type":"apply","q":"On the playground, Ben pushes a swing with his friend on it. What does Ben transfer to the swing?","options":["Light from his hands","Electricity from his shoes","Energy that makes it move"],"ans":2,"hint":"The answer is \"Energy that makes it move\". Ben's push moves energy into the swing so it moves."}],"input":[{"type":"know","q":"What is an input?","options":["What comes out of a device","What goes into a system or device","The color of a device"],"ans":1,"hint":"The answer is \"What goes into a system or device\". Input is what goes into a system or device."},{"type":"know","q":"What is a lamp's input?","options":["Light energy","Sound energy","Electrical energy"],"ans":2,"hint":"The answer is \"Electrical energy\". A lamp takes in electrical energy."},{"type":"know","q":"Which statement is true?","options":["A device needs an input to work","A device makes energy from nothing","Input means the device is broken"],"ans":0,"hint":"The answer is \"A device needs an input to work\". Devices need energy going in before they can do a job."},{"type":"know","q":"Fill in the blank: An input is what goes ____ a system or device.","options":["out of","into","under"],"ans":1,"hint":"The answer is \"into\". Input is what goes into a device."},{"type":"know","q":"Which word means \"what goes into a system or device\"?","options":["Output","Evidence","Input"],"ans":2,"hint":"The answer is \"Input\". That is the meaning of input."},{"type":"example","q":"For a toaster, which is the energy input?","options":["Heat that browns the bread","Sound of the toast popping","Electrical energy from the outlet"],"ans":2,"hint":"The answer is \"Electrical energy from the outlet\". The toaster takes in electricity; heat and sound come out."},{"type":"example","q":"When you plug in a radio, what is its energy input?","options":["Sound energy","Light energy","Electrical energy"],"ans":2,"hint":"The answer is \"Electrical energy\". The radio takes in electricity and gives off sound."},{"type":"example","q":"Which is an example of an input?","options":["Gas going into a car's tank","Smoke coming out of a car's tailpipe","Noise from a car's horn"],"ans":0,"hint":"The answer is \"Gas going into a car's tank\". Gas goes into the car, so it is an input."},{"type":"example","q":"For a solar calculator, which is the energy input?","options":["Sound energy","Light energy","Electrical energy from a wall outlet"],"ans":1,"hint":"The answer is \"Light energy\". A solar calculator takes in light."},{"type":"example","q":"Which belongs on the \"inputs\" list for a kid riding a bike?","options":["Chemical energy from food the rider ate","The bike moving forward","The sound of the bell"],"ans":0,"hint":"The answer is \"Chemical energy from food the rider ate\". Food energy goes into the rider to pedal the bike."},{"type":"apply","q":"Zoe's lamp will not turn on. She sees it is unplugged. What input is missing?","options":["Light energy","Sound energy","Electrical energy"],"ans":2,"hint":"The answer is \"Electrical energy\". A lamp's input is electrical energy from the outlet."},{"type":"apply","q":"Tom turns the key on a wind-up toy car. What is the input?","options":["The car rolling across the floor","The twisting from his hand","The clicking sound it makes"],"ans":1,"hint":"The answer is \"The twisting from his hand\". Tom's twisting goes into the toy; rolling and clicking come out."},{"type":"apply","q":"Lily's science fair project uses a solar panel to light a small bulb. What is the solar panel's input?","options":["Sunlight","Light from the small bulb","Sound from the bulb"],"ans":0,"hint":"The answer is \"Sunlight\". The solar panel takes in sunlight."},{"type":"apply","q":"A blender needs an input to spin. What would you do to give it its input?","options":["Shine a flashlight on it","Plug it into an outlet","Sing to it"],"ans":1,"hint":"The answer is \"Plug it into an outlet\". A blender's input is electrical energy from the outlet."},{"type":"apply","q":"Predict: What happens if you take away a device's input?","options":["It stops working","It works faster","It makes more output"],"ans":0,"hint":"The answer is \"It stops working\". Without energy going in, the device cannot do its job."}],"output":[{"type":"know","q":"What is an output?","options":["What goes into a device","What comes out of a system or device","The price of a device"],"ans":1,"hint":"The answer is \"What comes out of a system or device\". Output is what comes out of a system or device."},{"type":"know","q":"What are a lamp's outputs?","options":["Sound and motion","Water and air","Light and heat"],"ans":2,"hint":"The answer is \"Light and heat\". A lamp gives off light and heat."},{"type":"know","q":"Which statement is true?","options":["Output comes out after a device gets input","Output always goes in before input","A device has outputs but never inputs"],"ans":0,"hint":"The answer is \"Output comes out after a device gets input\". Energy goes in as input and comes out as output."},{"type":"know","q":"Fill in the blank: An output is what comes ____ a system or device.","options":["into","under","out of"],"ans":2,"hint":"The answer is \"out of\". Output is what comes out of a device."},{"type":"know","q":"Which word means \"what comes out of a system or device\"?","options":["Output","Input","Claim"],"ans":0,"hint":"The answer is \"Output\". That is the meaning of output."},{"type":"example","q":"For a speaker, which is the main useful output?","options":["Sound energy","Electrical energy from the wall","Chemical energy from food"],"ans":0,"hint":"The answer is \"Sound energy\". A speaker gives off sound."},{"type":"example","q":"Which is an output of a toaster?","options":["Heat that browns the bread","Electrical energy from the outlet","Chemical energy from a battery"],"ans":0,"hint":"The answer is \"Heat that browns the bread\". Heat comes out of the toaster; electricity goes in."},{"type":"example","q":"Which is NOT an output of a TV?","options":["Light from the screen","Electrical energy from the outlet","Sound from the speakers"],"ans":1,"hint":"The answer is \"Electrical energy from the outlet\". Electricity goes into the TV, so it is an input."},{"type":"example","q":"Which belongs on the \"outputs\" list for a car?","options":["Gas put into the tank","Exhaust from the tailpipe","Air pumped into the tires"],"ans":1,"hint":"The answer is \"Exhaust from the tailpipe\". Exhaust comes out of the car."},{"type":"example","q":"For an electric fan, which is an output?","options":["Moving air","Electricity from the outlet","Cold water"],"ans":0,"hint":"The answer is \"Moving air\". The fan's blades move air; electricity is the input."},{"type":"apply","q":"You touch a lamp that has been on for an hour and it feels warm. Why?","options":["Heat is its input","Cold air goes into it","Heat is one of its outputs"],"ans":2,"hint":"The answer is \"Heat is one of its outputs\". A lamp's outputs are light and heat."},{"type":"apply","q":"Ana plucks a string on her guitar. What is the output?","options":["Electricity","Light","Sound"],"ans":2,"hint":"The answer is \"Sound\". A plucked guitar string vibrates and makes sound."},{"type":"apply","q":"Dad cooks soup on an electric stove. What output cooks the food?","options":["Sound","Heat","Electricity going into the plug"],"ans":1,"hint":"The answer is \"Heat\". The stove takes in electricity and gives off heat."},{"type":"apply","q":"You turn on a blender with fruit inside. What output chops the fruit?","options":["Light from the blades","Motion of the spinning blades","Cold air"],"ans":1,"hint":"The answer is \"Motion of the spinning blades\". The blender turns electricity into motion that chops."},{"type":"apply","q":"In class, Kai builds a circuit with a battery and a buzzer. What output tells him it works?","options":["A smell of popcorn","The battery getting bigger","A buzzing sound"],"ans":2,"hint":"The answer is \"A buzzing sound\". A buzzer's output is sound."}],"argument":[{"type":"know","q":"What is an argument in science?","options":["Yelling until people agree","Using evidence to explain why a claim is best","Guessing without any facts"],"ans":1,"hint":"The answer is \"Using evidence to explain why a claim is best\". A science argument uses evidence to show a claim is best."},{"type":"know","q":"In a science argument, what do you use to show your claim is best?","options":["Your favorite color","Evidence","A coin flip"],"ans":1,"hint":"The answer is \"Evidence\". Arguments use evidence to explain why a claim is best."},{"type":"know","q":"Which statement is true?","options":["A science argument connects a claim with evidence","A science argument is an angry fight","A science argument never has a claim"],"ans":0,"hint":"The answer is \"A science argument connects a claim with evidence\". An argument explains a claim using evidence."},{"type":"know","q":"Fill in the blank: An argument uses evidence to explain ____ an idea (claim) is best.","options":["why","when","where"],"ans":0,"hint":"The answer is \"why\". An argument explains why a claim is best."},{"type":"know","q":"Which word means \"using evidence to explain why a claim is best\"?","options":["Output","Transfer","Argument"],"ans":2,"hint":"The answer is \"Argument\". That is the meaning of argument."},{"type":"example","q":"Which is an example of a science argument?","options":["Metal is best because I like it","Metal conducts heat well because our metal spoon got hot fastest","Metal is best, and that is all"],"ans":1,"hint":"The answer is \"Metal conducts heat well because our metal spoon got hot fastest\". It gives evidence from a test to explain the claim."},{"type":"example","q":"Which is NOT a science argument?","options":["It is true because I said so","The LED is more efficient because it stayed cooler in our test","Rubber is an insulator because the bulb stayed off with it"],"ans":0,"hint":"The answer is \"It is true because I said so\". Saying so is not evidence."},{"type":"example","q":"Which pair shows the parts of a science argument?","options":["A song and a dance","A snack and a nap","A claim and evidence"],"ans":2,"hint":"The answer is \"A claim and evidence\". An argument uses evidence to support a claim."},{"type":"example","q":"Which sentence belongs in an argument about which ball bounces highest?","options":["The red ball is my favorite","The red ball bounced 50 cm and the blue ball 30 cm","Blue is a pretty color"],"ans":1,"hint":"The answer is \"The red ball bounced 50 cm and the blue ball 30 cm\". Measurements are evidence that support the claim."},{"type":"example","q":"Which is an example of making an argument in class?","options":["Copying a friend's answer","Showing your test data to explain your answer","Picking an answer at random"],"ans":1,"hint":"The answer is \"Showing your test data to explain your answer\". Using data to explain your answer is an argument."},{"type":"apply","q":"Jada claims a covered pot of water heats faster. What should she do to make an argument?","options":["Say it louder","Ask everyone to vote without testing","Show test results that support her claim"],"ans":2,"hint":"The answer is \"Show test results that support her claim\". Arguments use evidence, like test results."},{"type":"apply","q":"Two kids disagree about which bulb is more efficient. What is the best way to settle it?","options":["Pick the shinier bulb","Whoever talks first wins","Use evidence from a fair test"],"ans":2,"hint":"The answer is \"Use evidence from a fair test\". Evidence shows which claim is best."},{"type":"apply","q":"At the science fair, Omar argues that sound travels fastest through solids. What would make his argument strongest?","options":["Data showing sound arrived fastest through the solid","Saying solids are his favorite","A drawing of a guitar"],"ans":0,"hint":"The answer is \"Data showing sound arrived fastest through the solid\". Data is evidence that supports his claim."},{"type":"apply","q":"Ella says black shirts get hotter in the sun. Her teacher asks, \"Why do you think so?\" What should Ella give?","options":["Evidence, like thermometer readings","Just her opinion","A totally different claim"],"ans":0,"hint":"The answer is \"Evidence, like thermometer readings\". An argument explains a claim with evidence."},{"type":"apply","q":"Why do scientists make arguments?","options":["To win prizes by shouting","To avoid doing tests","To show with evidence which idea is best"],"ans":2,"hint":"The answer is \"To show with evidence which idea is best\". Arguments use evidence to explain why a claim is best."}],"claim":[{"type":"know","q":"What is a claim?","options":["An answer or statement you believe is correct","A tool for measuring heat","A wire that carries electricity"],"ans":0,"hint":"The answer is \"An answer or statement you believe is correct\". A claim is a statement you believe is correct."},{"type":"know","q":"Which statement is true?","options":["A claim should be supported by evidence","A claim must always be a question","A claim is a kind of energy"],"ans":0,"hint":"The answer is \"A claim should be supported by evidence\". Evidence is used to support a claim."},{"type":"know","q":"Fill in the blank: A claim is an answer or statement that you ____ is correct.","options":["doubt","believe","forget"],"ans":1,"hint":"The answer is \"believe\". A claim is what you believe is correct."},{"type":"know","q":"Which word means \"an answer or statement you believe is correct\"?","options":["Claim","Evidence","Input"],"ans":0,"hint":"The answer is \"Claim\". That is the meaning of claim."},{"type":"know","q":"Which question does a claim answer?","options":["What tools did you use?","What do you think is correct?","How long did the test take?"],"ans":1,"hint":"The answer is \"What do you think is correct?\". A claim is your answer that you believe is correct."},{"type":"example","q":"Which of these is a claim?","options":["Is rubber an insulator?","Go get the rubber band.","Rubber is an electrical insulator."],"ans":2,"hint":"The answer is \"Rubber is an electrical insulator.\". A claim is a statement, not a question or a command."},{"type":"example","q":"Which of these is NOT a claim?","options":["What color is the sky?","Light travels in straight lines.","Wood is a bad heat conductor."],"ans":0,"hint":"The answer is \"What color is the sky?\". A question is not a statement you believe is correct."},{"type":"example","q":"Which part of a science fair poster is the claim?","options":["Materials: string and cups","Sound travels fastest through solids","Date: May 5"],"ans":1,"hint":"The answer is \"Sound travels fastest through solids\". That is the statement the student believes is correct."},{"type":"example","q":"Which group lists only claims?","options":["How tall is it? Where is it?","Close the door. Sit down.","Plants need light. Ice melts in the sun."],"ans":2,"hint":"The answer is \"Plants need light. Ice melts in the sun.\". Those are statements someone believes are correct."},{"type":"example","q":"Mia says, \"I think the LED bulb is more efficient.\" What is this?","options":["Evidence","An output","A claim"],"ans":2,"hint":"The answer is \"A claim\". Mia states what she believes, with no data yet."},{"type":"apply","q":"Leo's teacher asks for his claim about which ball bounces highest. What should he say?","options":["I used a meter stick","I think the rubber ball bounces highest","We dropped each ball 3 times"],"ans":1,"hint":"The answer is \"I think the rubber ball bounces highest\". A claim is the answer he believes is correct."},{"type":"apply","q":"Ava claims dark shirts get warmer in the sun. What should she do next to support it?","options":["Turn her claim into a question","Keep her claim a secret","Collect evidence by testing"],"ans":2,"hint":"The answer is \"Collect evidence by testing\". Evidence supports a claim."},{"type":"apply","q":"Two students make different claims about which cup keeps cocoa warm longer. How can they find out which is best?","options":["Choose the prettier cup","Flip a coin","Test both cups and compare evidence"],"ans":2,"hint":"The answer is \"Test both cups and compare evidence\". Evidence shows which claim is best."},{"type":"apply","q":"Sam's test results show his claim was wrong. What should he do?","options":["Change his claim to match the evidence","Ignore the evidence","Hide his results"],"ans":0,"hint":"The answer is \"Change his claim to match the evidence\". A good claim must agree with the evidence."},{"type":"apply","q":"Nora's question is \"Does water conduct electricity?\" Which claim agrees with the study guide?","options":["Water blocks all electricity","Water is an electrical conductor","Water is an insulator like rubber"],"ans":1,"hint":"The answer is \"Water is an electrical conductor\". The study guide says water is a strong conductor of electricity."}],"evidence":[{"type":"know","q":"What is evidence?","options":["Information or facts that support a claim","A guess with no facts","A wish you make"],"ans":0,"hint":"The answer is \"Information or facts that support a claim\". Evidence is information or facts that support a claim."},{"type":"know","q":"What does evidence do for a claim?","options":["Supports it","Hides it","Turns it into a question"],"ans":0,"hint":"The answer is \"Supports it\". Evidence supports an answer or claim."},{"type":"know","q":"Which statement is true?","options":["Evidence is the same as a guess","Feelings are the best evidence","Test results can be evidence"],"ans":2,"hint":"The answer is \"Test results can be evidence\". Facts from tests are information that support a claim."},{"type":"know","q":"Fill in the blank: Evidence is information or facts that ____ an answer or claim.","options":["support","erase","ignore"],"ans":0,"hint":"The answer is \"support\". Evidence supports a claim."},{"type":"know","q":"Which word means \"information or facts that support a claim\"?","options":["Claim","Output","Evidence"],"ans":2,"hint":"The answer is \"Evidence\". That is the meaning of evidence."},{"type":"example","q":"Which of these is evidence?","options":["I hope it is hot today","The thermometer read 30 degrees","Hot is my favorite"],"ans":1,"hint":"The answer is \"The thermometer read 30 degrees\". A measurement is a fact that can support a claim."},{"type":"example","q":"Which of these is NOT evidence?","options":["I just feel like it is true","Our chart shows the LED stayed cooler","We measured 3 cm of growth"],"ans":0,"hint":"The answer is \"I just feel like it is true\". A feeling is not a fact."},{"type":"example","q":"Which group lists only kinds of evidence?","options":["Wishes, guesses, favorites","Questions, jokes, songs","Measurements, observations, test results"],"ans":2,"hint":"The answer is \"Measurements, observations, test results\". These are all facts and information."},{"type":"example","q":"Claim: \"Metal is a good heat conductor.\" Which is evidence for it?","options":["The metal spoon is shiny","A metal spoon in hot cocoa got hot quickly","Metal spoons cost more"],"ans":1,"hint":"The answer is \"A metal spoon in hot cocoa got hot quickly\". That fact shows metal moves heat well."},{"type":"ex
